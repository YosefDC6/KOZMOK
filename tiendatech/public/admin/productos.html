<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div id="panel-stock-critico"></div>

        <div id="panel-logistica"></div>

        <div class="table-wrap">
            <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)">
                <span style="font-size:.78rem;color:var(--text-muted)">Reabastecimiento:</span>
                <div id="chips-restock" style="display:flex;gap:6px"></div>
            </div>
            <table>
                <thead><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Proveedor</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
                <tbody id="tabla-productos"><tr><td colspan="8">Cargando…</td></tr></tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-producto">
    <div class="modal" style="max-width:640px" id="modal-producto-body"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('productos');
document.getElementById('topbar').innerHTML = adminHeader(
    'Inventario y productos', 'Catálogo de laptops, PCs, componentes y periféricos.',
    '<button class="btn btn-primary" onclick="abrirNuevoProducto()">Nuevo producto</button>'
);
let CATEGORIAS = [];
let PROVEEDORES = [];
let PRODUCTOS_CACHE = [];
let FILTRO_RESTOCK = 'todos';

async function cargarCategorias() {
    CATEGORIAS = await api('/categorias');
}

async function cargarProveedores() {
    PROVEEDORES = await api('/proveedores');
}

async function cargarStockCritico() {
    const mp = await api('/admin/metricas-productos');
    const el = document.getElementById('panel-stock-critico');
    if (!mp.inventario_critico.length) {
        el.innerHTML = `
            <div class="pago-box pagado">
                <h4>${icon('package', 16)} Cadena de suministro al día</h4>
                <div class="pb-sub">Ningún producto está en o por debajo de su stock mínimo. ${mp.stats.stock_total} unidades en inventario, ${mp.stats.total_productos} productos activos.</div>
            </div>`;
        return;
    }
    el.innerHTML = `
        <div class="pago-box pendiente">
            <h4>${icon('alert', 16)} Alerta de stock crítico — ${mp.inventario_critico.length} producto(s)</h4>
            <div class="pb-sub">Al llegar al mínimo definido, un producto entra aquí y, si tiene proveedor asignado, se le genera una orden de compra automáticamente.</div>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
                ${mp.inventario_critico.map((p) => `
                    <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px">
                        <div>
                            <div>${p.nombre} <span style="color:var(--text-muted);font-size:.78rem">${p.marca || ''}</span></div>
                            <div style="font-size:.78rem;color:var(--text-muted)">
                                Proveedor: ${p.proveedor_nombre || 'sin asignar'}${p.tiempo_entrega_dias ? ` (entrega en ${p.tiempo_entrega_dias} días)` : ''} · Reabastecimiento ${p.restock === 'pull' ? 'pull (bajo pedido)' : 'push (programado)'}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:10px">
                            <span class="mono ${p.stock === 0 ? 'stock-out' : 'stock-low'}">${p.stock} / ${p.stock_minimo}</span>
                            ${p.orden_abierta_folio
                                ? `<span class="tag" style="color:var(--info);border-color:var(--info)" title="Ya se generó una orden de compra para este producto">${p.orden_abierta_folio} en curso</span>`
                                : `<a class="btn btn-ghost btn-sm" href="/admin/ordenes-compra.html?nuevo=${p.id}">Generar orden</a>`}
                            <button class="btn btn-outline btn-sm" onclick="restock(${p.id})">Restock</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>`;
}

async function cargarProductos() {
    PRODUCTOS_CACHE = await api('/admin/productos');
    renderChipsRestock();
    renderTablaProductos();
    renderLogistica();
}

function renderChipsRestock() {
    const chips = [
        { valor: 'todos', etiqueta: 'Todos' },
        { valor: 'push', etiqueta: 'Push' },
        { valor: 'pull', etiqueta: 'Pull' },
    ];
    document.getElementById('chips-restock').innerHTML = chips.map((c) => `
        <button class="btn ${FILTRO_RESTOCK === c.valor ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="filtrarRestock('${c.valor}')">${c.etiqueta}</button>
    `).join('');
}

function filtrarRestock(valor) {
    FILTRO_RESTOCK = valor;
    renderChipsRestock();
    renderTablaProductos();
}

function renderTablaProductos() {
    const lista = FILTRO_RESTOCK === 'todos' ? PRODUCTOS_CACHE : PRODUCTOS_CACHE.filter((p) => (p.restock || 'push') === FILTRO_RESTOCK);
    document.getElementById('tabla-productos').innerHTML = lista.length ? lista.map((p) => `
        <tr>
            <td class="mono">${p.id}</td>
            <td>${p.nombre}<div style="color:var(--text-muted);font-size:.78rem">${p.marca || ''}</div></td>
            <td>${p.categoria_nombre || '—'}</td>
            <td>${p.proveedor_nombre || '<span style="color:var(--text-muted)">sin asignar</span>'}<div style="color:var(--text-muted);font-size:.78rem">${p.restock === 'pull' ? 'pull' : 'push'}</div></td>
            <td class="mono">${formatoMoneda(p.precio)}</td>
            <td class="mono ${p.stock === 0 ? 'stock-out' : p.stock <= p.stock_minimo ? 'stock-low' : 'stock-ok'}">${p.stock}</td>
            <td>${p.activo ? '<span class="tag" style="color:var(--success);border-color:var(--success)">Activo</span>' : '<span class="tag">Inactivo</span>'}</td>
            <td>
                <button class="btn btn-outline btn-sm" onclick="editarProducto(${p.id})">Editar</button>
                <button class="btn btn-ghost btn-sm" onclick="restock(${p.id})">Restock</button>
            </td>
        </tr>
    `).join('') : `<tr><td colspan="8" style="color:var(--text-muted)">Ningún producto coincide con este filtro.</td></tr>`;
}

function renderLogistica() {
    const el = document.getElementById('panel-logistica');
    if (!PRODUCTOS_CACHE.length) { el.innerHTML = ''; return; }
    const porCategoria = {};
    PRODUCTOS_CACHE.forEach((p) => {
        const cat = p.categoria_nombre || 'Sin categoría';
        if (!porCategoria[cat]) porCategoria[cat] = { push: 0, pull: 0 };
        porCategoria[cat][(p.restock === 'pull' ? 'pull' : 'push')]++;
    });
    const filas = Object.entries(porCategoria).sort((a, b) => (b[1].push + b[1].pull) - (a[1].push + a[1].pull));
    el.innerHTML = `
        <div class="pago-box">
            <h4>${icon('truck', 16)} Logística por categoría — push vs. pull</h4>
            <div class="pb-sub">Push: se repone por calendario/pronóstico. Pull: se repone bajo pedido o cuando baja el stock. Usa los filtros de la tabla para ver solo una u otra.</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
                ${filas.map(([cat, c]) => {
                    const total = c.push + c.pull;
                    const pctPush = Math.round((c.push / total) * 100);
                    return `
                        <div>
                            <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px">
                                <span>${cat}</span>
                                <span class="mono" style="color:var(--text-muted)">${c.push} push · ${c.pull} pull</span>
                            </div>
                            <div style="display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line)">
                                <div style="width:${pctPush}%;background:var(--info)" title="${c.push} producto(s) push"></div>
                                <div style="width:${100 - pctPush}%;background:var(--copper)" title="${c.pull} producto(s) pull"></div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>`;
}

function formularioProducto(p = {}) {
    const opcionesCat = CATEGORIAS.map((c) => `<option value="${c.id}" ${p.categoria_id === c.id ? 'selected' : ''}>${c.nombre}</option>`).join('');
    const opcionesProveedor = `<option value="">Sin asignar</option>` + PROVEEDORES.map((pv) => `<option value="${pv.id}" ${p.proveedor_id === pv.id ? 'selected' : ''}>${pv.nombre}</option>`).join('');
    const usos = ['gaming', 'oficina', 'diseno', 'programacion', 'estudiante', 'streaming', 'servidor'];
    const usosActuales = p.uso_recomendado || [];
    return `
        <div class="field"><label>Nombre</label><input id="p-nombre" value="${p.nombre || ''}" /></div>
        <div class="field"><label>Descripción</label><textarea id="p-descripcion" rows="2">${p.descripcion || ''}</textarea></div>
        <div class="field-row">
            <div class="field"><label>Categoría</label><select id="p-categoria">${opcionesCat}</select></div>
            <div class="field"><label>Marca</label><input id="p-marca" value="${p.marca || ''}" /></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Precio</label><input type="number" id="p-precio" value="${p.precio || ''}" /></div>
            <div class="field"><label>Stock</label><input type="number" id="p-stock" value="${p.stock ?? 0}" /></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Stock mínimo</label><input type="number" id="p-stock-min" value="${p.stock_minimo ?? 5}" /></div>
            <div class="field"><label>Imagen (URL)</label><input id="p-imagen" value="${p.imagen_url || ''}" /></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Proveedor</label><select id="p-proveedor">${opcionesProveedor}</select></div>
            <div class="field">
                <label>Reabastecimiento</label>
                <select id="p-restock">
                    <option value="push" ${(p.restock || 'push') === 'push' ? 'selected' : ''}>Push — se repone por calendario</option>
                    <option value="pull" ${p.restock === 'pull' ? 'selected' : ''}>Pull — se repone cuando baja el stock</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field"><label>Procesador</label><input id="p-procesador" value="${p.procesador || ''}" /></div>
            <div class="field"><label>RAM (GB)</label><input type="number" id="p-ram" value="${p.ram_gb || ''}" /></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Almacenamiento</label><input id="p-almacenamiento" value="${p.almacenamiento || ''}" /></div>
            <div class="field"><label>Tarjeta gráfica</label><input id="p-gpu" value="${p.tarjeta_grafica || ''}" /></div>
        </div>
        <div class="field"><label>Pantalla</label><input id="p-pantalla" value="${p.pantalla || ''}" /></div>
        <div class="field">
            <label>Uso recomendado (para el chatbot)</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
                ${usos.map((u) => `<label style="display:flex;align-items:center;gap:5px;width:auto;font-size:.82rem">
                    <input type="checkbox" style="width:auto" class="uso-check" value="${u}" ${usosActuales.includes(u) ? 'checked' : ''}/> ${u}
                </label>`).join('')}
            </div>
        </div>
        <div class="field"><label><input type="checkbox" id="p-activo" style="width:auto;display:inline-block" ${p.activo !== false ? 'checked' : ''}/> Activo en catálogo</label></div>
    `;
}

function abrirNuevoProducto() {
    document.getElementById('modal-producto-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-producto').classList.remove('open')">${icon('x', 18)}</button>
        <h3>Nuevo producto</h3>
        ${formularioProducto()}
        <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="guardarProducto()">Crear producto</button>
    `;
    document.getElementById('modal-producto').classList.add('open');
}

async function editarProducto(id) {
    const productos = await api('/admin/productos');
    const p = productos.find((x) => x.id === id);
    document.getElementById('modal-producto-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-producto').classList.remove('open')">${icon('x', 18)}</button>
        <h3>Editar producto</h3>
        ${formularioProducto(p)}
        <div style="display:flex;gap:10px;margin-top:10px">
            <button class="btn btn-primary" style="flex:1" onclick="guardarProducto(${id})">Guardar cambios</button>
            <button class="btn btn-danger" onclick="eliminarProducto(${id})">Eliminar</button>
        </div>
    `;
    document.getElementById('modal-producto').classList.add('open');
}

function leerFormularioProducto() {
    const usoRecomendado = Array.from(document.querySelectorAll('.uso-check:checked')).map((c) => c.value);
    return {
        nombre: document.getElementById('p-nombre').value,
        descripcion: document.getElementById('p-descripcion').value,
        categoria_id: Number(document.getElementById('p-categoria').value),
        marca: document.getElementById('p-marca').value,
        precio: Number(document.getElementById('p-precio').value),
        stock: Number(document.getElementById('p-stock').value),
        stock_minimo: Number(document.getElementById('p-stock-min').value),
        imagen_url: document.getElementById('p-imagen').value,
        proveedor_id: document.getElementById('p-proveedor').value ? Number(document.getElementById('p-proveedor').value) : null,
        restock: document.getElementById('p-restock').value,
        procesador: document.getElementById('p-procesador').value,
        ram_gb: document.getElementById('p-ram').value ? Number(document.getElementById('p-ram').value) : null,
        almacenamiento: document.getElementById('p-almacenamiento').value,
        tarjeta_grafica: document.getElementById('p-gpu').value,
        pantalla: document.getElementById('p-pantalla').value,
        uso_recomendado: usoRecomendado,
        activo: document.getElementById('p-activo').checked,
    };
}

async function guardarProducto(id) {
    const body = leerFormularioProducto();
    if (!body.nombre || !body.precio) { toast('Nombre y precio son obligatorios', 'warn'); return; }
    try {
        if (id) await api(`/admin/productos/${id}`, { method: 'PUT', body });
        else await api('/admin/productos', { method: 'POST', body });
        document.getElementById('modal-producto').classList.remove('open');
        toast('Producto guardado', 'ok');
        cargarProductos();
        cargarStockCritico();
    } catch (e) { toast(e.message, 'error'); }
}

async function eliminarProducto(id) {
    if (!(await confirmar('¿Eliminar este producto?', { okText: 'Eliminar', peligro: true }))) return;
    try {
        await api(`/admin/productos/${id}`, { method: 'DELETE' });
        document.getElementById('modal-producto').classList.remove('open');
        toast('Producto eliminado', 'ok');
        cargarProductos();
        cargarStockCritico();
    } catch (e) { toast(e.message, 'error'); }
}

async function restock(id) {
    const cantidad = await pedirDato('¿Cuántas unidades vas a agregar al stock?', { tipo: 'number', placeholder: 'Ej. 10' });
    if (!cantidad || isNaN(cantidad) || Number(cantidad) < 1) return;
    try {
        await api(`/admin/productos/${id}/restock`, { method: 'POST', body: { cantidad: Number(cantidad), motivo: 'Restock manual desde admin' } });
        toast(`+${cantidad} al stock`, 'ok');
        cargarProductos();
        cargarStockCritico();
    } catch (e) { toast(e.message, 'error'); }
}

(async () => { await Promise.all([cargarCategorias(), cargarProveedores()]); await Promise.all([cargarProductos(), cargarStockCritico()]); })();
</script>
</body>
</html>
