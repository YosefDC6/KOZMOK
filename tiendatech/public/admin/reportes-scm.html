<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reportes SCM · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="stat-grid" id="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px" id="charts-wrap">
            <div class="card"><h3>Productos más vendidos</h3><canvas id="c-vendidos" height="220"></canvas></div>

            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px">
                    <h3 style="margin:0">Estrategia de reabastecimiento</h3>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px">
                    <div style="display:flex;gap:6px" id="tipo-estadistica">
                        <button class="btn btn-primary btn-sm" data-tipo="cantidad">Cantidad de productos</button>
                        <button class="btn btn-outline btn-sm" data-tipo="valor">Valor de inventario</button>
                    </div>
                    <div style="display:flex;gap:6px" id="tipo-vista">
                        <button class="btn btn-primary btn-sm" data-vista="grafica">Gráfica</button>
                        <button class="btn btn-outline btn-sm" data-vista="tabla">Tabla exacta</button>
                    </div>
                </div>
                <canvas id="c-pushpull" height="220"></canvas>
                <div class="table-wrap" id="tabla-pushpull-wrap" hidden>
                    <table>
                        <thead><tr><th>Estrategia</th><th>Productos</th><th>% del catálogo</th><th>Valor de inventario</th><th>% del valor</th></tr></thead>
                        <tbody id="tabla-pushpull"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin:0 0 4px">Inventario crítico</h3>
            <p style="color:var(--text-muted);font-size:.85rem;margin:0 0 10px">Productos en o por debajo de su stock mínimo ahora mismo.</p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Producto</th><th>Stock actual</th><th>Stock mínimo</th><th>Proveedor</th></tr></thead>
                    <tbody id="tabla-critico"><tr><td colspan="4">Cargando…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('reportes-scm');
document.getElementById('topbar').innerHTML = adminHeader(
    'Reportes SCM', 'Métricas y análisis de la cadena de suministro: ventas, estrategia de reabastecimiento e inventario crítico.'
);

let chartVendidos, chartPushPull;
let RESUMEN = null;
let TIPO_ESTADISTICA = 'cantidad'; // 'cantidad' | 'valor'
let TIPO_VISTA = 'grafica';        // 'grafica' | 'tabla'

function seleccionarBotones(contenedorId, dataAttr, valor) {
    document.querySelectorAll(`#${contenedorId} button`).forEach((b) => {
        const activo = b.dataset[dataAttr] === valor;
        b.className = `btn btn-sm ${activo ? 'btn-primary' : 'btn-outline'}`;
    });
}

document.getElementById('tipo-estadistica').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    TIPO_ESTADISTICA = btn.dataset.tipo;
    seleccionarBotones('tipo-estadistica', 'tipo', TIPO_ESTADISTICA);
    renderPushPull();
});

document.getElementById('tipo-vista').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    TIPO_VISTA = btn.dataset.vista;
    seleccionarBotones('tipo-vista', 'vista', TIPO_VISTA);
    renderPushPull();
});

function renderPushPull() {
    if (!RESUMEN) return;
    const pp = RESUMEN.push_pull;
    const canvas = document.getElementById('c-pushpull');
    const tablaWrap = document.getElementById('tabla-pushpull-wrap');

    if (TIPO_VISTA === 'tabla') {
        canvas.style.display = 'none'; // Chart.js pone su propio style inline; [hidden] solo no basta
        tablaWrap.hidden = false;
        const totalProductos = pp.push + pp.pull;
        const totalValor = pp.valor_push + pp.valor_pull;
        const fila = (etiqueta, color, productos, valor) => `
            <tr>
                <td><span class="tag" style="color:${color};border-color:${color}">${etiqueta}</span></td>
                <td class="mono">${productos}</td>
                <td class="mono">${totalProductos ? Math.round((productos / totalProductos) * 100) : 0}%</td>
                <td class="mono">${formatoMoneda(valor)}</td>
                <td class="mono">${totalValor ? Math.round((valor / totalValor) * 100) : 0}%</td>
            </tr>
        `;
        document.getElementById('tabla-pushpull').innerHTML =
            fila('Push', 'var(--info)', pp.push, pp.valor_push) +
            fila('Pull', 'var(--copper)', pp.pull, pp.valor_pull);
        return;
    }

    canvas.style.display = '';
    tablaWrap.hidden = true;
    const info = getComputedStyle(document.documentElement).getPropertyValue('--info').trim() || '#5AA9E6';
    const copper = getComputedStyle(document.documentElement).getPropertyValue('--copper').trim() || '#6E8BF0';
    const datos = TIPO_ESTADISTICA === 'valor' ? [pp.valor_push, pp.valor_pull] : [pp.push, pp.pull];

    if (chartPushPull) chartPushPull.destroy();
    chartPushPull = new Chart(canvas, {
        type: 'bar',
        data: {
            labels: ['Push (por calendario)', 'Pull (bajo pedido)'],
            datasets: [{ data: datos, backgroundColor: [info, copper] }],
        },
        options: {
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: (ctx) => TIPO_ESTADISTICA === 'valor' ? formatoMoneda(ctx.parsed.y) : ctx.parsed.y + ' producto(s)' } },
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: TIPO_ESTADISTICA === 'valor' ? undefined : 0,
                        callback: (v) => TIPO_ESTADISTICA === 'valor' ? formatoMoneda(v) : v,
                    },
                },
            },
        },
    });
}

async function cargar() {
    const [r, mp] = await Promise.all([api('/admin/scm/resumen'), api('/admin/metricas-productos')]);
    RESUMEN = r;

    document.getElementById('stat-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Productos activos</div><div class="stat-value">${r.stats.total_productos}</div></div>
        <div class="stat-card"><div class="stat-label">Proveedores</div><div class="stat-value">${r.stats.total_proveedores}</div></div>
        <div class="stat-card"><div class="stat-label">Órdenes de compra abiertas</div><div class="stat-value" style="color:var(--warning)">${r.stats.ordenes_pendientes}</div></div>
        <div class="stat-card"><div class="stat-label">Productos en stock bajo</div><div class="stat-value" style="color:var(--danger)">${r.stats.stock_bajo}</div></div>
        <div class="stat-card"><div class="stat-label">Rotación de inventario</div><div class="stat-value" style="color:var(--accent)">${r.rotacion_pct}%</div><div class="stat-sub">unidades vendidas vs. stock actual</div></div>
    `;

    if (chartVendidos) chartVendidos.destroy();
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4E6BE6';
    chartVendidos = new Chart(document.getElementById('c-vendidos'), {
        type: 'bar',
        data: {
            labels: r.mas_vendidos.map((p) => p.nombre),
            datasets: [{ data: r.mas_vendidos.map((p) => Number(p.unidades_vendidas)), backgroundColor: acc }],
        },
        options: {
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
        },
    });

    renderPushPull();

    document.getElementById('tabla-critico').innerHTML = mp.inventario_critico.length ? mp.inventario_critico.map((p) => `
        <tr>
            <td>${p.nombre}<div style="color:var(--text-muted);font-size:.78rem">${p.marca || ''}</div></td>
            <td class="mono ${p.stock === 0 ? 'stock-out' : 'stock-low'}">${p.stock}</td>
            <td class="mono">${p.stock_minimo}</td>
            <td>${p.proveedor_nombre || '<span style="color:var(--text-muted)">sin asignar</span>'}</td>
        </tr>
    `).join('') : `<tr><td colspan="4" style="color:var(--text-muted)">Ningún producto está en stock crítico ahora mismo.</td></tr>`;
}

cargar();
</script>
</body>
</html>
