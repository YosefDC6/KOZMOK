<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" style="padding-top:36px;padding-bottom:60px;max-width:900px">
    <div class="page-hero">
        <div class="hero-badge" data-ic="cart" data-ic-size="28"></div>
        <h1>Tu carrito</h1>
        <p>Revisa tus productos y confirma el envío.</p>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <a href="/index.html?ver=todo" class="btn btn-ghost btn-sm">Seguir comprando</a>
        <button class="btn btn-ghost btn-sm" id="btn-vaciar" hidden>Vaciar carrito</button>
    </div>
    <div id="carrito-contenido"><div class="empty-state">Cargando…</div></div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/garantia.js"></script>
<script>
const cliente = Sesion.cliente();
if (!cliente) irALogin();

const ENVIO_GRATIS_DESDE = 10000;
const COSTO_ENVIO = 199;
let DIRECCIONES = [];
let METODOS = [];
let RECOMP = { puntos: 0, valor_punto: 0.10 };
let SUBTOTAL = 0;
let GAR_TOTAL = 0;
const MARCA_LABEL = { visa: 'Visa', mastercard: 'Mastercard', amex: 'American Express', otra: 'Tarjeta' };

async function cargarCarrito() {
    const [items, dirs, rec, metodos] = await Promise.all([
        api(`/carrito/${cliente.id}`),
        api(`/clientes/${cliente.id}/direcciones`).catch(() => []),
        api(`/clientes/${cliente.id}/recompensas`).catch(() => ({ puntos: 0, valor_punto: 0.10 })),
        api(`/clientes/${cliente.id}/metodos-pago`).catch(() => []),
    ]);
    DIRECCIONES = dirs;
    METODOS = metodos;
    RECOMP = rec;
    const cont = document.getElementById('carrito-contenido');
    document.getElementById('btn-vaciar').hidden = items.length === 0;

    if (items.length === 0) {
        cont.innerHTML = `
            <div class="empty-state">
                Tu carrito está vacío.<br>
                <a href="/index.html">Ver catálogo</a> · <a href="/favoritos.html">Ver favoritos</a>
            </div>`;
        return;
    }

    let subtotal = 0;
    let garTotal = 0;
    const filas = items.map((i) => {
        const linea = i.precio * i.cantidad;
        const gCosto = Number(i.garantia_costo || 0);
        subtotal += Number(linea);
        garTotal += gCosto;
        const claveActual = i.garantia_clave || 'none';
        return `
        <div class="card cart-line">
            <img class="cart-thumb" src="${i.imagen_url || '/img/producto.svg'}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='/img/producto.svg'"
                 onclick="location.href='/index.html#producto-${i.producto_id}'" alt="${i.nombre}" />
            <div class="cart-info">
                <div class="nm">${i.nombre}</div>
                <div class="mono" style="color:var(--text-muted);font-size:.82rem">${formatoMoneda(i.precio)} c/u</div>
                <div class="qty-stepper" style="margin-top:8px">
                    <button onclick="cambiarCantidad(${i.id}, ${i.cantidad - 1}, ${i.stock})" ${i.cantidad <= 1 ? 'disabled' : ''}>−</button>
                    <span class="qty-val">${i.cantidad}</span>
                    <button onclick="cambiarCantidad(${i.id}, ${i.cantidad + 1}, ${i.stock})" ${i.cantidad >= i.stock ? 'disabled' : ''}>+</button>
                </div>
                <div class="cart-gar">
                    <span class="ic-gar">${icon('shield', 13)}</span>
                    <select onchange="cambiarGarantia(${i.id}, this.value)">
                        ${PLANES_GARANTIA.map((g) => {
                            const c = costoGarantia(i.precio, g.clave) * i.cantidad;
                            return `<option value="${g.clave}" ${g.clave === claveActual ? 'selected' : ''}>${g.label}${c > 0 ? ' · +' + formatoMoneda(c) : ''}</option>`;
                        }).join('')}
                    </select>
                </div>
            </div>
            <div class="cart-sub">
                ${formatoMoneda(linea + gCosto)}
                ${gCosto > 0 ? `<div style="font-size:.72rem;color:var(--text-muted);font-weight:400">incl. garantía ${formatoMoneda(gCosto)}</div>` : ''}
                <div><button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="quitarDelCarrito(${i.id})">Quitar</button></div>
            </div>
        </div>`;
    }).join('');

    subtotal += garTotal;
    GAR_TOTAL = garTotal;
    SUBTOTAL = subtotal;
    const impuestos = subtotal * 0.16;
    const envio = subtotal >= ENVIO_GRATIS_DESDE ? 0 : COSTO_ENVIO;
    const falta = Math.max(ENVIO_GRATIS_DESDE - subtotal, 0);
    const pct = Math.min(100, Math.round(subtotal / ENVIO_GRATIS_DESDE * 100));

    // Máximo de puntos canjeables: múltiplos de 100, sin pasar del subtotal
    const maxCanje = Math.min(
        RECOMP.puntos - (RECOMP.puntos % 100),
        Math.floor(subtotal / RECOMP.valor_punto / 100) * 100
    );
    const bloquePuntos = maxCanje >= 100
        ? `<div class="field">
             <label>Usar puntos del Club (tienes ${RECOMP.puntos.toLocaleString('es-MX')} · valen ${formatoMoneda(RECOMP.puntos * RECOMP.valor_punto)})</label>
             <div style="display:flex;gap:8px;align-items:center">
               <input type="number" id="canje" min="0" max="${maxCanje}" step="100" value="0" style="width:120px" oninput="recalcular()" />
               <span style="font-size:.84rem;color:var(--text-muted)">puntos = <strong id="canje-mxn">$0</strong> de descuento (máx ${maxCanje})</span>
             </div>
           </div>`
        : (RECOMP.puntos > 0
            ? `<p style="font-size:.82rem;color:var(--text-muted)">Junta 100 puntos para poder canjearlos. Tienes ${RECOMP.puntos}.</p>`
            : '');

    const shipHint = envio === 0
        ? `<div class="ship-hint free"><span>${icon('check', 15)} Tu pedido tiene <strong>envío gratis</strong>.</span><div class="ship-bar"><span style="width:100%"></span></div></div>`
        : `<div class="ship-hint"><span>Te faltan <strong>${formatoMoneda(falta)}</strong> para envío gratis.</span><div class="ship-bar"><span style="width:${pct}%"></span></div></div>`;

    const opcionesDir = DIRECCIONES.length
        ? `<div class="field"><label>Enviar a una dirección guardada</label>
             <select id="dir-guardada" onchange="usarDireccionGuardada()">
               <option value="">— Escribir otra dirección —</option>
               ${DIRECCIONES.map((d) => `<option value="${d.id}" ${d.predeterminada ? 'selected' : ''}>${d.alias || 'Dirección'} · ${d.calle}</option>`).join('')}
             </select>
           </div>`
        : `<p style="font-size:.82rem;color:var(--text-muted)">Tip: guarda direcciones en <a href="/direcciones.html">tu perfil</a> para el próximo pedido.</p>`;

    cont.innerHTML = `
        ${filas}
        <div class="card" style="margin-top:16px">
            ${shipHint}
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text-muted)"><span>Productos</span><span class="mono">${formatoMoneda(subtotal - garTotal)}</span></div>
            ${garTotal > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text-muted)"><span>Garantías extendidas</span><span class="mono">${formatoMoneda(garTotal)}</span></div>` : ''}
            <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Subtotal</span><span class="mono">${formatoMoneda(subtotal)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text-muted)"><span>IVA (16%)</span><span class="mono">${formatoMoneda(impuestos)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text-muted)"><span>Envío</span><span class="mono">${envio === 0 ? 'Gratis' : formatoMoneda(envio)}</span></div>
            <div id="linea-desc" style="display:none;justify-content:space-between;margin-bottom:6px;color:var(--success)"><span>Descuento por puntos</span><span class="mono" id="desc-mxn">-$0</span></div>
            <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin-bottom:16px"><span>Total</span><span class="mono" id="total-txt">${formatoMoneda(subtotal + impuestos + envio)}</span></div>
            ${bloquePuntos}
            ${opcionesDir}
            <div class="field"><label>Dirección de envío</label><input type="text" id="direccion" placeholder="Calle, número, colonia, ciudad" /></div>
            <div class="field"><label>Método de pago</label>
                <select id="metodo-pago" onchange="cambioMetodo()">
                    ${METODOS.map((m) => `<option value="mp:${m.id}" ${m.predeterminada ? 'selected' : ''}>${MARCA_LABEL[m.marca] || 'Tarjeta'} ****${m.ultimos4}${m.predeterminada ? ' (predeterminada)' : ''}</option>`).join('')}
                    <option value="nueva">＋ Usar otra tarjeta…</option>
                    <option value="spei">Transferencia bancaria (SPEI)</option>
                    <option value="tienda">Pago en tienda</option>
                </select>
            </div>
            <div id="tarjeta-nueva" class="card-nueva" hidden>
                <div class="field"><label>Número de tarjeta</label>
                    <input id="tn-num" inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" oninput="fmtNum(this)" />
                </div>
                <div class="field"><label>Titular</label><input id="tn-titular" placeholder="Nombre en la tarjeta" /></div>
                <div class="field-row">
                    <div class="field"><label>Mes</label><select id="tn-mes">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${String(i + 1).padStart(2, '0')}</option>`).join('')}</select></div>
                    <div class="field"><label>Año</label><select id="tn-anio">${Array.from({ length: 12 }, (_, i) => { const a = new Date().getFullYear() + i; return `<option value="${a}">${a}</option>`; }).join('')}</select></div>
                    <div class="field"><label>CVV</label><input id="tn-cvv" inputmode="numeric" maxlength="4" placeholder="123" /></div>
                </div>
                <label style="display:flex;align-items:center;gap:8px;font-size:.85rem"><input type="checkbox" id="tn-guardar" style="width:auto" checked /> Guardar esta tarjeta para la próxima vez</label>
                <p style="font-size:.76rem;color:var(--text-muted);margin:8px 0 0">Demo: no se procesa ningún cargo real. Solo se guardan marca y últimos 4 dígitos.</p>
            </div>
            <button class="btn btn-primary btn-lg" style="width:100%" id="btn-comprar" onclick="confirmarCompra()">Confirmar pedido</button>
        </div>
    `;
    ENVIO_ACTUAL = envio; IVA_ACTUAL = impuestos;
    recalcular();
    usarDireccionGuardada();
    cambioMetodo();
}

function fmtNum(el) {
    const d = el.value.replace(/\D/g, '').slice(0, 19);
    el.value = d.replace(/(.{4})/g, '$1 ').trim();
}
function cambioMetodo() {
    const sel = document.getElementById('metodo-pago');
    const box = document.getElementById('tarjeta-nueva');
    if (!sel || !box) return;
    box.hidden = sel.value !== 'nueva';
}

let ENVIO_ACTUAL = 0, IVA_ACTUAL = 0;
function puntosCanje() {
    const el = document.getElementById('canje');
    if (!el) return 0;
    let v = Math.max(0, Math.min(Number(el.value) || 0, Number(el.max)));
    v = v - (v % 100);
    return v;
}
function recalcular() {
    const pts = puntosCanje();
    const desc = pts * RECOMP.valor_punto;
    const total = SUBTOTAL + IVA_ACTUAL + ENVIO_ACTUAL - desc;
    const cm = document.getElementById('canje-mxn'); if (cm) cm.textContent = formatoMoneda(desc);
    const ld = document.getElementById('linea-desc');
    if (ld) { ld.style.display = desc > 0 ? 'flex' : 'none'; document.getElementById('desc-mxn').textContent = '-' + formatoMoneda(desc); }
    const tt = document.getElementById('total-txt'); if (tt) tt.textContent = formatoMoneda(total);
    const bc = document.getElementById('btn-comprar'); if (bc && !bc.disabled) bc.textContent = 'Confirmar pedido · ' + formatoMoneda(total);
}

function usarDireccionGuardada() {
    const sel = document.getElementById('dir-guardada');
    const input = document.getElementById('direccion');
    if (!sel || !input) return;
    if (!sel.value) { input.readOnly = false; return; }
    const d = DIRECCIONES.find((x) => String(x.id) === sel.value);
    if (d) { input.value = [d.calle, d.ciudad, d.estado, d.codigo_postal].filter(Boolean).join(', '); input.readOnly = true; }
}

async function cambiarCantidad(itemId, nueva, stock) {
    nueva = Math.max(1, Math.min(Number(nueva), stock));
    try {
        await api(`/carrito/${itemId}`, { method: 'PUT', body: { cantidad: nueva } });
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function cambiarGarantia(itemId, clave) {
    try {
        await api(`/carrito/${itemId}`, { method: 'PUT', body: { garantia: clave } });
        toast(clave === 'none' ? 'Garantía quitada' : 'Garantía actualizada', 'ok');
        cargarCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function quitarDelCarrito(itemId) {
    try {
        await api(`/carrito/${itemId}`, { method: 'DELETE' });
        toast('Producto quitado del carrito', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
document.getElementById('btn-vaciar').addEventListener('click', async () => {
    if (!(await confirmar('¿Vaciar todo el carrito?', { okText: 'Vaciar', peligro: true }))) return;
    try {
        await api('/carrito', { method: 'DELETE' });
        toast('Carrito vaciado', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
});

// Resuelve el <select> de método de pago a un texto para guardar en el pedido.
// Si es tarjeta nueva la valida y (si se pidió) la guarda antes de comprar.
async function resolverMetodoPago() {
    const v = document.getElementById('metodo-pago').value;
    if (v === 'spei') return { texto: 'Transferencia SPEI', tipo: 'spei' };
    if (v === 'tienda') return { texto: 'Pago en tienda', tipo: 'tienda' };
    if (v.startsWith('mp:')) {
        const m = METODOS.find((x) => String(x.id) === v.slice(3));
        return { texto: (m ? `Tarjeta ${MARCA_LABEL[m.marca] || ''} ****${m.ultimos4}`.replace(/\s+/g, ' ').trim() : 'Tarjeta'), tipo: 'tarjeta' };
    }
    // Tarjeta nueva
    const numero = document.getElementById('tn-num').value.replace(/\s/g, '');
    const titular = document.getElementById('tn-titular').value.trim();
    const cvv = document.getElementById('tn-cvv').value.trim();
    if (numero.length < 13 || numero.length > 19) { toast('Revisa el número de tarjeta', 'warn'); return null; }
    if (!titular) { toast('Escribe el titular de la tarjeta', 'warn'); return null; }
    if (!/^\d{3,4}$/.test(cvv)) { toast('El CVV debe tener 3 o 4 dígitos', 'warn'); return null; }

    const mes = Number(document.getElementById('tn-mes').value);
    const anio = Number(document.getElementById('tn-anio').value);
    const marca = /^4/.test(numero) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(numero) ? 'Mastercard' : /^3[47]/.test(numero) ? 'American Express' : '';
    if (document.getElementById('tn-guardar').checked) {
        try {
            await api(`/clientes/${cliente.id}/metodos-pago`, {
                method: 'POST',
                body: { tipo: 'tarjeta', numero, titular, expira_mes: mes, expira_anio: anio, predeterminada: METODOS.length === 0 },
            });
        } catch (e) { /* si falla el guardado, igual se puede comprar */ }
    }
    return { texto: `Tarjeta ${marca} ****${numero.slice(-4)}`.replace(/\s+/g, ' '), tipo: 'tarjeta' };
}

async function confirmarCompra() {
    const items = await api(`/carrito/${cliente.id}`);
    const direccion = document.getElementById('direccion').value.trim();
    if (!direccion) { toast('Ingresa o elige una dirección de envío', 'warn'); return; }

    const mp = await resolverMetodoPago();
    if (!mp) return;

    const btn = document.getElementById('btn-comprar');
    btn.disabled = true; btn.textContent = 'Procesando…';
    try {
        const pedido = await api('/pedidos', {
            method: 'POST',
            body: {
                items: items.map((i) => ({ producto_id: i.producto_id, cantidad: i.cantidad, garantia: i.garantia_clave || 'none' })),
                metodo_pago: mp.texto, metodo_tipo: mp.tipo, direccion_envio: direccion,
                puntos_canjear: puntosCanje(),
            }
        });
        actualizarBadgeCarrito();
        location.href = `/gracias.html?id=${pedido.id}`;
    } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Confirmar pedido';
    }
}

if (cliente) cargarCarrito();
</script>
</body>
</html>
