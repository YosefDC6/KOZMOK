<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi cuenta · TiendaTech</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando tu cuenta…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script src="/js/qrcode.min.js"></script>
<script>
function qrSVG(texto) {
    try {
        const q = qrcode(0, 'M');
        q.addData(texto);
        q.make();
        return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { return ''; }
}

function tarjetaSocio(P, rec) {
    const num = String(P.id).padStart(4, '0');
    const numero = `4021 ${num.slice(0, 2)}88 71${num.slice(2, 4)} ${num}`;
    const desde = P.fecha_registro
        ? new Date(P.fecha_registro).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })
        : '—';
    const codigo = P.codigo_socio || '';
    const urlSocio = location.origin + '/socio.html?c=' + encodeURIComponent(codigo);
    return `
        <div class="socio-card">
            <div class="socio-main">
                <div class="socio-top">
                    <span class="socio-brand">${icon('ghost', 15)} TiendaTech</span>
                    <span class="socio-tier">${nivelBadge(rec.nivel.clave, 18)} Nivel ${rec.nivel.nombre}</span>
                </div>
                <div class="socio-num">${numero}</div>
                <div class="socio-grid">
                    <div><span>Titular</span><strong>${P.nombre}</strong></div>
                    <div><span>Socio desde</span><strong>${desde}</strong></div>
                    <div><span>Puntos</span><strong>${Number(rec.puntos).toLocaleString('es-MX')}</strong></div>
                    <div><span>Compras</span><strong>${formatoMoneda(rec.gasto_total)}</strong></div>
                </div>
            </div>
            ${codigo ? `
            <div class="socio-qr">
                <div class="sq-code">${qrSVG(urlSocio)}</div>
                <span class="sq-label">Escanéala en tienda</span>
                <span class="sq-id mono">${codigo}</span>
            </div>` : ''}
        </div>`;
}

montarCuenta('perfil', async (panel, P) => {
    const [pedidos, favs, rec] = await Promise.all([
        api(`/pedidos/cliente/${P.id}`),
        api(`/clientes/${P.id}/favoritos`),
        api(`/clientes/${P.id}/recompensas`),
    ]);
    const gastado = rec.gasto_total || pedidos.filter((x) => x.estado !== 'cancelado').reduce((a, x) => a + Number(x.total), 0);
    const numCompras = rec.compras_total || pedidos.length;
    const ultimos = pedidos.slice(0, 3);

    panel.innerHTML = `
        <div class="cuenta-head">
            <h1>Hola, ${P.nombre.split(' ')[0]}</h1>
            <p>Resumen de tu cuenta.</p>
        </div>

        ${tarjetaSocio(P, rec)}

        <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
            <div class="stat-card"><div class="stat-label">Nivel del Club</div><div class="stat-value" style="font-size:1.05rem;display:flex;align-items:center;gap:6px">${nivelBadge(rec.nivel.clave, 20)} ${rec.nivel.nombre}</div><div class="stat-sub">${Number(rec.puntos).toLocaleString('es-MX')} pts · vale ${formatoMoneda(rec.valor_en_dinero)}</div></div>
            <div class="stat-card"><div class="stat-label">Compras</div><div class="stat-value">${numCompras}</div></div>
            <div class="stat-card"><div class="stat-label">Total gastado</div><div class="stat-value" style="font-size:1.25rem">${formatoMoneda(gastado)}</div></div>
            <div class="stat-card"><div class="stat-label">Favoritos</div><div class="stat-value">${favs.length}</div></div>
        </div>

        <div class="cuenta-actions">
            <a class="btn btn-outline btn-sm" href="/index.html?ver=todo">Seguir comprando</a>
            <a class="btn btn-outline btn-sm" href="/pedidos.html">Ver mis pedidos</a>
            <a class="btn btn-outline btn-sm" href="/direcciones.html">Administrar direcciones</a>
        </div>

        <div class="card">
            <div class="section-head" style="margin-bottom:12px"><h3 style="margin:0">Últimos pedidos</h3><a href="/pedidos.html">Ver todos</a></div>
            ${ultimos.length === 0
                ? '<p style="margin:0">Aún no tienes pedidos. <a href="/index.html?ver=todo">Ir al catálogo</a></p>'
                : ultimos.map((p) => `
                    <div class="mini-order">
                        <div><span class="mono">${p.numero_orden}</span><span class="mo-sub">${formatoFecha(p.fecha_pedido)} · ${p.productos || ''}</span></div>
                        <div class="mo-right"><span class="mono">${formatoMoneda(p.total)}</span><span class="tag">${ESTADO_LABEL[p.estado] || p.estado}</span></div>
                    </div>
                `).join('')}
        </div>
    `;
});
</script>
</body>
</html>
