<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¡Gracias por tu compra! · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="thanks-wrap" id="thanks">
    <div class="empty-state">Cargando tu confirmación…</div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script>
const cliente = Sesion.cliente();
if (!cliente) irALogin();

const ESTADO_LABEL = { pendiente: 'Pendiente', confirmado: 'Confirmado', procesando: 'En preparación', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };

async function cargar() {
    const id = new URLSearchParams(location.search).get('id');
    const wrap = document.getElementById('thanks');
    if (!id) { location.replace('/pedidos.html'); return; }
    try {
        const d = await api(`/pedidos/${id}/detalle`);
        const pendiente = d.pago_estado === 'pendiente';
        const esSPEI = /spei/i.test(d.metodo_pago || '');
        wrap.innerHTML = `
            <div class="thanks-check">${icon(pendiente ? 'clock' : 'check', 34)}</div>
            <h1>${pendiente ? '¡Pedido registrado!' : '¡Gracias por tu compra!'}</h1>
            <div class="thanks-order">${d.numero_orden}</div>
            <p style="margin-bottom:22px">${pendiente
                ? (esSPEI
                    ? 'Falta un paso: realiza la transferencia SPEI con los datos de tu ficha de pago. En cuanto recibamos el pago confirmamos y preparamos tu pedido.'
                    : 'Falta un paso: presenta tu código de pago en caja. En cuanto recibamos el pago confirmamos y preparamos tu pedido.')
                : 'Recibimos tu pago y ya lo estamos preparando. Te avisaremos por correo cuando se envíe.'}</p>

            ${pendiente ? `
            <div class="card" style="max-width:420px;margin:0 auto 18px;text-align:left">
                <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">${esSPEI ? 'Referencia SPEI' : 'Código de pago'}</div>
                <div class="mono" style="font-size:1.15rem;margin:2px 0 6px">${d.pago_referencia}</div>
                <div style="font-size:.84rem;color:var(--text-muted)">Monto: <strong>${formatoMoneda(d.total)}</strong> · Vence: ${d.pago_vence ? new Date(d.pago_vence).toLocaleDateString('es-MX') : '—'}</div>
                <a class="btn btn-primary btn-sm" style="margin-top:10px" href="/recibo.html?id=${d.id}">Ver ficha de pago completa</a>
            </div>` : `
            <div class="card" style="max-width:460px;margin:0 auto 18px">
                <div class="rastreo">
                    ${[['check', 'Confirmado'], ['package', 'En preparación'], ['truck', 'Enviado'], ['home', 'Entregado']].map((s, i) => `
                        <div class="rastreo-step ${i === 0 ? 'actual' : ''}">
                            <div class="rs-ic">${icon(s[0], 15)}</div>
                            <div><div class="rs-label">${s[1]}</div></div>
                        </div>`).join('')}
                </div>
                <p style="font-size:.8rem;color:var(--text-muted);text-align:center;margin:4px 0 0">Sigue el avance en cualquier momento desde <a href="/pedidos.html">Mis pedidos</a>.</p>
            </div>`}

            <div class="card thanks-card">
                ${d.items.map((i) => `
                    <div class="tc-line"><span>${i.nombre} × ${i.cantidad}</span><span class="mono">${formatoMoneda(i.subtotal)}</span></div>
                `).join('')}
                <div class="tc-line" style="color:var(--text-muted)"><span>IVA</span><span class="mono">${formatoMoneda(d.impuestos)}</span></div>
                <div class="tc-line" style="color:var(--text-muted)"><span>Envío</span><span class="mono">${Number(d.envio) === 0 ? 'Gratis' : formatoMoneda(d.envio)}</span></div>
                ${Number(d.descuento) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Descuento por puntos</span><span class="mono">-${formatoMoneda(d.descuento)}</span></div>` : ''}
                <div class="tc-line" style="font-weight:700;font-size:1.05rem"><span>Total</span><span class="mono">${formatoMoneda(d.total)}</span></div>
                <div class="tc-line" style="color:var(--text-muted)"><span>Envío a</span><span style="text-align:right;max-width:60%">${d.direccion_envio || '—'}</span></div>
                <div class="tc-line" style="color:var(--text-muted)"><span>Estado</span><span><span class="tag">${ESTADO_LABEL[d.estado] || d.estado}</span></span></div>
            </div>

            ${(d.garantias && d.garantias.length) ? `
            <div class="card" style="max-width:460px;margin:16px auto 0;text-align:left">
                <div style="font-weight:600;font-size:.9rem;margin-bottom:6px">${icon('shield', 14)} Garantías extendidas incluidas</div>
                ${d.garantias.map((g) => `<div style="font-size:.82rem;color:var(--text-muted);margin-bottom:4px">${g.producto || 'Producto'} · ${g.plan}<br>Código: <span class="mono" style="color:var(--text)">${g.codigo}</span></div>`).join('')}
                <p style="font-size:.78rem;color:var(--text-muted);margin:6px 0 0">También aparecen en tu comprobante y en <a href="/garantias.html">Mis garantías</a>.</p>
            </div>` : ''}

            <p style="font-size:.86rem;color:var(--text-muted);margin:16px 0 0">${pendiente
                ? 'Los puntos del Club se acreditan al confirmarse el pago.'
                : 'Esta compra sumó puntos a tu <a href="/recompensas.html">Club de puntos</a>.'}</p>
            <div class="thanks-actions">
                <a class="btn btn-primary" href="/recibo.html?id=${d.id}">Ver comprobante</a>
                <a class="btn btn-outline" href="/pedidos.html">Mis pedidos</a>
                <a class="btn btn-ghost" href="/index.html">Seguir comprando</a>
            </div>
        `;
    } catch (e) {
        wrap.innerHTML = `<div class="empty-state">No pudimos cargar la confirmación.<br><a href="/pedidos.html">Ir a mis pedidos</a></div>`;
    }
}
if (cliente) cargar();
</script>
</body>
</html>
