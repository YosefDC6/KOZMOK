<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis pedidos · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
const FLUJO = ['confirmado', 'procesando', 'enviado', 'entregado'];
const CANCELABLES = ['pendiente', 'confirmado'];
let CID = null;
let RESN = {}; // producto_id -> calificacion en curso

const PASOS_RASTREO = [
    { k: 'confirmado', label: 'Confirmado',      ic: 'check',   f: 'fecha_confirmacion', fb: 'fecha_pedido' },
    { k: 'procesando', label: 'En preparación',  ic: 'package', f: null },
    { k: 'enviado',    label: 'Enviado',         ic: 'truck',   f: 'fecha_envio' },
    { k: 'entregado',  label: 'Entregado',       ic: 'home',    f: 'fecha_entrega' },
];
const MSG_RASTREO = {
    confirmado: 'Pedido confirmado. Pronto empezamos a prepararlo.',
    procesando: 'Estamos preparando tu pedido.',
    enviado:    'Tu pedido va en camino a tu dirección.',
    entregado:  'Entregado. ¡Gracias por tu compra!',
};

function rastreoPedido(p) {
    if (p.estado === 'cancelado') {
        return `<div class="rastreo-cancelado">${icon('x', 15)} Pedido cancelado${Number(p.descuento) > 0 ? ' · puntos devueltos' : ''}</div>`;
    }
    if (p.pago_estado === 'pendiente') {
        const esSPEI = /spei/i.test(p.metodo_pago || '');
        return `
            <div class="rastreo-aviso">
                ${icon('clock', 16)}
                <div>
                    <strong>Falta completar tu pago.</strong>
                    ${esSPEI ? 'Haz la transferencia SPEI' : 'Paga en caja'} con la referencia
                    <span class="ra-ref">${p.pago_referencia || '—'}</span>.
                    ${p.pago_reportado
                        ? ' Ya nos avisaste que pagaste; lo estamos verificando.'
                        : ' Tu pedido empieza a prepararse en cuanto confirmemos el pago.'}
                </div>
            </div>`;
    }
    const cur = PASOS_RASTREO.findIndex((s) => s.k === p.estado);
    const iCur = cur < 0 ? 0 : cur;
    const completo = p.estado === 'entregado';   // pedido terminado: todo en verde
    const pasos = PASOS_RASTREO.map((s, i) => {
        const done = completo || i < iCur;
        const cls = done ? 'done' : (i === iCur ? 'actual' : '');
        const fecha = (i <= iCur && s.f && p[s.f]) ? formatoFecha(p[s.f])
            : (i === 0 && s.fb && p[s.fb]) ? formatoFecha(p[s.fb]) : '';
        return `
            <div class="rastreo-step ${cls}">
                <div class="rs-ic">${done ? icon('check', 15) : icon(s.ic, 15)}</div>
                <div>
                    <div class="rs-label">${s.label}</div>
                    ${fecha ? `<div class="rs-date">${fecha}</div>` : ''}
                </div>
            </div>`;
    }).join('');
    return `<div class="rastreo">${pasos}</div><div class="rastreo-msg">${MSG_RASTREO[p.estado] || ''}</div>`;
}

function estrellas(n, editable, orderId, pid) {
    let s = '';
    for (let i = 1; i <= 5; i++) {
        s += `<span class="star ${i <= n ? 'on' : ''}" ${editable ? `data-val="${i}" onclick="setResn(${orderId},${pid},${i})"` : ''}>${icon('star', 15)}</span>`;
    }
    return `<span class="stars ${editable ? 'stars-input' : ''}" ${editable ? `id="st-${orderId}-${pid}"` : ''}>${s}</span>`;
}

montarCuenta('pedidos', async (panel, P) => {
    CID = P.id;
    const pedidos = await api(`/pedidos/cliente/${P.id}`);
    if (pedidos.length === 0) {
        panel.innerHTML = `<div class="cuenta-head"><h1>Mis pedidos</h1></div>
            <div class="empty-state">Todavía no has hecho ningún pedido.<br><a href="/index.html?ver=todo">Explorar el catálogo</a></div>`;
        return;
    }
    panel.innerHTML = `<div class="cuenta-head"><h1>Mis pedidos</h1><p>${pedidos.length} pedido(s).</p></div><div id="lista-pedidos"></div>`;
    document.getElementById('lista-pedidos').innerHTML = pedidos.map((p) => {
        const pendientePago = p.pago_estado === 'pendiente';
        return `
        <div class="order-row">
            <div class="order-top">
                <span class="mono">${p.numero_orden}</span>
                <span class="tag">${pendientePago ? 'Pago pendiente' : (ESTADO_LABEL[p.estado] || p.estado)}</span>
            </div>
            <div style="font-size:.85rem;color:var(--text-muted)">${formatoFecha(p.fecha_pedido)} · ${p.productos || '—'}</div>
            <div style="font-weight:700;margin-top:6px">${formatoMoneda(p.total)}</div>
            ${rastreoPedido(p)}
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
                <button class="btn btn-outline btn-sm" onclick="detallePedido(${p.id})">Ver detalle</button>
                <a class="btn btn-ghost btn-sm" href="/recibo.html?id=${p.id}">${pendientePago ? 'Ficha de pago' : 'Comprobante'}</a>
                ${pendientePago && !p.pago_reportado ? `<button class="btn btn-primary btn-sm" onclick="reportarPago(${p.id})">Ya realicé el pago</button>` : ''}
                ${p.estado === 'entregado' ? `<button class="btn btn-primary btn-sm" onclick="detallePedido(${p.id}, true)">Dejar reseña</button>` : ''}
                ${CANCELABLES.includes(p.estado) ? `<button class="btn btn-ghost btn-sm" onclick="cancelarPedido(${p.id})">Cancelar</button>` : ''}
            </div>
            <div id="det-${p.id}"></div>
        </div>`;
    }).join('');

    // Enlace directo a un pedido:  /pedidos.html#p123  abre su detalle
    const h = location.hash.match(/^#p(\d+)$/);
    if (h && document.getElementById('det-' + h[1])) detallePedido(Number(h[1]), true);
});

async function detallePedido(id, irAResenas) {
    const cont = document.getElementById('det-' + id);
    if (cont.dataset.open && !irAResenas) { cont.innerHTML = ''; delete cont.dataset.open; return; }
    const [d, mias] = await Promise.all([
        api(`/pedidos/${id}/detalle`),
        api(`/clientes/${CID}/resenas`).catch(() => []),
    ]);
    cont.dataset.open = '1';
    const rev = {};
    mias.forEach((r) => { rev[r.producto_id] = r; });
    const entregado = d.estado === 'entregado';

    cont.innerHTML = `
        <div class="table-wrap" style="margin-top:12px">
            <table>
                <thead><tr><th>Producto</th><th>Cant.</th><th>Subtotal</th></tr></thead>
                <tbody>${d.items.map((i) => `<tr><td>${i.nombre}</td><td class="mono">${i.cantidad}</td><td class="mono">${formatoMoneda(i.subtotal)}</td></tr>`).join('')}</tbody>
            </table>
        </div>
        <div style="font-size:.84rem;color:var(--text-muted);margin-top:8px">Envío a: ${d.direccion_envio || '—'} · Pago: ${d.metodo_pago || '—'}</div>
        <div class="pedido-resenas" id="pr-wrap-${id}">
            <h4>Tu opinión sobre estos productos</h4>
            ${d.items.map((i) => bloqueResena(i, rev[i.producto_id], id, entregado)).join('')}
        </div>
    `;
    if (irAResenas) cont.querySelector('.pedido-resenas').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function bloqueResena(item, ex, orderId, entregado) {
    const pid = item.producto_id;
    if (ex) {
        return `<div class="pr-item" id="pr-${orderId}-${pid}">
            <div class="pr-nombre">${item.nombre}</div>
            <div class="pr-cur">${estrellas(ex.calificacion)}${ex.comentario ? ' · ' + ex.comentario.replace(/</g, '&lt;') : ''}
                <button class="btn btn-ghost btn-sm" onclick="editarResn(${orderId}, ${pid})">Editar</button></div>
        </div>`;
    }
    if (!entregado) {
        return `<div class="pr-item"><div class="pr-nombre">${item.nombre}</div>
            <div style="font-size:.8rem;color:var(--text-muted)">Podrás reseñarlo cuando el pedido esté entregado.</div></div>`;
    }
    return formResn(item, orderId, 0, '');
}

function formResn(item, orderId, val, com) {
    const pid = item.producto_id;
    RESN[pid] = val;
    return `<div class="pr-item" id="pr-${orderId}-${pid}">
        <div class="pr-nombre">${item.nombre}</div>
        ${estrellas(val, true, orderId, pid)}
        <textarea id="rc-${orderId}-${pid}" rows="2" placeholder="¿Qué te pareció? (opcional)" style="margin-top:6px;width:100%">${(com || '').replace(/</g, '&lt;')}</textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="guardarResn(${orderId}, ${pid})">Publicar reseña</button>
    </div>`;
}

function setResn(orderId, pid, v) {
    RESN[pid] = v;
    document.querySelectorAll(`#st-${orderId}-${pid} .star`).forEach((el) =>
        el.classList.toggle('on', Number(el.dataset.val) <= v));
}

async function editarResn(orderId, pid) {
    const lista = await api(`/clientes/${CID}/resenas`).catch(() => []);
    const ex = lista.find((r) => r.producto_id === pid) || { calificacion: 0, comentario: '' };
    const el = document.getElementById(`pr-${orderId}-${pid}`);
    const nombre = el.querySelector('.pr-nombre').textContent;
    el.outerHTML = formResn({ producto_id: pid, nombre }, orderId, ex.calificacion, ex.comentario || '');
    setResn(orderId, pid, ex.calificacion);
}

async function guardarResn(orderId, pid) {
    const val = RESN[pid] || 0;
    if (val < 1) { toast('Elige una calificación de 1 a 5 estrellas', 'warn'); return; }
    const com = document.getElementById(`rc-${orderId}-${pid}`).value.trim();
    try {
        await api(`/clientes/${CID}/resenas`, { method: 'POST', body: { producto_id: pid, calificacion: val, comentario: com } });
        toast('¡Gracias por tu reseña!', 'ok');
        const el = document.getElementById(`pr-${orderId}-${pid}`);
        const nombre = el.querySelector('.pr-nombre').textContent;
        el.outerHTML = `<div class="pr-item" id="pr-${orderId}-${pid}">
            <div class="pr-nombre">${nombre}</div>
            <div class="pr-cur">${estrellas(val)}${com ? ' · ' + com.replace(/</g, '&lt;') : ''}
                <button class="btn btn-ghost btn-sm" onclick="editarResn(${orderId}, ${pid})">Editar</button></div>
        </div>`;
    } catch (e) { toast(e.message, 'error'); }
}

async function reportarPago(id) {
    if (!(await confirmar('¿Confirmas que ya realizaste el pago de este pedido?', { okText: 'Sí, ya pagué' }))) return;
    try {
        const r = await api(`/clientes/${CID}/pedidos/${id}/reportar-pago`, { method: 'POST' });
        toast(r.message || 'Pago reportado', 'ok');
        setTimeout(() => location.reload(), 700);
    } catch (e) { toast(e.message, 'error'); }
}

async function cancelarPedido(id) {
    if (!(await confirmar('¿Cancelar este pedido? Se devolverá el stock.', { okText: 'Sí, cancelar', peligro: true }))) return;
    try {
        await api(`/pedidos/${id}/cancelar`, { method: 'PUT', body: { cliente_id: CID } });
        toast('Pedido cancelado', 'ok');
        setTimeout(() => location.reload(), 600);
    } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
