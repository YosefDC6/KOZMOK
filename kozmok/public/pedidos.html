<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis pedidos · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>
<div class="modal-overlay" id="modal-generico"><div class="modal" id="modal-generico-body"></div></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
const FLUJO = ['confirmado', 'procesando', 'enviado', 'entregado'];
const CANCELABLES = ['pendiente', 'confirmado'];
let CID = null;
let RESN = {}; // producto_id -> calificacion en curso

const PASOS_RASTREO = [
    { k: 'confirmado', label: 'Confirmado',      ic: 'check',   f: 'fecha_confirmacion', fb: 'fecha_pedido' },
    { k: 'procesando', label: 'En preparación',  ic: 'package', f: null },
    { k: 'enviado',    label: 'Enviado',         ic: 'truck',   f: 'fecha_envio' },
    { k: 'entregado',  label: 'Entregado',       ic: 'home',    f: 'fecha_entrega' },
];
const MSG_RASTREO = {
    confirmado: 'Pedido confirmado. Pronto empezamos a prepararlo.',
    procesando: 'Estamos preparando tu pedido.',
    enviado:    'Tu pedido va en camino a tu dirección.',
    entregado:  'Entregado. ¡Gracias por tu compra!',
};

function rastreoPedido(p) {
    if (p.estado === 'cancelado') {
        return `<div class="rastreo-cancelado">${icon('x', 15)} Pedido cancelado${Number(p.descuento) > 0 ? ' · puntos devueltos' : ''}</div>`;
    }
    if (p.pago_estado === 'pendiente' && p.metodo_tipo === 'paypal') {
        const hora = p.pago_vence ? new Date(p.pago_vence).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
        return `
            <div class="rastreo-aviso">
                ${icon('clock', 16)}
                <div><strong>Falta pagar con PayPal o tarjeta.</strong> Tu pedido está apartado${hora ? ` hasta las ${hora}` : ''}; si no se paga, se cancela solo sin ningún cargo.</div>
            </div>`;
    }
    if (p.pago_estado === 'pendiente') {
        const esSPEI = /spei/i.test(p.metodo_pago || '');
        return `
            <div class="rastreo-aviso">
                ${icon('clock', 16)}
                <div>
                    <strong>Falta completar tu pago.</strong>
                    ${esSPEI ? 'Haz la transferencia SPEI' : 'Paga en caja'} con la referencia
                    <span class="ra-ref">${p.pago_referencia || '—'}</span>.
                    ${p.pago_reportado
                        ? ' Ya nos avisaste que pagaste; lo estamos verificando.'
                        : ' Tu pedido empieza a prepararse en cuanto confirmemos el pago.'}
                </div>
            </div>`;
    }
    const cur = PASOS_RASTREO.findIndex((s) => s.k === p.estado);
    const iCur = cur < 0 ? 0 : cur;
    const completo = p.estado === 'entregado';   // pedido terminado: todo en verde
    const pasos = PASOS_RASTREO.map((s, i) => {
        const done = completo || i < iCur;
        const cls = done ? 'done' : (i === iCur ? 'actual' : '');
        const fecha = (i <= iCur && s.f && p[s.f]) ? formatoFecha(p[s.f])
            : (i === 0 && s.fb && p[s.fb]) ? formatoFecha(p[s.fb]) : '';
        return `
            <div class="rastreo-step ${cls}">
                <div class="rs-ic">${done ? icon('check', 15) : icon(s.ic, 15)}</div>
                <div>
                    <div class="rs-label">${s.label}</div>
                    ${fecha ? `<div class="rs-date">${fecha}</div>` : ''}
                </div>
            </div>`;
    }).join('');
    return `<div class="rastreo">${pasos}</div><div class="rastreo-msg">${MSG_RASTREO[p.estado] || ''}</div>`;
}

function estrellas(n, editable, orderId, pid) {
    let s = '';
    for (let i = 1; i <= 5; i++) {
        s += `<span class="star ${i <= n ? 'on' : ''}" ${editable ? `data-val="${i}" onclick="setResn(${orderId},${pid},${i})"` : ''}>${icon('star', 15)}</span>`;
    }
    return `<span class="stars ${editable ? 'stars-input' : ''}" ${editable ? `id="st-${orderId}-${pid}"` : ''}>${s}</span>`;
}

montarCuenta('pedidos', async (panel, P) => {
    CID = P.id;
    const [pedidos, fact] = await Promise.all([api(`/pedidos/cliente/${P.id}`), api('/facturacion/config').catch(() => ({ activo: false }))]);
    window.PEDIDOS = pedidos; FACT = fact;
    if (pedidos.length === 0) {
        panel.innerHTML = `<div class="cuenta-head"><h1>Mis pedidos</h1></div>
            <div class="empty-state">Todavía no has hecho ningún pedido.<br><a href="/index.html?ver=todo">Explorar el catálogo</a></div>`;
        return;
    }
    panel.innerHTML = `<div class="cuenta-head"><h1>Mis pedidos</h1><p>${pedidos.length === 1 ? '1 pedido' : pedidos.length + ' pedidos'}. Toca «Ver detalle» para ver productos, envío y pago.</p></div><div id="lista-pedidos"></div>`;
    document.getElementById('lista-pedidos').innerHTML = pedidos.map((p) => {
        const pendientePago = p.pago_estado === 'pendiente' && p.estado !== 'cancelado';
        return `
        <div class="order-row">
            <div class="order-top">
                <span class="mono">${p.numero_orden}</span>
                <span class="tag">${pendientePago ? 'Pago pendiente' : (ESTADO_LABEL[p.estado] || p.estado)}</span>
            </div>
            <div style="font-size:.85rem;color:var(--text-muted)">${formatoFecha(p.fecha_pedido)} · ${p.productos || '—'}</div>
            <div style="font-weight:700;margin-top:6px">${formatoMoneda(p.total)}</div>
            ${rastreoPedido(p)}
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
                <button class="btn btn-outline btn-sm" id="btn-det-${p.id}" onclick="detallePedido(${p.id})">Ver detalle</button>
                ${pendientePago && p.metodo_tipo === 'paypal' && p.estado !== 'cancelado' ? `<a class="btn btn-primary btn-sm" href="/pagar.html?id=${p.id}">Pagar ahora</a>` : `<a class="btn btn-ghost btn-sm" href="/recibo.html?id=${p.id}">${pendientePago ? 'Ficha de pago' : 'Comprobante'}</a>`}
                ${pendientePago && p.metodo_tipo !== 'paypal' && !p.pago_reportado ? `<button class="btn btn-primary btn-sm" onclick="reportarPago(${p.id})">Ya realicé el pago</button>` : ''}
                ${p.estado === 'entregado' ? `<button class="btn btn-primary btn-sm" onclick="detallePedido(${p.id}, true)">Dejar reseña</button>` : ''}
                ${botonesFactura(p)}
                ${CANCELABLES.includes(p.estado) ? `<button class="btn btn-ghost btn-sm" onclick="cancelarPedido(${p.id})">Cancelar</button>` : ''}
            </div>
            <div id="det-${p.id}"></div>
        </div>`;
    }).join('');

    // Enlace directo a un pedido:  /pedidos.html#p123  abre su detalle
    const h = location.hash.match(/^#p(\d+)$/);
    if (h && document.getElementById('det-' + h[1])) detallePedido(Number(h[1]), true);
});

async function detallePedido(id, irAResenas) {
    const cont = document.getElementById('det-' + id);
    const btnDet = document.getElementById('btn-det-' + id);
    if (cont.dataset.open && !irAResenas) { cont.innerHTML = ''; delete cont.dataset.open; if (btnDet) btnDet.textContent = 'Ver detalle'; return; }
    if (btnDet) btnDet.textContent = 'Ocultar detalle';
    const [d, mias] = await Promise.all([
        api(`/pedidos/${id}/detalle`),
        api(`/clientes/${CID}/resenas`).catch(() => []),
    ]);
    cont.dataset.open = '1';
    const rev = {};
    mias.forEach((r) => { rev[r.producto_id] = r; });
    const entregado = d.estado === 'entregado';

    cont.innerHTML = `
        <div class="pedido-det-grid">
        <div>
        <div class="table-wrap" style="margin-top:12px">
            <table>
                <thead><tr><th>Producto</th><th>Cant.</th><th>Subtotal</th></tr></thead>
                <tbody>${d.items.map((i) => `<tr><td>${i.nombre}</td><td class="mono">${i.cantidad}</td><td class="mono">${formatoMoneda(i.subtotal)}</td></tr>`).join('')}</tbody>
            </table>
        </div>
        <div style="font-size:.84rem;color:var(--text-muted);margin-top:8px">Envío a: ${escHTML(d.direccion_envio || '—')} · Pago: ${escHTML(d.metodo_pago || '—')}</div>
        </div>
        <div class="pedido-resenas" id="pr-wrap-${id}">
            <h4>Tu opinión sobre estos productos</h4>
            ${d.items.map((i) => bloqueResena(i, rev[i.producto_id], id, entregado)).join('')}
        </div>
        </div>
    `;
    if (irAResenas) cont.querySelector('.pedido-resenas').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function bloqueResena(item, ex, orderId, entregado) {
    const pid = item.producto_id;
    if (ex) {
        return `<div class="pr-item" id="pr-${orderId}-${pid}">
            <div class="pr-nombre">${item.nombre}</div>
            <div class="pr-cur">${estrellas(ex.calificacion)}${ex.comentario ? ' · ' + ex.comentario.replace(/</g, '&lt;') : ''}
                <button class="btn btn-ghost btn-sm" onclick="editarResn(${orderId}, ${pid})">Editar</button></div>
        </div>`;
    }
    if (!entregado) {
        return `<div class="pr-item"><div class="pr-nombre">${item.nombre}</div>
            <div style="font-size:.8rem;color:var(--text-muted)">Podrás reseñarlo cuando el pedido esté entregado.</div></div>`;
    }
    return formResn(item, orderId, 0, '');
}

function formResn(item, orderId, val, com) {
    const pid = item.producto_id;
    RESN[pid] = val;
    return `<div class="pr-item" id="pr-${orderId}-${pid}">
        <div class="pr-nombre">${item.nombre}</div>
        ${estrellas(val, true, orderId, pid)}
        <textarea id="rc-${orderId}-${pid}" rows="2" placeholder="¿Qué te pareció? (opcional)" style="margin-top:6px;width:100%">${(com || '').replace(/</g, '&lt;')}</textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="guardarResn(${orderId}, ${pid})">Publicar reseña</button>
    </div>`;
}

function setResn(orderId, pid, v) {
    RESN[pid] = v;
    document.querySelectorAll(`#st-${orderId}-${pid} .star`).forEach((el) =>
        el.classList.toggle('on', Number(el.dataset.val) <= v));
}

async function editarResn(orderId, pid) {
    const lista = await api(`/clientes/${CID}/resenas`).catch(() => []);
    const ex = lista.find((r) => r.producto_id === pid) || { calificacion: 0, comentario: '' };
    const el = document.getElementById(`pr-${orderId}-${pid}`);
    const nombre = el.querySelector('.pr-nombre').textContent;
    el.outerHTML = formResn({ producto_id: pid, nombre }, orderId, ex.calificacion, ex.comentario || '');
    setResn(orderId, pid, ex.calificacion);
}

async function guardarResn(orderId, pid) {
    const val = RESN[pid] || 0;
    if (val < 1) { toast('Elige una calificación de 1 a 5 estrellas', 'warn'); return; }
    const com = document.getElementById(`rc-${orderId}-${pid}`).value.trim();
    try {
        await api(`/clientes/${CID}/resenas`, { method: 'POST', body: { producto_id: pid, calificacion: val, comentario: com } });
        toast('¡Gracias por tu reseña!', 'ok');
        const el = document.getElementById(`pr-${orderId}-${pid}`);
        const nombre = el.querySelector('.pr-nombre').textContent;
        el.outerHTML = `<div class="pr-item" id="pr-${orderId}-${pid}">
            <div class="pr-nombre">${nombre}</div>
            <div class="pr-cur">${estrellas(val)}${com ? ' · ' + com.replace(/</g, '&lt;') : ''}
                <button class="btn btn-ghost btn-sm" onclick="editarResn(${orderId}, ${pid})">Editar</button></div>
        </div>`;
    } catch (e) { toast(e.message, 'error'); }
}

async function reportarPago(id) {
    if (!(await confirmar('¿Confirmas que ya realizaste el pago de este pedido?', { okText: 'Sí, ya pagué' }))) return;
    try {
        const r = await api(`/clientes/${CID}/pedidos/${id}/reportar-pago`, { method: 'POST' });
        toast(r.message || 'Pago reportado', 'ok');
        setTimeout(() => location.reload(), 700);
    } catch (e) { toast(e.message, 'error'); }
}

async function cancelarPedido(id) {
    const p = (window.PEDIDOS || []).find((x) => x.id === id) || {};
    const conFactura = p.factura && p.factura.estado === 'timbrada';
    if (!(await confirmar(`¿Cancelar este pedido? Se devolverá el stock${p.pago_estado === 'pagado' ? ' y tu pago' : ''}${conFactura ? ', y su factura se cancelará ante el SAT' : ''}.`, { okText: 'Sí, cancelar', peligro: true }))) return;
    try {
        const r = await api(`/pedidos/${id}/cancelar`, { method: 'PUT', body: { cliente_id: CID } });
        toast(r.message || 'Pedido cancelado', 'ok');
        setTimeout(() => location.reload(), 1200);
    } catch (e) { toast(e.message, 'error'); }
}

/* ---------- Factura electrónica (CFDI 4.0) ---------- */
let FACT = null;   // configuración: activo, modo, regímenes, usos, días
function botonesFactura(p) {
    if (!FACT || !FACT.activo || p.estado === 'cancelado') return '';
    const f = p.factura;
    if (f && f.estado !== 'cancelada') {
        return `<a class="btn btn-ghost btn-sm" href="/api/facturas/${f.id}/pdf">${icon('download', 14)} Factura PDF</a>
                <a class="btn btn-ghost btn-sm" href="/api/facturas/${f.id}/xml">XML</a>
                ${f.estado === 'cancelando' ? '<span class="tag">Factura en cancelación</span>' : ''}${f.modo === 'sandbox' ? '<span class="tag" title="Factura de prueba: sin validez fiscal">prueba</span>' : ''}`;
    }
    if (p.pago_estado !== 'pagado') return '';
    const ref = p.fecha_confirmacion || p.fecha_pedido;
    if (ref && Date.now() - new Date(ref).getTime() > FACT.dias * 86400000) return '';
    return `<button class="btn btn-outline btn-sm" onclick="pedirFactura(${p.id})">${icon('clipboard', 14)} Facturar</button>`;
}
const cerrarModal = () => document.getElementById('modal-generico').classList.remove('open');
async function pedirFactura(id) {
    const p = (window.PEDIDOS || []).find((x) => x.id === id);
    const g = (await api(`/clientes/${CID}/datos-fiscales`).catch(() => null)) || {};
    const opts = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${String(k) === String(sel) ? 'selected' : ''}>${k} · ${escHTML(v)}</option>`).join('');
    document.getElementById('modal-generico-body').innerHTML = `
        <button class="modal-close" onclick="cerrarModal()">${icon('x', 20)}</button>
        <h3 style="margin-bottom:2px">Facturar pedido ${escHTML(p.numero_orden)}</h3>
        <p style="margin:0 0 14px;color:var(--text-muted);font-size:.85rem">Total ${formatoMoneda(p.total)}. Escribe tus datos tal como aparecen en tu constancia de situación fiscal.</p>
        ${FACT.modo === 'sandbox' ? '<div class="pago-prueba" style="margin-bottom:12px">Facturación de prueba: el CFDI se timbra en el sandbox del PAC y no tiene validez fiscal.</div>' : ''}
        <div class="field-row">
            <div class="field"><label>RFC</label><input id="ff-rfc" maxlength="13" value="${escHTML(g.rfc || '')}" placeholder="XAXX010101000" style="text-transform:uppercase" /></div>
            <div class="field"><label>Código postal fiscal</label><input id="ff-cp" maxlength="5" inputmode="numeric" value="${escHTML(g.codigo_postal || '')}" placeholder="20000" /></div>
        </div>
        <div class="field"><label>Nombre o razón social (sin "S.A. de C.V.")</label><input id="ff-razon" value="${escHTML(g.razon_social || '')}" style="text-transform:uppercase" /></div>
        <div class="field"><label>Régimen fiscal</label><select id="ff-regimen"><option value="">Elige…</option>${opts(FACT.regimenes, g.regimen_fiscal)}</select></div>
        <div class="field"><label>Uso del CFDI</label><select id="ff-uso">${opts(FACT.usos, g.uso_cfdi || 'G03')}</select></div>
        <label style="display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:.88rem"><input type="checkbox" id="ff-guardar" style="width:auto" checked /> Guardar estos datos para mis próximas facturas</label>
        <button class="btn btn-primary" style="width:100%" id="ff-btn" onclick="enviarFactura(${id})">Generar factura</button>
        <p style="font-size:.76rem;color:var(--text-muted);margin:10px 0 0">Se puede facturar dentro de los ${FACT.dias} días siguientes al pago. Te enviamos el PDF y el XML por correo y quedan aquí para descargar.</p>`;
    document.getElementById('modal-generico').classList.add('open');
}
async function enviarFactura(id) {
    const v = (k) => document.getElementById(k).value.trim();
    const body = { rfc: v('ff-rfc').toUpperCase(), razon_social: v('ff-razon').toUpperCase(), regimen_fiscal: v('ff-regimen'), codigo_postal: v('ff-cp'), uso_cfdi: v('ff-uso'), guardar: document.getElementById('ff-guardar').checked };
    if (!/^[A-ZÑ&]{3,4}\d{6}[A-Z\d]{3}$/.test(body.rfc)) return toast('Revisa tu RFC (12 o 13 caracteres)', 'warn');
    if (!/^\d{5}$/.test(body.codigo_postal)) return toast('El código postal debe tener 5 dígitos', 'warn');
    if (!body.razon_social) return toast('Escribe tu nombre o razón social', 'warn');
    if (!body.regimen_fiscal) return toast('Elige tu régimen fiscal', 'warn');
    const b = document.getElementById('ff-btn'); b.disabled = true; b.textContent = 'Timbrando…';
    try {
        const r = await api(`/pedidos/${id}/factura`, { method: 'POST', body });
        cerrarModal(); toast(r.message, 'ok');
        setTimeout(() => location.reload(), 1200);
    } catch (e) { toast(e.message, 'error'); b.disabled = false; b.textContent = 'Generar factura'; }
}
</script>
</body>
</html>
