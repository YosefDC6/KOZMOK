<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¡Gracias por tu compra! · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="thanks-wrap" id="thanks">
    <div class="empty-state">Cargando tu confirmación…</div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script>
const cliente = Sesion.cliente();
window.KZ_PAGINA_PRIVADA = true;
if (!cliente) irALogin();

const ESTADO_LABEL = { pendiente: 'Pendiente', confirmado: 'Confirmado', procesando: 'En preparación', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };

async function cargar() {
    const id = new URLSearchParams(location.search).get('id');
    const wrap = document.getElementById('thanks');
    if (!id) { location.replace('/pedidos.html'); return; }
    try {
        const d = await api(`/pedidos/${id}/detalle`);
        const pendiente = d.pago_estado === 'pendiente';
        const esSPEI = /spei/i.test(d.metodo_pago || '');
        const pasoRastreo = { confirmado: 0, procesando: 1, enviado: 2, entregado: 3 }[d.estado] ?? 0;
        const pts = Number(d.puntos_ganados) || 0;
        wrap.innerHTML = `
            <header class="thanks-head">
                <div class="thanks-check">${icon(pendiente ? 'clock' : 'check', 34)}</div>
                <div>
                    <h1>${pendiente ? '¡Pedido registrado!' : '¡Gracias por tu compra!'}</h1>
                    <div class="thanks-order">${escHTML(d.numero_orden)}</div>
                    <p>${pendiente
                        ? (esSPEI
                            ? 'Falta un paso: realiza la transferencia SPEI con los datos de tu ficha de pago. En cuanto recibamos el pago confirmamos y preparamos tu pedido.'
                            : 'Falta un paso: presenta tu código de pago en caja. En cuanto recibamos el pago confirmamos y preparamos tu pedido.')
                        : 'Recibimos tu pago y ya lo estamos preparando. Te avisaremos por correo cuando se envíe.'}</p>
                </div>
            </header>

            <div class="thanks-grid">
                <section class="card thanks-card thanks-detalle">
                    <h3 class="thanks-tit">Tu pedido <span>${d.items.reduce((n, i) => n + Number(i.cantidad), 0)} artículo(s)</span></h3>
                    ${d.items.map((i) => `
                        <div class="tc-item">
                            <img src="${escHTML(imagenProducto(i))}" alt="" loading="lazy" />
                            <span class="tc-nom">${escHTML(i.nombre)}<small>Cantidad: ${i.cantidad}</small></span>
                            <span class="mono">${formatoMoneda(i.subtotal)}</span>
                        </div>`).join('')}
                    <div class="tc-totales">
                        ${Number(d.descuento_promocion) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Promociones</span><span class="mono">-${formatoMoneda(d.descuento_promocion)}</span></div>` : ''}
                        ${impuestosDe(d).map((t) => `<div class="tc-line tc-suave"><span>${t.nombre} (${Number(t.porcentaje)}%)</span><span class="mono">${formatoMoneda(t.monto)}</span></div>`).join('')}
                        <div class="tc-line tc-suave"><span>Envío</span><span class="mono">${Number(d.envio) === 0 ? 'Gratis' : formatoMoneda(d.envio)}</span></div>
                        ${Number(d.descuento) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Descuento por puntos</span><span class="mono">-${formatoMoneda(d.descuento)}</span></div>` : ''}
                        ${Number(d.descuento_cupon) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Cupón de descuento</span><span class="mono">-${formatoMoneda(d.descuento_cupon)}</span></div>` : ''}
                        <div class="tc-line tc-total"><span>Total</span><span class="mono">${formatoMoneda(d.total)}</span></div>
                    </div>
                </section>

                <aside class="thanks-lado">
                    ${pendiente ? `
                    <section class="card">
                        <div class="thanks-eti">${esSPEI ? 'Referencia SPEI' : 'Código de pago'}</div>
                        <div class="mono" style="font-size:1.15rem;margin:2px 0 6px">${escHTML(d.pago_referencia)}</div>
                        <div style="font-size:.84rem;color:var(--text-muted)">Monto: <strong>${formatoMoneda(d.total)}</strong> · Vence: ${d.pago_vence ? new Date(d.pago_vence).toLocaleDateString('es-MX') : '—'}</div>
                        <a class="btn btn-primary btn-sm" style="margin-top:12px;width:100%" href="/recibo.html?id=${d.id}">Ver ficha de pago completa</a>
                    </section>` : `
                    <section class="card">
                        <div class="rastreo">
                            ${[['check', 'Confirmado'], ['package', 'En preparación'], ['truck', 'Enviado'], ['home', 'Entregado']].map((s, i) => `
                                <div class="rastreo-step ${i < pasoRastreo ? 'hecho' : ''} ${i === pasoRastreo ? 'actual' : ''}">
                                    <div class="rs-ic">${icon(s[0], 15)}</div>
                                    <div><div class="rs-label">${s[1]}</div></div>
                                </div>`).join('')}
                        </div>
                        <p style="font-size:.8rem;color:var(--text-muted);text-align:center;margin:4px 0 0">Sigue el avance desde <a href="/pedidos.html">Mis pedidos</a>.</p>
                    </section>`}

                    <section class="card thanks-datos">
                        <div><span class="thanks-eti">Envío a</span>${escHTML(d.direccion_envio || '—')}</div>
                        <div><span class="thanks-eti">Pago</span>${escHTML(d.metodo_pago || '—')}</div>
                        <div><span class="thanks-eti">Estado</span><span class="tag">${ESTADO_LABEL[d.estado] || d.estado}</span></div>
                    </section>

                    <section class="card thanks-puntos">
                        ${icon('star', 18)}
                        <div>${pts
                            ? `Ganaste <strong>${pts.toLocaleString('es-MX')} puntos</strong> del Club con esta compra. <a href="/recompensas.html">Ver mis puntos</a>`
                            : pendiente ? 'Los puntos del Club se abonan en cuanto se confirme tu pago.'
                            : 'Esta compra suma a tu <a href="/recompensas.html">Club de puntos</a>.'}</div>
                    </section>

                    ${(d.garantias && d.garantias.length) ? `
                    <section class="card">
                        <div style="font-weight:600;font-size:.9rem;margin-bottom:8px">${icon('shield', 14)} Garantías extendidas</div>
                        ${d.garantias.map((g) => `<div class="thanks-gar">${escHTML(g.producto || 'Producto')} · ${escHTML(g.plan)}<span class="mono">${escHTML(g.codigo)}</span></div>`).join('')}
                        <p style="font-size:.78rem;color:var(--text-muted);margin:8px 0 0">También están en tu comprobante y en <a href="/garantias.html">Mis garantías</a>.</p>
                    </section>` : ''}

                    <div class="thanks-actions">
                        <a class="btn btn-primary" href="/recibo.html?id=${d.id}">Ver comprobante</a>
                        <a class="btn btn-outline" href="/pedidos.html">Mis pedidos</a>
                        <a class="btn btn-ghost" href="/index.html">Seguir comprando</a>
                    </div>
                </aside>
            </div>
        `;
    } catch (e) {
        wrap.innerHTML = `<div class="empty-state">No pudimos cargar la confirmación.<br><a href="/pedidos.html">Ir a mis pedidos</a></div>`;
    }
}
if (cliente) cargar();
</script>
</body>
</html>
