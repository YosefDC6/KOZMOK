<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¡Gracias por tu compra! · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="thanks-wrap" id="thanks">
    <div class="empty-state">Cargando tu confirmación…</div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/compra.js"></script>
<script>
const ESTADO_LABEL = { pendiente: 'Pendiente de pago', confirmado: 'Procesada', procesando: 'En preparación', enviado: 'En envío', entregado: 'Entregada', cancelado: 'Cancelada' };
const METODO = { tarjeta: 'Tarjeta', paypal: 'PayPal', transferencia: 'Transferencia bancaria', monedero: 'Monedero', efectivo: 'Efectivo', tienda: 'Pago en tienda' };

async function cargar() {
    const cliente = Sesion.cliente() || await Sesion.sincronizar();
    if (!cliente) { irALogin(); return; }
    const id = new URLSearchParams(location.search).get('id');
    const wrap = document.getElementById('thanks');
    if (!/^\d+$/.test(id || '')) { location.replace('/pedidos.html'); return; }
    try {
        const d = await api(`/pedidos/${id}/detalle`);
        const pendiente = d.pago_estado === 'pendiente';
        const pago = d.pago || {};
        const conMonedero = pago.metodo_pago === 'monedero' && d.monedero;
        wrap.insertAdjacentHTML('beforebegin', `<div class="container" style="max-width:620px;padding-top:34px">${pasosCompra('confirmacion')}</div>`);
        wrap.innerHTML = `
            <div class="thanks-check">${icon(pendiente ? 'clock' : 'check', 34)}</div>
            <h1>${pendiente ? '¡Pedido registrado!' : '¡Compra realizada con éxito!'}</h1>
            <div class="confirma-datos">
                <div><span>Orden</span><strong class="mono">${esc(d.numero_orden)}</strong></div>
                <div><span>Pago</span><strong>${esc(METODO[pago.metodo_pago] || d.metodo_pago || '—')}${pago.detalle && pago.metodo_pago !== 'monedero' ? ` · ${esc(pago.detalle)}` : ''}</strong></div>
                <div><span>Total</span><strong class="mono">${formatoMoneda(d.total, 2)}</strong></div>
                ${conMonedero ? `<div><span>Saldo actual del monedero</span><strong class="mono" style="color:var(--success)">${formatoMoneda(d.monedero.saldo_actual, 2)}</strong></div>` : ''}
                ${pago.referencia ? `<div><span>${pendiente ? 'Referencia SPEI' : 'Autorización'}</span><strong class="mono">${esc(pago.referencia)}</strong></div>` : ''}
            </div>
            <p class="confirma-correo">Hemos enviado el detalle de tu compra al correo:<br><strong>${esc(d.correo || cliente.correo)}</strong></p>
            <p style="margin:12px 0 22px">${pendiente
                ? 'Falta un paso: realiza la transferencia SPEI con la referencia de arriba en los próximos 3 días. En cuanto recibamos el pago confirmamos y preparamos tu pedido.'
                : 'Recibimos tu pago y ya lo estamos preparando. Te avisaremos por correo cuando se envíe.'}</p>

            ${pendiente ? `
            <div class="card" style="max-width:420px;margin:0 auto 18px;text-align:left">
                <div style="font-size:.84rem;color:var(--text-muted)">Monto: <strong>${formatoMoneda(d.total, 2)}</strong> · Vence: ${d.pago_vence ? new Date(d.pago_vence).toLocaleDateString('es-MX') : '—'}</div>
                <a class="btn btn-primary btn-sm" style="margin-top:10px" href="/recibo.html?id=${d.id}">Ver ficha de pago completa</a>
            </div>` : `
            <div class="card" style="max-width:460px;margin:0 auto 18px">
                <div class="rastreo">
                    ${[['check', 'Procesada'], ['package', 'En preparación'], ['truck', 'En envío'], ['home', 'Entregada']].map((s, i) => `
                        <div class="rastreo-step ${i === 0 ? 'actual' : ''}">
                            <div class="rs-ic">${icon(s[0], 15)}</div>
                            <div><div class="rs-label">${s[1]}</div></div>
                        </div>`).join('')}
                </div>
            </div>`}

            <div class="card thanks-card">
                ${d.items.map((i) => `
                    <div class="tc-line"><span>${esc(i.nombre)} × ${i.cantidad}${i.precio_lista ? ' <span class="tag tag-promo">promoción</span>' : ''}</span><span class="mono">${formatoMoneda(i.subtotal, 2)}</span></div>
                `).join('')}
                ${Number(d.descuento_promociones) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Ahorro por promociones</span><span class="mono">-${formatoMoneda(d.descuento_promociones, 2)}</span></div>` : ''}
                <div class="tc-line"><span>Subtotal</span><span class="mono">${formatoMoneda(d.subtotal, 2)}</span></div>
                ${(d.impuestos_detalle && d.impuestos_detalle.length ? d.impuestos_detalle : [{ nombre: 'Impuestos', porcentaje: '', monto: d.impuestos }]).map((t) =>
                    `<div class="tc-line" style="color:var(--text-muted)"><span>${esc(t.nombre)}${t.porcentaje !== '' ? ` (${Number(t.porcentaje)}%)` : ''}</span><span class="mono">${formatoMoneda(t.monto, 2)}</span></div>`).join('')}
                <div class="tc-line" style="color:var(--text-muted)"><span>Envío</span><span class="mono">${Number(d.envio) === 0 ? 'Gratis' : formatoMoneda(d.envio, 2)}</span></div>
                ${Number(d.descuento) > 0 ? `<div class="tc-line" style="color:var(--success)"><span>Descuento por puntos</span><span class="mono">-${formatoMoneda(d.descuento, 2)}</span></div>` : ''}
                <div class="tc-line" style="font-weight:700;font-size:1.05rem"><span>Total</span><span class="mono">${formatoMoneda(d.total, 2)}</span></div>
                <div class="tc-line" style="color:var(--text-muted)"><span>Envío a</span><span style="text-align:right;max-width:60%">${esc(d.direccion_envio || '—')}</span></div>
                <div class="tc-line" style="color:var(--text-muted)"><span>Estado</span><span><span class="tag">${ESTADO_LABEL[d.estado] || esc(d.estado)}</span></span></div>
            </div>

            ${(d.garantias && d.garantias.length) ? `
            <div class="card" style="max-width:460px;margin:16px auto 0;text-align:left">
                <div style="font-weight:600;font-size:.9rem;margin-bottom:6px">${icon('shield', 14)} Garantías extendidas incluidas</div>
                ${d.garantias.map((g) => `<div style="font-size:.82rem;color:var(--text-muted);margin-bottom:4px">${esc(g.producto || 'Producto')} · ${esc(g.plan)}<br>Código: <span class="mono" style="color:var(--text)">${esc(g.codigo)}</span></div>`).join('')}
            </div>` : ''}

            <div class="thanks-actions">
                <a class="btn btn-primary" href="/pedidos.html?pedido=${d.id}">Ver mi pedido</a>
                <a class="btn btn-outline" href="/index.html">${icon('cart', 15)} Seguir comprando</a>
                <a class="btn btn-ghost" href="/recibo.html?id=${d.id}">Comprobante</a>
            </div>
            <p style="font-size:.84rem;color:var(--text-muted);margin:16px 0 0">${pendiente
                ? 'Los puntos del Club se acreditan al confirmarse el pago.'
                : 'Esta compra sumó puntos a tu <a href="/recompensas.html">Club de puntos</a>.'}</p>
        `;
    } catch (e) {
        if (e.status === 401) { irALogin(); return; }
        wrap.innerHTML = `<div class="empty-state">No pudimos cargar la confirmación.<br><a href="/pedidos.html">Ir a mis pedidos</a></div>`;
    }
}
cargar();
</script>
</body>
</html>
