<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container carrito-page" style="padding-top:36px;padding-bottom:60px;max-width:1160px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <h1 style="margin:0;font-size:1.6rem">Finalizar compra</h1>
        <button class="btn btn-ghost btn-sm" id="btn-vaciar" hidden>Vaciar carrito</button>
    </div>
    <div id="carrito-contenido"><div class="empty-state">Cargando…</div></div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/garantia.js"></script>
<script>
const cliente = Sesion.cliente();

const ENVIO_GRATIS_DESDE = 10000;
const COSTO_ENVIO = 199;
let DIRECCIONES = [];
let METODOS = [];
let RECOMP = { puntos: 0, valor_punto: 0.10 };
let SUBTOTAL = 0;
let GAR_TOTAL = 0;
let ITEMS = [];          // líneas del carrito (para cotizar)
let COT = null;          // última cotización del servidor (promociones + impuestos + envío + puntos)
let MONEDERO = { saldo: 0, estado: 'activo' };
const MARCA_LABEL = { visa: 'Visa', mastercard: 'Mastercard', amex: 'American Express', otra: 'Tarjeta' };

async function cargarCarrito() {
    const [items, dirs, rec, metodos, mon] = await Promise.all([
        api(`/carrito/${cliente.id}`),
        api(`/clientes/${cliente.id}/direcciones`).catch(() => []),
        api(`/clientes/${cliente.id}/recompensas`).catch(() => ({ puntos: 0, valor_punto: 0.10 })),
        api(`/clientes/${cliente.id}/metodos-pago`).catch(() => []),
        api('/monedero').catch(() => ({ saldo: 0, estado: 'activo' })),
    ]);
    MONEDERO = { saldo: Number(mon.saldo) || 0, estado: mon.estado };
    ITEMS = items.map((i) => ({ producto_id: i.producto_id, cantidad: i.cantidad, garantia: i.garantia_clave || 'none' }));
    DIRECCIONES = dirs;
    METODOS = metodos;
    RECOMP = rec;
    const cont = document.getElementById('carrito-contenido');
    document.getElementById('btn-vaciar').hidden = items.length === 0;

    if (items.length === 0) {
        cont.innerHTML = `
            <div class="vacio-card">
                <span class="vacio-ico">${icon('cart', 30)}</span>
                <h3>Tu carrito está vacío</h3>
                <p>Agrega productos desde el catálogo o recupera los que guardaste en favoritos.</p>
                <div class="vacio-acciones">
                    <a href="/index.html?ver=todo" class="btn btn-primary">Ver catálogo</a>
                    <a href="/favoritos.html" class="btn btn-outline">Ver favoritos</a>
                </div>
            </div>`;
        return;
    }

    let subtotal = 0;
    let garTotal = 0;
    const filas = items.map((i) => {
        const linea = Number(i.precio_final ?? i.precio) * i.cantidad;
        const gCosto = Number(i.garantia_costo || 0);
        subtotal += Number(linea);
        garTotal += gCosto;
        const claveActual = i.garantia_clave || 'none';
        return `
        <div class="card cart-line">
            <img class="cart-thumb" src="${imagenProducto(i)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${ilustracionProducto(i)}'"
                 onclick="location.href='/index.html#producto-${i.producto_id}'" alt="${i.nombre}" />
            <div class="cart-info">
                <div class="nm">${i.nombre}</div>
                <div class="mono" style="color:var(--text-muted);font-size:.82rem">${precioHTML(i)} c/u</div>
                ${i.promocion ? `<div class="cart-promo">${icon('star', 12)} ${i.promocion.nombre}</div>` : ''}
                <div class="qty-stepper" style="margin-top:8px">
                    <button onclick="cambiarCantidad(${i.id}, ${i.cantidad - 1}, ${i.stock})" ${i.cantidad <= 1 ? 'disabled' : ''}>−</button>
                    <span class="qty-val">${i.cantidad}</span>
                    <button onclick="cambiarCantidad(${i.id}, ${i.cantidad + 1}, ${i.stock})" ${i.cantidad >= i.stock ? 'disabled' : ''}>+</button>
                </div>
                <div class="cart-gar">
                    <span class="ic-gar">${icon('shield', 13)}</span>
                    <select onchange="cambiarGarantia(${i.id}, this.value)">
                        ${PLANES_GARANTIA.map((g) => {
                            const c = costoGarantia(i.precio, g.clave) * i.cantidad;
                            return `<option value="${g.clave}" ${g.clave === claveActual ? 'selected' : ''}>${g.label}${c > 0 ? ' · +' + formatoMoneda(c) : ''}</option>`;
                        }).join('')}
                    </select>
                </div>
            </div>
            <div class="cart-sub">
                ${formatoMoneda(linea + gCosto)}
                ${gCosto > 0 ? `<div style="font-size:.72rem;color:var(--text-muted);font-weight:400">incl. garantía ${formatoMoneda(gCosto)}</div>` : ''}
                <div><button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="quitarDelCarrito(${i.id})">Quitar</button></div>
            </div>
        </div>`;
    }).join('');

    subtotal += garTotal;
    GAR_TOTAL = garTotal;
    SUBTOTAL = subtotal;
    // El servidor calcula el desglose con las promociones e impuestos configurados
    COT = await api('/checkout/cotizar', { method: 'POST', body: { items: ITEMS } });
    const base = COT.base_impuestos;
    const envio = COT.envio;
    const falta = Math.max(ENVIO_GRATIS_DESDE - base, 0);
    const pct = Math.min(100, Math.round(base / ENVIO_GRATIS_DESDE * 100));

    // Máximo de puntos canjeables: múltiplos de 100, sin pasar del subtotal
    const maxCanje = Math.max(0, Math.min(
        RECOMP.puntos - (RECOMP.puntos % 100),
        Math.floor(base / RECOMP.valor_punto / 100) * 100
    ));
    const bloquePuntos = maxCanje >= 100
        ? `<div class="field">
             <label>Usar puntos del Club (tienes ${RECOMP.puntos.toLocaleString('es-MX')} · valen ${formatoMoneda(RECOMP.puntos * RECOMP.valor_punto)})</label>
             <div style="display:flex;gap:8px;align-items:center">
               <input type="number" id="canje" min="0" max="${maxCanje}" step="100" value="0" style="width:120px" oninput="recalcular()" />
               <span style="font-size:.84rem;color:var(--text-muted)">puntos = <strong id="canje-mxn">$0</strong> de descuento (máx ${maxCanje})</span>
             </div>
           </div>`
        : (RECOMP.puntos > 0
            ? `<p style="font-size:.82rem;color:var(--text-muted)">Junta 100 puntos para poder canjearlos. Tienes ${RECOMP.puntos}.</p>`
            : '');

    const shipHint = envio === 0
        ? `<div class="ship-hint free"><span>${icon('check', 15)} Tu pedido tiene <strong>envío gratis</strong>.</span><div class="ship-bar"><span style="width:100%"></span></div></div>`
        : `<div class="ship-hint"><span>Te faltan <strong>${formatoMoneda(falta)}</strong> para envío gratis.</span><div class="ship-bar"><span style="width:${pct}%"></span></div></div>`;

    const opcionesDir = DIRECCIONES.length
        ? `<div class="field"><label>Enviar a una dirección guardada</label>
             <select id="dir-guardada" onchange="usarDireccionGuardada()">
               <option value="">— Escribir otra dirección —</option>
               ${DIRECCIONES.map((d) => `<option value="${d.id}" ${d.predeterminada ? 'selected' : ''}>${d.alias || 'Dirección'} · ${d.calle}</option>`).join('')}
             </select>
           </div>`
        : `<p style="font-size:.82rem;color:var(--text-muted)">Tip: guarda direcciones en <a href="/direcciones.html">tu perfil</a> para el próximo pedido.</p>`;

    const nPiezas = items.reduce((a, i) => a + i.cantidad, 0);
    cont.innerHTML = `
        ${stepperHTML()}
        <div class="cart-layout">
        <div class="cart-pasos">
            <section class="ck-paso" data-paso="1">
                <h2 class="ck-tit">${icon('cart', 18)} Tu carrito <span>${nPiezas} ${nPiezas === 1 ? 'pieza' : 'piezas'}</span></h2>
                <div class="cart-items">${filas}</div>
                <div class="ck-acciones">
                    <a href="/index.html?ver=todo" class="btn btn-ghost">${icon('arrow', 15, 'flip')} Seguir comprando</a>
                    <button class="btn btn-primary" onclick="irPaso(2)">Continuar con el envío ${icon('arrow', 15)}</button>
                </div>
            </section>

            <section class="ck-paso card" data-paso="2" hidden>
                <h2 class="ck-tit">${icon('truck', 18)} ¿A dónde lo enviamos?</h2>
                ${opcionesDir}
                <div class="field"><label>Dirección de envío</label><input type="text" id="direccion" placeholder="Calle, número, colonia, ciudad" /></div>
                <div class="field"><label>Notas para la entrega <span style="font-weight:400;color:var(--text-muted)">(opcional)</span></label><input type="text" id="notas" maxlength="200" placeholder="Ej. dejar en recepción" /></div>
                <div class="ck-acciones">
                    <button class="btn btn-ghost" onclick="irPaso(1)">${icon('arrow', 15, 'flip')} Volver al carrito</button>
                    <button class="btn btn-primary" onclick="irPaso(3)">Continuar con el pago ${icon('arrow', 15)}</button>
                </div>
            </section>

            <section class="ck-paso card" data-paso="3" hidden>
                <h2 class="ck-tit">${icon('card', 18)} ¿Cómo quieres pagar?</h2>
                <div class="field"><label>Método de pago</label>
                    <select id="metodo-pago" onchange="cambioMetodo()">
                        ${METODOS.map((m) => `<option value="mp:${m.id}" ${m.predeterminada ? 'selected' : ''}>${MARCA_LABEL[m.marca] || 'Tarjeta'} ****${m.ultimos4}${m.predeterminada ? ' (predeterminada)' : ''}</option>`).join('')}
                        <option value="nueva">＋ Usar otra tarjeta…</option>
                        <option value="paypal">PayPal</option>
                        <option value="spei">Transferencia bancaria (SPEI)</option>
                        <option value="tienda">Pago en tienda</option>
                        <option value="monedero" ${MONEDERO.estado !== 'activo' ? 'disabled' : ''}>Monedero Kozmok (saldo: ${formatoMoneda2(MONEDERO.saldo)})</option>
                    </select>
                </div>
                <div id="box-monedero" class="pago-box" hidden></div>
                <div id="box-paypal" class="pago-box" hidden>
                    <h4>${icon('wallet', 15)} PayPal</h4>
                    <div class="pb-sub" style="margin:0">Al confirmar se simula el cobro en tu cuenta de PayPal y el pedido queda pagado al instante.</div>
                </div>
                <div id="tarjeta-nueva" class="card-nueva" hidden>
                    <div class="field"><label>Número de tarjeta</label>
                        <input id="tn-num" inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" oninput="fmtNum(this)" />
                    </div>
                    <div class="field"><label>Titular</label><input id="tn-titular" placeholder="Nombre en la tarjeta" /></div>
                    <div class="field-row">
                        <div class="field"><label>Mes</label><select id="tn-mes">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${String(i + 1).padStart(2, '0')}</option>`).join('')}</select></div>
                        <div class="field"><label>Año</label><select id="tn-anio">${Array.from({ length: 12 }, (_, i) => { const a = new Date().getFullYear() + i; return `<option value="${a}">${a}</option>`; }).join('')}</select></div>
                        <div class="field"><label>CVV</label><input id="tn-cvv" inputmode="numeric" maxlength="4" placeholder="123" /></div>
                    </div>
                    <label style="display:flex;align-items:center;gap:8px;font-size:.85rem"><input type="checkbox" id="tn-guardar" style="width:auto" checked /> Guardar esta tarjeta para la próxima vez</label>
                    <p style="font-size:.76rem;color:var(--text-muted);margin:8px 0 0">Demo: no se procesa ningún cargo real. Solo se guardan marca y últimos 4 dígitos.</p>
                </div>
                ${bloquePuntos}
                <div class="ck-acciones">
                    <button class="btn btn-ghost" onclick="irPaso(2)">${icon('arrow', 15, 'flip')} Volver al envío</button>
                    <button class="btn btn-primary" onclick="irPaso(4)">Revisar pedido ${icon('arrow', 15)}</button>
                </div>
            </section>

            <section class="ck-paso card" data-paso="4" hidden>
                <h2 class="ck-tit">${icon('check', 18)} Revisa y confirma</h2>
                <div class="ck-revision" id="ck-revision"></div>
                <div class="ck-acciones">
                    <button class="btn btn-ghost" onclick="irPaso(3)">${icon('arrow', 15, 'flip')} Volver al pago</button>
                    <button class="btn btn-primary btn-lg" id="btn-comprar" onclick="confirmarCompra()">Confirmar pedido</button>
                </div>
            </section>
        </div>

        <div class="card cart-resumen">
            <h3 class="cart-resumen-tit">Resumen del pedido</h3>
            ${shipHint}
            <div id="resumen-totales">${desgloseHTML(COT)}</div>
            <button class="btn btn-primary" style="width:100%" id="ck-siguiente" onclick="irPaso(PASO + 1)"></button>
            <p class="ck-seguro">${icon('lock', 13)} Pago seguro · puedes cancelar mientras no se envíe</p>
        </div>
        </div>
    `;
    recalcular();
    usarDireccionGuardada();
    cambioMetodo();
    irPaso(pasoDeURL(), { sinHistorial: true, sinValidar: true });
}

// =========================================================
// CHECKOUT POR PASOS: 1 Carrito · 2 Envío · 3 Pago · 4 Confirmar
//   El paso va en la dirección (?paso=2), así "atrás" del navegador
//   regresa al paso anterior. Solo se avanza si el paso actual está completo.
// =========================================================
const PASOS = [
    { n: 1, nombre: 'Carrito', ic: 'cart', sig: 'Continuar con el envío' },
    { n: 2, nombre: 'Envío', ic: 'truck', sig: 'Continuar con el pago' },
    { n: 3, nombre: 'Pago', ic: 'card', sig: 'Revisar pedido' },
    { n: 4, nombre: 'Confirmar', ic: 'check', sig: null },
];
let PASO = 1;
let PASO_MAX = 1;   // hasta dónde ha llegado (se puede volver a cualquier paso ya visitado)

function pasoDeURL() {
    const n = Number(new URLSearchParams(location.search).get('paso')) || 1;
    return Math.min(4, Math.max(1, n));
}

function stepperHTML() {
    return `<ol class="ck-stepper" id="ck-stepper" aria-label="Pasos de la compra">
        ${PASOS.map((p) => `<li data-n="${p.n}"><button type="button" onclick="irPaso(${p.n})"><span class="ck-num">${p.n}</span><span class="ck-nom">${p.nombre}</span></button></li>`).join('')}
    </ol>`;
}

function validarPaso(n) {
    if (n === 1) return true;
    if (n === 2) {
        const d = document.getElementById('direccion');
        if (!d.value.trim()) { toast('Ingresa o elige una dirección de envío', 'warn'); d.focus(); return false; }
        return true;
    }
    if (n === 3) {
        if (document.getElementById('metodo-pago').value === 'nueva') {
            const numero = document.getElementById('tn-num').value.replace(/\s/g, '');
            if (numero.length < 13 || numero.length > 19) { toast('Revisa el número de tarjeta', 'warn'); return false; }
            if (!document.getElementById('tn-titular').value.trim()) { toast('Escribe el titular de la tarjeta', 'warn'); return false; }
            if (!/^\d{3,4}$/.test(document.getElementById('tn-cvv').value.trim())) { toast('El CVV debe tener 3 o 4 dígitos', 'warn'); return false; }
        }
        if (document.getElementById('metodo-pago').value === 'monedero' && COT && MONEDERO.saldo < COT.total) {
            toast(`Tu saldo (${formatoMoneda2(MONEDERO.saldo)}) no alcanza. Recarga tu monedero o elige otro método.`, 'warn'); return false;
        }
        return true;
    }
    return true;
}

function irPaso(n, { sinHistorial = false, sinValidar = false } = {}) {
    n = Math.min(4, Math.max(1, n));
    if (!document.querySelector('.ck-paso')) return;
    // Para avanzar hay que completar cada paso intermedio
    if (n > PASO && !sinValidar) {
        for (let k = PASO; k < n; k++) { if (!validarPaso(k)) { n = k; break; } }
    }
    if (sinValidar && n > 1) {   // llegada por URL o "adelante": solo hasta donde ya es válido
        for (let k = 1; k < n; k++) { const ok = k === 1 || (k === 2 ? !!document.getElementById('direccion').value.trim() : PASO_MAX > k); if (!ok) { n = k; break; } }
    }
    PASO = n;
    PASO_MAX = Math.max(PASO_MAX, n);
    document.querySelectorAll('.ck-paso').forEach((sec) => { sec.hidden = Number(sec.dataset.paso) !== n; });
    document.querySelectorAll('#ck-stepper li').forEach((li) => {
        const k = Number(li.dataset.n);
        li.classList.toggle('hecho', k < n);
        li.classList.toggle('actual', k === n);
        li.querySelector('button').disabled = k > PASO_MAX;
        li.querySelector('.ck-num').innerHTML = k < n ? icon('check', 13) : k;
        if (k === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
    });
    const sig = document.getElementById('ck-siguiente');
    if (sig) { const p = PASOS[n - 1]; sig.hidden = !p.sig; if (p.sig) sig.innerHTML = `${p.sig} ${icon('arrow', 15)}`; }
    const vac = document.getElementById('btn-vaciar'); if (vac) vac.hidden = n !== 1;
    if (n === 4) pintarRevision();
    if (!sinHistorial) {
        const q = new URLSearchParams(location.search);
        if (n === 1) q.delete('paso'); else q.set('paso', n);
        const url = location.pathname + (q.toString() ? '?' + q : '');
        if (url !== location.pathname + location.search) history.pushState({ kzPaso: n }, '', url);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('popstate', () => { if (cliente) irPaso(pasoDeURL(), { sinHistorial: true, sinValidar: true }); });

// Paso 4: lo que se va a pedir, a dónde y cómo se paga (con "Cambiar" a cada paso)
function pintarRevision() {
    const sel = document.getElementById('metodo-pago');
    const metodo = sel.options[sel.selectedIndex].text.replace(/\s*\(saldo:.*\)$/, '');
    const pts = puntosCanje();
    const notas = document.getElementById('notas').value.trim();
    api(`/carrito/${cliente.id}`).then((items) => {
        document.getElementById('ck-revision').innerHTML = `
            <div class="ck-bloque">
                <div class="ck-bloque-head"><strong>${icon('package', 15)} Productos</strong><button class="ck-cambiar" onclick="irPaso(1)">Cambiar</button></div>
                ${items.map((i) => `<div class="ck-linea"><span>${i.cantidad} × ${i.nombre}${i.garantia_plan ? ` <em>+ ${i.garantia_plan}</em>` : ''}</span><span class="mono">${formatoMoneda2(Number(i.precio_final ?? i.precio) * i.cantidad + Number(i.garantia_costo || 0))}</span></div>`).join('')}
            </div>
            <div class="ck-bloque">
                <div class="ck-bloque-head"><strong>${icon('pin', 15)} Envío</strong><button class="ck-cambiar" onclick="irPaso(2)">Cambiar</button></div>
                <div>${document.getElementById('direccion').value.trim()}</div>
                ${notas ? `<div class="ck-sub">Notas: ${notas.replace(/</g, '&lt;')}</div>` : ''}
                <div class="ck-sub">${COT && COT.envio === 0 ? 'Envío gratis' : 'Envío estándar ' + formatoMoneda2(COT ? COT.envio : 199)} · llega en 2 a 5 días hábiles</div>
            </div>
            <div class="ck-bloque">
                <div class="ck-bloque-head"><strong>${icon('card', 15)} Pago</strong><button class="ck-cambiar" onclick="irPaso(3)">Cambiar</button></div>
                <div>${metodo}</div>
                ${pts ? `<div class="ck-sub">Canjeas ${pts.toLocaleString('es-MX')} puntos del Club</div>` : ''}
                ${sel.value === 'spei' || sel.value === 'tienda' ? '<div class="ck-sub">Recibirás una ficha de pago; el pedido se confirma al pagar.</div>' : ''}
            </div>`;
        const b = document.getElementById('btn-comprar');
        if (b && !b.disabled && COT) b.textContent = 'Confirmar pedido · ' + formatoMoneda2(COT.total);
    });
}

function fmtNum(el) {
    const d = el.value.replace(/\D/g, '').slice(0, 19);
    el.value = d.replace(/(.{4})/g, '$1 ').trim();
}
function cambioMetodo() {
    const sel = document.getElementById('metodo-pago');
    const box = document.getElementById('tarjeta-nueva');
    if (!sel || !box) return;
    box.hidden = sel.value !== 'nueva';
    document.getElementById('box-paypal').hidden = sel.value !== 'paypal';
    document.getElementById('box-monedero').hidden = sel.value !== 'monedero';
    pintarBoxMonedero();
}

// Pago con monedero: saldo disponible, total y saldo después del pago.
function pintarBoxMonedero() {
    const box = document.getElementById('box-monedero');
    if (!box || box.hidden || !COT) return;
    const despues = MONEDERO.saldo - COT.total;
    box.innerHTML = `
        <h4>${icon('wallet', 15)} Pago con monedero</h4>
        <div class="mon-calc"><span>Saldo disponible</span><strong class="mono">${formatoMoneda2(MONEDERO.saldo)}</strong></div>
        <div class="mon-calc"><span>Total a pagar</span><strong class="mono">${formatoMoneda2(COT.total)}</strong></div>
        <div class="mon-calc ${despues < 0 ? 'falta' : 'ok'}"><span>${despues < 0 ? 'Te faltan' : 'Saldo después del pago'}</span><strong class="mono">${formatoMoneda2(Math.abs(despues))}</strong></div>
        ${despues < 0 ? `<a class="btn btn-outline btn-sm" href="/monedero.html" style="margin-top:8px">${icon('plus', 14)} Recargar monedero</a>` : ''}`;
}

function formatoMoneda2(v) { return Number(v || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' }); }

// Desglose de la compra tal como lo calcula el servidor.
function desgloseHTML(c) {
    const fila = (txt, val, estilo = 'color:var(--text-muted)') =>
        `<div style="display:flex;justify-content:space-between;margin-bottom:6px;${estilo}"><span>${txt}</span><span class="mono">${val}</span></div>`;
    return [
        fila('Productos', formatoMoneda2(c.productos)),
        c.garantias > 0 ? fila('Garantías extendidas', formatoMoneda2(c.garantias)) : '',
        ...c.promociones.map((p) => fila(`${icon('star', 12)} ${p.nombre}`, '-' + formatoMoneda2(p.monto), 'color:var(--success)')),
        fila('Subtotal', formatoMoneda2(c.base_impuestos), ''),
        ...c.impuestos.map((t) => fila(`${t.nombre} (${Number(t.porcentaje)}%)`, formatoMoneda2(t.monto))),
        fila('Envío', c.envio === 0 ? 'Gratis' : formatoMoneda2(c.envio)),
        c.descuento_puntos > 0 ? fila('Descuento por puntos', '-' + formatoMoneda2(c.descuento_puntos), 'color:var(--success)') : '',
        `<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:10px 0 16px"><span>Total</span><span class="mono" id="total-txt">${formatoMoneda2(c.total)}</span></div>`,
    ].join('');
}

function puntosCanje() {
    const el = document.getElementById('canje');
    if (!el) return 0;
    let v = Math.max(0, Math.min(Number(el.value) || 0, Number(el.max)));
    v = v - (v % 100);
    return v;
}
let _cotTimer = null;
function recalcular() {
    const pts = puntosCanje();
    const cm = document.getElementById('canje-mxn'); if (cm) cm.textContent = formatoMoneda(pts * RECOMP.valor_punto);
    clearTimeout(_cotTimer);
    _cotTimer = setTimeout(async () => {
        try { COT = await api('/checkout/cotizar', { method: 'POST', body: { items: ITEMS, puntos_canjear: pts } }); } catch { return; }
        const r = document.getElementById('resumen-totales'); if (r) r.innerHTML = desgloseHTML(COT);
        const bc = document.getElementById('btn-comprar'); if (bc && !bc.disabled) bc.textContent = 'Confirmar pedido · ' + formatoMoneda2(COT.total);
        if (PASO === 4) pintarRevision();
        pintarBoxMonedero();
    }, pts ? 250 : 0);
}

function usarDireccionGuardada() {
    const sel = document.getElementById('dir-guardada');
    const input = document.getElementById('direccion');
    if (!sel || !input) return;
    if (!sel.value) { input.readOnly = false; return; }
    const d = DIRECCIONES.find((x) => String(x.id) === sel.value);
    if (d) { input.value = [d.calle, d.ciudad, d.estado, d.codigo_postal].filter(Boolean).join(', '); input.readOnly = true; }
}

async function cambiarCantidad(itemId, nueva, stock) {
    nueva = Math.max(1, Math.min(Number(nueva), stock));
    try {
        await api(`/carrito/${itemId}`, { method: 'PUT', body: { cantidad: nueva } });
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function cambiarGarantia(itemId, clave) {
    try {
        await api(`/carrito/${itemId}`, { method: 'PUT', body: { garantia: clave } });
        toast(clave === 'none' ? 'Garantía quitada' : 'Garantía actualizada', 'ok');
        cargarCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function quitarDelCarrito(itemId) {
    try {
        await api(`/carrito/${itemId}`, { method: 'DELETE' });
        toast('Producto quitado del carrito', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
document.getElementById('btn-vaciar').addEventListener('click', async () => {
    if (!(await confirmar('¿Vaciar todo el carrito?', { okText: 'Vaciar', peligro: true }))) return;
    if (!cliente) { CarritoInvitado.vaciar(); actualizarBadgeCarrito(); cargarCarritoInvitado(); toast('Carrito vaciado', 'ok'); return; }
    try {
        await api('/carrito', { method: 'DELETE' });
        toast('Carrito vaciado', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
});

// Resuelve el <select> de método de pago a un texto para guardar en el pedido.
// Si es tarjeta nueva la valida y (si se pidió) la guarda antes de comprar.
async function resolverMetodoPago() {
    const v = document.getElementById('metodo-pago').value;
    if (v === 'spei') return { texto: 'Transferencia SPEI', tipo: 'spei' };
    if (v === 'paypal') return { texto: 'PayPal', tipo: 'paypal' };
    if (v === 'monedero') return { texto: 'Monedero Kozmok', tipo: 'monedero' };
    if (v === 'tienda') return { texto: 'Pago en tienda', tipo: 'tienda' };
    if (v.startsWith('mp:')) {
        const m = METODOS.find((x) => String(x.id) === v.slice(3));
        return { texto: (m ? `Tarjeta ${MARCA_LABEL[m.marca] || ''} ****${m.ultimos4}`.replace(/\s+/g, ' ').trim() : 'Tarjeta'), tipo: 'tarjeta' };
    }
    // Tarjeta nueva
    const numero = document.getElementById('tn-num').value.replace(/\s/g, '');
    const titular = document.getElementById('tn-titular').value.trim();
    const cvv = document.getElementById('tn-cvv').value.trim();
    if (numero.length < 13 || numero.length > 19) { toast('Revisa el número de tarjeta', 'warn'); return null; }
    if (!titular) { toast('Escribe el titular de la tarjeta', 'warn'); return null; }
    if (!/^\d{3,4}$/.test(cvv)) { toast('El CVV debe tener 3 o 4 dígitos', 'warn'); return null; }

    const mes = Number(document.getElementById('tn-mes').value);
    const anio = Number(document.getElementById('tn-anio').value);
    const marca = /^4/.test(numero) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(numero) ? 'Mastercard' : /^3[47]/.test(numero) ? 'American Express' : '';
    if (document.getElementById('tn-guardar').checked) {
        try {
            await api(`/clientes/${cliente.id}/metodos-pago`, {
                method: 'POST',
                body: { tipo: 'tarjeta', numero, titular, expira_mes: mes, expira_anio: anio, predeterminada: METODOS.length === 0 },
            });
        } catch (e) { /* si falla el guardado, igual se puede comprar */ }
    }
    return { texto: `Tarjeta ${marca} ****${numero.slice(-4)}`.replace(/\s+/g, ' '), tipo: 'tarjeta' };
}

async function confirmarCompra() {
    const items = await api(`/carrito/${cliente.id}`);
    const direccion = document.getElementById('direccion').value.trim();
    if (!direccion) { toast('Ingresa o elige una dirección de envío', 'warn'); return; }

    const mp = await resolverMetodoPago();
    if (!mp) { irPaso(3, { sinValidar: true }); return; }
    // Pago con monedero: validación y confirmación (saldo antes y después)
    if (mp.tipo === 'monedero') {
        if (MONEDERO.saldo < COT.total) { toast(`Tu saldo (${formatoMoneda2(MONEDERO.saldo)}) no alcanza para el total de ${formatoMoneda2(COT.total)}. Recarga tu monedero o elige otro método.`, 'warn'); return; }
        const ok = await confirmar(`Se descontarán ${formatoMoneda2(COT.total)} de tu monedero. Saldo disponible: ${formatoMoneda2(MONEDERO.saldo)} · saldo después del pago: ${formatoMoneda2(MONEDERO.saldo - COT.total)}.`, { okText: 'Confirmar pago' });
        if (!ok) return;
    }

    const btn = document.getElementById('btn-comprar');
    btn.disabled = true; btn.textContent = 'Procesando…';
    try {
        const pedido = await api('/pedidos', {
            method: 'POST',
            body: {
                items: items.map((i) => ({ producto_id: i.producto_id, cantidad: i.cantidad, garantia: i.garantia_clave || 'none' })),
                metodo_pago: mp.texto, metodo_tipo: mp.tipo, direccion_envio: direccion,
                notas: document.getElementById('notas').value.trim() || null,
                puntos_canjear: puntosCanje(),
            }
        });
        actualizarBadgeCarrito();
        location.href = `/gracias.html?id=${pedido.id}`;
    } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Confirmar pedido' + (COT ? ' · ' + formatoMoneda2(COT.total) : '');
    }
}

// ---- Carrito sin sesión: lo guardado en el navegador ----
// Se puede revisar y ajustar; para pagar se inicia sesión (o se crea la
// cuenta) y el carrito se pasa solo a la cuenta.
async function cargarCarritoInvitado() {
    const cont = document.getElementById('carrito-contenido');
    const guardados = CarritoInvitado.leer();
    document.getElementById('btn-vaciar').hidden = guardados.length === 0;
    if (!guardados.length) {
        cont.innerHTML = `
            <div class="vacio-card">
                <span class="vacio-ico">${icon('cart', 30)}</span>
                <h3>Tu carrito está vacío</h3>
                <p>Agrega productos desde el catálogo o arma tu PC pieza por pieza. No necesitas cuenta para ir llenándolo.</p>
                <div class="vacio-acciones">
                    <a href="/index.html?ver=todo" class="btn btn-primary">Ver catálogo</a>
                    <a href="/armar-pc.html" class="btn btn-outline">Arma tu PC</a>
                </div>
            </div>`;
        return;
    }
    const productos = await api('/productos').catch(() => []);
    const items = guardados.map((g) => ({ ...g, p: productos.find((x) => x.id === g.producto_id) })).filter((i) => i.p);
    let subtotal = 0;
    const filas = items.map((i) => {
        const gCosto = costoGarantia(i.p.precio, i.garantia) * i.cantidad;
        const linea = Number(i.p.precio_final ?? i.p.precio) * i.cantidad + gCosto;
        subtotal += linea;
        return `
        <div class="card cart-line">
            <img class="cart-thumb" src="${imagenProducto(i.p)}" alt="${i.p.nombre}" onerror="this.onerror=null;this.src='${ilustracionProducto(i.p)}'" />
            <div class="cart-info">
                <div class="nm">${i.p.nombre}</div>
                <div class="mono" style="color:var(--text-muted);font-size:.82rem">${precioHTML(i.p)} c/u</div>
                ${i.p.promocion ? `<div class="cart-promo">${icon('star', 12)} ${i.p.promocion.nombre}</div>` : ''}
                <div class="qty-stepper" style="margin-top:8px">
                    <button type="button" onclick="cantidadInvitado(${i.producto_id}, ${i.cantidad - 1}, ${i.p.stock})" ${i.cantidad <= 1 ? 'disabled' : ''}>−</button>
                    <span class="qty-val">${i.cantidad}</span>
                    <button type="button" onclick="cantidadInvitado(${i.producto_id}, ${i.cantidad + 1}, ${i.p.stock})" ${i.cantidad >= i.p.stock ? 'disabled' : ''}>+</button>
                </div>
                <div class="cart-gar">
                    <span class="ic-gar">${icon('shield', 13)}</span>
                    <select onchange="garantiaInvitado(${i.producto_id}, this.value)">
                        ${PLANES_GARANTIA.map((g) => `<option value="${g.clave}" ${g.clave === i.garantia ? 'selected' : ''}>${g.label}${g.factor ? ' · +' + formatoMoneda(costoGarantia(i.p.precio, g.clave)) : ''}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div class="cart-sub">
                <div class="mono">${formatoMoneda(linea)}</div>
                <div><button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="quitarInvitado(${i.producto_id})">Quitar</button></div>
            </div>
        </div>`;
    }).join('');
    const cot = await api('/checkout/cotizar', { method: 'POST', body: { items: items.map((i) => ({ producto_id: i.producto_id, cantidad: i.cantidad, garantia: i.garantia })) } });
    const next = encodeURIComponent('/carrito.html');
    cont.innerHTML = `
        <div class="cart-layout">
        <div class="cart-items">${filas}</div>
        <div class="card cart-resumen">
            <h3 class="cart-resumen-tit">Resumen del pedido</h3>
            ${desgloseHTML(cot).replace('>Total<', '>Total estimado<')}
            <div class="pago-box" style="margin-bottom:14px">
                <h4>${icon('lock', 15)} Inicia sesión para pagar</h4>
                <div class="pb-sub" style="margin:0">Tu carrito se guarda: al entrar o crear tu cuenta lo encuentras aquí mismo, listo para confirmar. Además ganas puntos del Club con esta compra.</div>
            </div>
            <a class="btn btn-primary btn-lg" style="width:100%" href="/login.html?next=${next}">Iniciar sesión y pagar</a>
            <a class="btn btn-outline" style="width:100%;margin-top:8px" href="/registro.html?next=${next}">Crear cuenta</a>
        </div>
        </div>`;
}
function cantidadInvitado(id, n, stock) {
    if (n < 1 || n > stock) return;
    CarritoInvitado.cambiar(id, { cantidad: n }); actualizarBadgeCarrito(); cargarCarritoInvitado();
}
function garantiaInvitado(id, clave) { CarritoInvitado.cambiar(id, { garantia: clave }); cargarCarritoInvitado(); }
function quitarInvitado(id) { CarritoInvitado.quitar(id); actualizarBadgeCarrito(); cargarCarritoInvitado(); }

if (cliente) cargarCarrito(); else cargarCarritoInvitado();
</script>
