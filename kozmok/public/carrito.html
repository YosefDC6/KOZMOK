<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container carrito-page" style="padding-top:36px;padding-bottom:60px;max-width:1160px">
    <div class="page-hero">
        <div class="hero-badge" data-ic="cart" data-ic-size="28"></div>
        <h1>Mi carrito</h1>
        <p>Revisa y modifica tu pedido antes de pagar.</p>
    </div>
    <div id="pasos"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <a href="/index.html?ver=todo" class="btn btn-ghost btn-sm">Seguir comprando</a>
        <button class="btn btn-outline btn-sm" id="btn-vaciar" hidden>Vaciar carrito</button>
    </div>
    <div id="carrito-contenido"><div class="empty-state">Cargando…</div></div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/garantia.js"></script>
<script src="/js/compra.js"></script>
<script>
document.getElementById('pasos').innerHTML = pasosCompra('carrito');

const VACIO = (sinCuenta) => `
    <div class="vacio-card">
        <span class="vacio-ico">${icon('cart', 30)}</span>
        <h3>Tu carrito está vacío</h3>
        <p>${sinCuenta ? 'Agrega productos desde el catálogo o arma tu PC pieza por pieza. No necesitas cuenta para ir llenándolo.' : 'Agrega productos desde el catálogo o recupera los que guardaste en favoritos.'}</p>
        <div class="vacio-acciones">
            <a href="/index.html?ver=todo" class="btn btn-primary">Ver catálogo</a>
            <a href="${sinCuenta ? '/armar-pc.html' : '/favoritos.html'}" class="btn btn-outline">${sinCuenta ? 'Arma tu PC' : 'Ver favoritos'}</a>
        </div>
    </div>`;

function lineaHTML(i, { invitado = false } = {}) {
    const clave = i.garantia_clave || i.garantia || 'none';
    const idRef = invitado ? i.producto_id : i.id;
    const fnCant = invitado ? 'cantidadInvitado' : 'cambiarCantidad';
    const fnGar = invitado ? 'garantiaInvitado' : 'cambiarGarantia';
    const fnQuitar = invitado ? 'quitarInvitado' : 'quitarDelCarrito';
    const sinStock = i.stock < i.cantidad || i.activo === false;
    return `
    <div class="card cart-line">
        <img class="cart-thumb" src="${imagenProducto(i)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${ilustracionProducto(i)}'"
             onclick="location.href='/index.html#producto-${i.producto_id}'" alt="${esc(i.nombre)}" />
        <div class="cart-info">
            <div class="nm">${esc(i.nombre)}</div>
            <div class="mono" style="color:var(--text-muted);font-size:.82rem">${precioHTML(i, 'mono')} c/u</div>
            ${i.promocion ? `<div class="cart-promo">${icon('medal', 12)} ${esc(i.promocion.nombre)} (${esc(i.promocion.etiqueta)})</div>` : ''}
            ${sinStock ? `<div class="cart-aviso">${i.activo === false ? 'Ya no está a la venta' : `Solo hay ${i.stock} disponibles`}</div>` : ''}
            <div class="qty-stepper" style="margin-top:8px">
                <button type="button" aria-label="Quitar una pieza" onclick="${fnCant}(${idRef}, ${i.cantidad - 1}, ${i.stock})" ${i.cantidad <= 1 ? 'disabled' : ''}>−</button>
                <span class="qty-val">${i.cantidad}</span>
                <button type="button" aria-label="Agregar una pieza" onclick="${fnCant}(${idRef}, ${i.cantidad + 1}, ${i.stock})" ${i.cantidad >= i.stock ? 'disabled' : ''}>+</button>
            </div>
            <div class="cart-gar">
                <span class="ic-gar">${icon('shield', 13)}</span>
                <select aria-label="Garantía extendida" onchange="${fnGar}(${idRef}, this.value)">
                    ${PLANES_GARANTIA.map((g) => {
                        const c = costoGarantia(i.precio, g.clave) * i.cantidad;
                        return `<option value="${g.clave}" ${g.clave === clave ? 'selected' : ''}>${g.label}${c > 0 ? ' · +' + formatoMoneda(c) : ''}</option>`;
                    }).join('')}
                </select>
            </div>
        </div>
        <div class="cart-sub">
            <div class="mono">${formatoMoneda(i.subtotal + Number(i.garantia_costo || 0), 2)}</div>
            ${Number(i.garantia_costo) > 0 ? `<div style="font-size:.72rem;color:var(--text-muted);font-weight:400">incl. garantía ${formatoMoneda(i.garantia_costo)}</div>` : ''}
            <div><button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="${fnQuitar}(${idRef})" aria-label="Eliminar producto">${icon('x', 13)} Quitar</button></div>
        </div>
    </div>`;
}

function avisoEnvio(r) {
    if (r.envio === 0) return `<div class="ship-hint free"><span>${icon('check', 15)} Tu pedido tiene <strong>envío gratis</strong>.</span><div class="ship-bar"><span style="width:100%"></span></div></div>`;
    const falta = Math.max(r.envio_gratis_desde - r.subtotal, 0);
    return `<div class="ship-hint"><span>Te faltan <strong>${formatoMoneda(falta)}</strong> para envío gratis.</span><div class="ship-bar"><span style="width:${Math.min(100, Math.round(r.subtotal / r.envio_gratis_desde * 100))}%"></span></div></div>`;
}

// ---- Carrito de la cuenta (servidor: GET /carrito/{cliente_id}) ----
async function cargarCarrito() {
    const cliente = Sesion.cliente();
    let c;
    try { c = await api(`/carrito/${cliente.id}`); }
    catch (e) { if (e.status === 401) return cargarCarritoInvitado(); throw e; }
    const cont = document.getElementById('carrito-contenido');
    document.getElementById('btn-vaciar').hidden = c.items.length === 0;
    if (c.items.length === 0) { cont.innerHTML = VACIO(false); return; }
    const r = c.resumen;
    const bloqueado = c.items.some((i) => !i.disponible);
    cont.innerHTML = `
        <div class="cart-layout">
            <div class="cart-items">${c.items.map((i) => lineaHTML(i)).join('')}</div>
            <div class="card cart-resumen">
                <h3 class="cart-resumen-tit">Resumen</h3>
                ${avisoEnvio(r)}
                ${resumenHTML(r, { puntos: false })}
                ${bloqueado ? '<p class="cart-aviso" style="margin:-6px 0 12px">Ajusta las cantidades marcadas para poder continuar.</p>' : ''}
                <a class="btn btn-primary btn-lg ${bloqueado ? 'disabled' : ''}" style="width:100%" href="${bloqueado ? '#' : '/checkout.html'}" id="btn-continuar"
                   ${bloqueado ? 'aria-disabled="true" onclick="return false"' : ''}>${icon('arrow', 16)} Continuar compra</a>
                <p style="font-size:.78rem;color:var(--text-muted);margin:10px 0 0;text-align:center">Paga con tarjeta, PayPal, transferencia o tu Monedero Kozmok.</p>
            </div>
        </div>`;
}

async function cambiarCantidad(itemId, nueva, stock) {
    nueva = Math.max(1, Math.min(Number(nueva), stock));
    try {
        await api(`/carrito/item/${itemId}`, { method: 'PUT', body: { cantidad: nueva } });
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function cambiarGarantia(itemId, clave) {
    try {
        await api(`/carrito/item/${itemId}`, { method: 'PUT', body: { garantia: clave } });
        toast(clave === 'none' ? 'Garantía quitada' : 'Garantía actualizada', 'ok');
        cargarCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
async function quitarDelCarrito(itemId) {
    try {
        await api(`/carrito/item/${itemId}`, { method: 'DELETE' });
        toast('Producto quitado del carrito', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
document.getElementById('btn-vaciar').addEventListener('click', async () => {
    if (!(await confirmar('¿Vaciar todo el carrito?', { okText: 'Vaciar', peligro: true }))) return;
    const cliente = Sesion.cliente();
    if (!cliente) { CarritoInvitado.vaciar(); actualizarBadgeCarrito(); cargarCarritoInvitado(); toast('Carrito vaciado', 'ok'); return; }
    try {
        await api(`/carrito/vaciar/${cliente.id}`, { method: 'DELETE' });
        toast('Carrito vaciado', 'ok');
        cargarCarrito(); actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
});

// ---- Carrito sin sesión: lo guardado en el navegador ----
// Se puede revisar y ajustar; para pagar se inicia sesión (o se crea la
// cuenta) y el carrito se pasa solo a la cuenta.
async function cargarCarritoInvitado() {
    const cont = document.getElementById('carrito-contenido');
    const guardados = CarritoInvitado.leer();
    document.getElementById('btn-vaciar').hidden = guardados.length === 0;
    if (!guardados.length) { cont.innerHTML = VACIO(true); return; }
    const [productos, impuestos] = await Promise.all([api('/catalogo').catch(() => []), api('/impuestos').catch(() => [])]);
    const items = guardados.map((g) => {
        const p = productos.find((x) => x.id === g.producto_id);
        if (!p) return null;
        return { ...p, producto_id: p.id, cantidad: g.cantidad, garantia: g.garantia, subtotal: p.precio * g.cantidad,
            garantia_costo: costoGarantia(p.precio, g.garantia) * g.cantidad };
    }).filter(Boolean);
    const productosT = items.reduce((a, i) => a + i.subtotal, 0);
    const gar = items.reduce((a, i) => a + i.garantia_costo, 0);
    const subtotal = productosT + gar;
    const r = {
        piezas: items.reduce((a, i) => a + i.cantidad, 0), productos: productosT, garantias: gar, subtotal,
        ahorro_promociones: items.reduce((a, i) => a + (i.precio_lista - i.precio) * i.cantidad, 0),
        impuestos_detalle: impuestos.map((t) => ({ ...t, monto: Math.round(subtotal * t.porcentaje) / 100 })),
        envio: subtotal >= 10000 ? 0 : 199, envio_gratis_desde: 10000, descuento_puntos: 0,
    };
    r.total = r.subtotal + r.impuestos_detalle.reduce((a, t) => a + t.monto, 0) + r.envio;
    const next = encodeURIComponent('/carrito.html');
    cont.innerHTML = `
        <div class="cart-layout">
        <div class="cart-items">${items.map((i) => lineaHTML(i, { invitado: true })).join('')}</div>
        <div class="card cart-resumen">
            <h3 class="cart-resumen-tit">Resumen</h3>
            ${avisoEnvio(r)}
            ${resumenHTML(r, { puntos: false })}
            <div class="pago-box" style="margin-bottom:14px">
                <h4>${icon('lock', 15)} Inicia sesión para pagar</h4>
                <div class="pb-sub" style="margin:0">Tu carrito se guarda: al entrar o crear tu cuenta lo encuentras aquí mismo, listo para confirmar. Además ganas puntos del Club con esta compra.</div>
            </div>
            <a class="btn btn-primary btn-lg" style="width:100%" href="/login.html?next=${next}">Iniciar sesión y pagar</a>
            <a class="btn btn-outline" style="width:100%;margin-top:8px" href="/registro.html?next=${next}">Crear cuenta</a>
        </div>
        </div>`;
}
function cantidadInvitado(id, n, stock) {
    if (n < 1 || n > stock) return;
    CarritoInvitado.cambiar(id, { cantidad: n }); actualizarBadgeCarrito(); cargarCarritoInvitado();
}
function garantiaInvitado(id, clave) { CarritoInvitado.cambiar(id, { garantia: clave }); cargarCarritoInvitado(); }
function quitarInvitado(id) { CarritoInvitado.quitar(id); actualizarBadgeCarrito(); cargarCarritoInvitado(); }

(async () => {
    const cliente = Sesion.cliente() || await Sesion.sincronizar();
    if (cliente) cargarCarrito(); else cargarCarritoInvitado();
})();
</script>
</body>
</html>
