<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi monedero · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script src="/js/paypal-botones.js"></script>
<script>
// Mi monedero: saldo en pesos para pagar en la tienda. Se recarga con
// PayPal o tarjeta (los botones de PayPal; el saldo sube cuando el servidor
// confirma el cobro) o por transferencia (se acredita cuando el equipo la
// confirma). Cada movimiento queda con el saldo que dejó.
const MONTOS = [100, 200, 500, 1000];
const TIPO_MOV = {
    recarga:   { txt: 'Recarga',   ic: 'plus' },
    compra:    { txt: 'Compra',    ic: 'cart' },
    reembolso: { txt: 'Reembolso', ic: 'undo' },
    ajuste:    { txt: 'Ajuste',    ic: 'settings' },
};
const METODO_TXT = { paypal: 'PayPal o tarjeta', transferencia: 'Transferencia bancaria', tarjeta: 'Tarjeta' };
let MON = null;
let MONTO = 200;
let METODO = 'paypal';
let PPCFG = { activo: false };

montarCuenta('monedero', async (panel) => {
    panel.innerHTML = `
        <div class="cuenta-head">
            <h1>Mi monedero</h1>
            <p>Recarga saldo y úsalo para pagar tus compras en un clic. El saldo no vence.</p>
        </div>
        <div class="monedero-grid">
            <div class="card monedero-saldo" id="mon-saldo"></div>
            <div class="card monedero-recarga" id="mon-recarga"></div>
        </div>
        <h3 style="margin:26px 0 12px">Historial de movimientos</h3>
        <div class="table-wrap" id="mon-historial"></div>`;
    await cargarMonedero();
});

async function cargarMonedero() {
    [MON, PPCFG] = await Promise.all([api('/monedero'), PayPalKZ.config()]);
    if (!PPCFG.activo && METODO === 'paypal') METODO = 'transferencia';
    if (!PPCFG.spei && METODO === 'transferencia' && PPCFG.activo) METODO = 'paypal';
    BOTONES_PP = false;
    pintarSaldo();
    pintarRecarga();
    pintarHistorial();
}

function pintarSaldo() {
    const bloqueado = MON.estado !== 'activo';
    document.getElementById('mon-saldo').innerHTML = `
        <div class="ms-ico">${icon('wallet', 26)}</div>
        <span class="ms-label">Saldo disponible</span>
        <strong class="ms-valor">${formatoMoneda2(MON.saldo)}</strong>
        ${MON.saldo_pendiente > 0 ? `<span class="ms-pend">${icon('clock', 13)} ${formatoMoneda2(MON.saldo_pendiente)} por acreditar (transferencia)</span>` : ''}
        ${bloqueado ? `<span class="ms-pend" style="color:var(--danger)">${icon('lock', 13)} ${escHTML(MON.aviso_estado || 'Monedero no disponible. Escríbenos en Soporte.')}</span>` : ''}
        <div class="ms-acciones">
            <a class="btn btn-outline btn-sm" href="/carrito.html">${icon('cart', 15)} Pagar con monedero</a>
            <a class="btn btn-ghost btn-sm" href="#mon-historial">Ver historial</a>
        </div>`;
}

function pintarRecarga() {
    const cont = document.getElementById('mon-recarga');
    if (MON.estado !== 'activo') {
        cont.innerHTML = `<h3>Recargar monedero</h3><p>${escHTML(MON.aviso_estado || 'Tu monedero no está disponible por ahora.')}</p>
            <a class="btn btn-outline btn-sm" href="/soporte.html">Ir a Soporte</a> <a class="btn btn-ghost btn-sm" href="/terminos.html#monedero">Ver reglamento</a>`;
        return;
    }
    const L = MON.limites || {};
    const tope = topeRecarga();
    const reglas = `Límites: ${formatoMoneda(L.por_operacion)} por recarga · ${formatoMoneda(L.por_dia)} y ${L.operaciones_dia} recargas en 24 h · ${formatoMoneda(L.por_mes)} al mes · saldo máximo ${formatoMoneda(L.saldo_maximo)}.
                <a href="/terminos.html#monedero">Reglamento del monedero</a>`;
    // Sin margen para recargar: se explica por qué y no se ofrece el formulario.
    if (tope < MON.recarga_min) {
        cont.innerHTML = `
            <h3>Recargar monedero</h3>
            <div class="mon-limites mon-sin-recarga">
                <span>${icon('info', 15)} <strong>Por ahora no puedes recargar</strong></span>
                <p>${textoMotivoTope(true)}</p>
                <small>${reglas}</small>
            </div>
            <p class="mon-nota">Tu saldo se usa como forma de pago al finalizar tu compra.</p>`;
        return;
    }
    if (MONTO > tope || MONTO < MON.recarga_min) MONTO = [...MONTOS].reverse().find((m) => m <= tope && m >= MON.recarga_min) || tope;
    cont.innerHTML = `
        <h3>Recargar monedero</h3>
        <div class="mon-limites">
            <span>Tu siguiente recarga puede ser de hasta <strong>${formatoMoneda(tope)}</strong>${MON.motivo_tope && MON.motivo_tope !== 'por_recarga' ? ` <em class="mon-motivo">(${textoMotivoTope(false)})</em>` : ''}</span>
            <small>${reglas}</small>
        </div>
        <label>Monto de recarga</label>
        <div class="mon-montos">
            ${MONTOS.map((m) => `<button type="button" class="mon-monto ${m === MONTO ? 'on' : ''}" onclick="elegirMonto(${m})" ${m > tope ? 'disabled title="Pasa tu límite disponible"' : ''}>${formatoMoneda(m)}</button>`).join('')}
        </div>
        <div class="field">
            <label for="mon-otro">Otro monto (${formatoMoneda(MON.recarga_min)} a ${formatoMoneda(tope)})</label>
            <input id="mon-otro" type="number" min="${MON.recarga_min}" max="${tope}" step="50" placeholder="$" inputmode="numeric" value="${MONTOS.includes(MONTO) ? '' : MONTO}"
                   oninput="otroMonto(this)" onchange="revisarOtroMonto(this)" />
            <small class="mon-aviso-monto" id="mon-otro-aviso" hidden></small>
        </div>
        <label>Método de pago</label>
        <div class="mon-metodos">
            ${['paypal', 'transferencia'].filter((k) => k === 'paypal' || PPCFG.spei).map((k) => `
                <label class="mon-metodo ${k === METODO ? 'on' : ''} ${k === 'paypal' && !PPCFG.activo ? 'off' : ''}">
                    <input type="radio" name="mon-metodo" value="${k}" ${k === METODO ? 'checked' : ''} ${k === 'paypal' && !PPCFG.activo ? 'disabled' : ''} onchange="elegirMetodo('${k}')" />
                    ${icon(k === 'paypal' ? 'card' : 'download', 16)} ${METODO_TXT[k]}${k === 'paypal' && !PPCFG.activo ? ' (no disponible)' : ''}
                </label>`).join('')}
        </div>
        <p class="mon-nota" id="mon-nota"></p>
        <div id="mon-paypal" class="pagar-botones" hidden></div>
        <button class="btn btn-primary btn-block" id="mon-btn" onclick="recargar()">${icon('wallet', 16)} Recargar ${formatoMoneda(MONTO)}</button>
        <p class="mon-nota">Tu saldo se usa como forma de pago al finalizar tu compra.</p>`;
    notaMetodo();
    pintarPagoRecarga();
}

function elegirMonto(m) {
    MONTO = m;
    document.getElementById('mon-otro').value = '';
    avisoMonto('');
    document.querySelectorAll('.mon-monto').forEach((b) => b.classList.toggle('on', b.textContent.trim() === formatoMoneda(m)));
    actualizarBoton();
}
// Tope de la siguiente recarga: el menor de todos los límites (lo calcula el servidor).
function topeRecarga() {
    if (MON.tope_recarga != null) return Number(MON.tope_recarga);
    return Math.min(MON.recarga_max, MON.disponible_hoy ?? MON.recarga_max);
}
// Por qué no se puede recargar más (largo para el aviso; corto para el paréntesis).
function textoMotivoTope(largo) {
    const L = MON.limites || {}, U = MON.uso || {};
    const enCamino = Number(MON.saldo_pendiente) > 0;
    switch (MON.motivo_tope) {
        case 'saldo': return largo
            ? `Tu monedero llegó a su saldo máximo de ${formatoMoneda(L.saldo_maximo)}${enCamino ? ', contando las transferencias que están por acreditarse' : ''}. Úsalo en tus compras y podrás volver a recargar.`
            : `por el saldo máximo de ${formatoMoneda(L.saldo_maximo)}`;
        case 'dia': return largo
            ? `Ya recargaste ${formatoMoneda(U.dia)} en las últimas 24 horas, el máximo por día. Podrás recargar de nuevo cuando pasen 24 horas de tus recargas.`
            : `por el máximo de ${formatoMoneda(L.por_dia)} en 24 horas`;
        case 'mes': return largo
            ? `Ya recargaste ${formatoMoneda(U.mes)} este mes, el máximo mensual. Podrás recargar de nuevo el próximo mes.`
            : `por el máximo de ${formatoMoneda(L.por_mes)} al mes`;
        case 'operaciones': return `Ya hiciste ${U.operaciones_dia} recargas en las últimas 24 horas (máximo ${L.operaciones_dia}). Podrás recargar de nuevo cuando pasen 24 horas.`;
        default: return largo ? 'Llegaste al límite de recargas de tu monedero.' : '';
    }
}
function avisoMonto(txt) {
    const a = document.getElementById('mon-otro-aviso');
    if (!a) return;
    a.hidden = !txt;
    a.textContent = txt || '';
}
// "Otro monto": no deja escribir más que el tope de la recarga.
function otroMonto(input) {
    const tope = topeRecarga();
    let v = Number(input.value) || 0;
    if (v > tope) {
        v = tope;
        input.value = tope;
        avisoMonto(`La recarga puede ser de hasta ${formatoMoneda(tope)}${MON.motivo_tope && MON.motivo_tope !== 'por_recarga' ? ` ${textoMotivoTope(false)}` : ''}.`);
    } else avisoMonto('');
    MONTO = v;
    document.querySelectorAll('.mon-monto').forEach((b) => b.classList.remove('on'));
    actualizarBoton();
}
function revisarOtroMonto(input) {
    if (input.value !== '' && Number(input.value) < MON.recarga_min) avisoMonto(`La recarga mínima es de ${formatoMoneda(MON.recarga_min)}.`);
}
function elegirMetodo(k) {
    METODO = k;
    document.querySelectorAll('.mon-metodo').forEach((l) => l.classList.toggle('on', l.querySelector('input').value === k));
    notaMetodo();
    pintarPagoRecarga();
}
// Con PayPal / tarjeta los botones de PayPal reemplazan al botón "Recargar"
let BOTONES_PP = false;
function pintarPagoRecarga() {
    const caja = document.getElementById('mon-paypal'), btn = document.getElementById('mon-btn');
    if (!caja || !btn) return;
    const pp = METODO === 'paypal' && PPCFG.activo;
    caja.hidden = !pp; btn.hidden = pp;
    if (!pp || BOTONES_PP) return;
    BOTONES_PP = true;
    PayPalKZ.botones(caja, {
        crearOrden: async () => {
            const tope = topeRecarga();
            if (!(MONTO >= MON.recarga_min && MONTO <= tope)) throw new Error(tope < MON.recarga_min ? 'Por ahora llegaste al límite de recargas o de saldo de tu monedero.' : `La recarga debe ser de ${formatoMoneda(MON.recarga_min)} a ${formatoMoneda(tope)}`);
            return (await api('/monedero/paypal/orden', { method: 'POST', body: { monto: MONTO } })).id;
        },
        alAprobar: async (ordenId) => {
            const r = await api('/monedero/paypal/capturar', { method: 'POST', body: { orden_id: ordenId } });
            toast(r.message, 'ok');
            BOTONES_PP = false;
            await cargarMonedero();
        },
        alCancelar: () => toast('No se hizo ningún cargo.', 'warn'),
    });
}
function notaMetodo() {
    const n = document.getElementById('mon-nota');
    if (!n) return;
    n.textContent = METODO === 'transferencia'
        ? 'Te damos una referencia para transferir. El saldo aparece en cuanto confirmamos tu depósito.'
        : 'Pagas con tu cuenta PayPal o con tarjeta de débito o crédito (sin cuenta). El saldo queda disponible en cuanto PayPal confirma el cobro. Kozmok no ve ni guarda los datos de tu tarjeta.';
}
function actualizarBoton() {
    const b = document.getElementById('mon-btn');
    if (!b) return;
    b.innerHTML = `${icon('wallet', 16)} Recargar ${MONTO > 0 ? formatoMoneda(MONTO) : ''}`;
    b.disabled = !(MONTO >= MON.recarga_min && MONTO <= topeRecarga());
}

async function recargar() {
    const tope = topeRecarga();
    if (!(MONTO >= MON.recarga_min && MONTO <= tope)) {
        toast(tope < MON.recarga_min ? 'Por ahora llegaste al límite de recargas o de saldo de tu monedero.' : `La recarga debe ser de ${formatoMoneda(MON.recarga_min)} a ${formatoMoneda(tope)}`, 'warn');
        return;
    }
    const b = document.getElementById('mon-btn');
    b.disabled = true; b.textContent = 'Procesando…';
    try {
        const r = await api('/monedero/recargar', { method: 'POST', body: { monto: MONTO, metodo: 'transferencia' } });
        await cargarMonedero();
        if (r.pendiente && r.datos_transferencia) {
            verDatosTransferencia({ ...r.datos_transferencia, monto: MONTO, fecha: new Date().toISOString() });
        } else {
            toast(r.message, 'ok');
        }
    } catch (e) {
        toast(e.message, 'error');
        b.disabled = false; actualizarBoton();
    }
}

function pintarHistorial() {
    const movs = MON.movimientos || [];
    document.getElementById('mon-historial').innerHTML = `
        <table>
            <thead><tr><th>Fecha</th><th>Concepto</th><th>Método</th><th style="text-align:right">Monto</th><th style="text-align:right">Saldo</th></tr></thead>
            <tbody>
                ${movs.length === 0 ? '<tr><td colspan="5">Aún no tienes movimientos. Haz tu primera recarga.</td></tr>' : movs.map((m) => {
                    const monto = Number(m.monto);
                    const t = TIPO_MOV[m.tipo] || { txt: m.tipo, ic: 'info' };
                    const verDatos = m.estado === 'pendiente' && m.tipo === 'recarga' && m.metodo === 'transferencia' && m.referencia && MON.transferencia
                        ? ` <button class="btn btn-outline btn-sm mov-datos" onclick="verDatosTransferencia(${escHTML(JSON.stringify({ referencia: m.referencia, monto: Number(m.monto), fecha: m.fecha }))})">${icon('info', 13)} Ver datos para transferir</button>` : '';
                    const est = m.estado === 'pendiente' ? ' <span class="tag" style="color:var(--warning);border-color:var(--warning)">Por acreditar</span>' + verDatos
                              : m.estado === 'cancelado' ? ' <span class="tag">Rechazada</span>' : '';
                    return `<tr class="${m.estado !== 'aplicado' ? 'mov-off' : ''}">
                        <td>${formatoFecha(m.fecha)}</td>
                        <td><span class="mov-tipo" title="${t.txt}">${icon(t.ic, 14)}</span> ${m.concepto || t.txt}${m.numero_orden ? ` · <a href="/pedidos.html">${m.numero_orden}</a>` : ''}${est}</td>
                        <td>${m.metodo ? METODO_TXT[m.metodo] || m.metodo : '—'}</td>
                        <td class="mono" style="text-align:right;color:${monto >= 0 ? 'var(--success)' : 'var(--danger)'}">${monto >= 0 ? '+' : '-'}${formatoMoneda2(Math.abs(monto))}</td>
                        <td class="mono" style="text-align:right">${m.saldo_resultante !== null ? formatoMoneda2(m.saldo_resultante) : '—'}</td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>`;
}

// Datos para transferir una recarga pendiente. Se puede volver a abrir
// desde el historial cuantas veces haga falta.
function verDatosTransferencia({ referencia, monto, fecha, banco, clabe, beneficiario }) {
    const t = { ...(MON.transferencia || {}), ...(clabe ? { banco, clabe, beneficiario } : {}) };
    if (!t.clabe) { toast('Por ahora no tenemos disponibles los datos para transferir. Escríbenos desde Soporte.', 'warn'); return; }
    const dias = Number((MON.transferencia || {}).dias) || 3;
    const limite = fecha ? new Date(new Date(fecha).getTime() + dias * 86400000) : null;
    const montoTxt = formatoMoneda2(monto);
    // CLABE en grupos (banco · plaza · cuenta · verificador) para leerla y dictarla fácil
    const clabeVer = /^\d{18}$/.test(t.clabe) ? `${t.clabe.slice(0, 3)} ${t.clabe.slice(3, 6)} ${t.clabe.slice(6, 17)} ${t.clabe.slice(17)}` : t.clabe;
    const todo = `Transferencia SPEI\nBanco: ${t.banco}\nBeneficiario: ${t.beneficiario}\nCLABE: ${t.clabe}\nConcepto / referencia: ${referencia}\nMonto: ${montoTxt}`
        + (limite ? `\nFecha límite: ${limite.toLocaleDateString('es-MX', { dateStyle: 'long' })}` : '');
    const btnCopiar = (valor, etq) => `<button type="button" class="td-copiar" data-copiar="${escHTML(valor)}" aria-label="Copiar ${etq}">${icon('clipboard', 15)}<span>Copiar</span></button>`;
    const ov = document.createElement('div');
    ov.className = 'confirm-overlay';
    ov.innerHTML = `
        <div class="confirm-box td-box" role="dialog" aria-modal="true" aria-labelledby="td-titulo">
            <div class="td-cab">
                <div class="td-ico">${icon('download', 20)}</div>
                <div><h3 id="td-titulo">Datos para transferir</h3><p>Transferencia SPEI desde la app o la página de tu banco</p></div>
                <button type="button" class="td-cerrar" data-x aria-label="Cerrar">${icon('x', 18)}</button>
            </div>

            <div class="td-monto">
                <span class="td-etq">Monto exacto a transferir</span>
                <div class="td-valor-fila"><strong>${montoTxt}</strong>${btnCopiar(Number(monto).toFixed(2), 'monto')}</div>
            </div>

            <div class="td-dato td-clave">
                <span class="td-etq">CLABE interbancaria</span>
                <div class="td-valor-fila"><span class="td-valor mono">${escHTML(clabeVer)}</span>${btnCopiar(t.clabe, 'CLABE')}</div>
            </div>

            <div class="td-dato td-clave">
                <span class="td-etq">Concepto / referencia <em>(escríbela tal cual)</em></span>
                <div class="td-valor-fila"><span class="td-valor mono">${escHTML(referencia)}</span>${btnCopiar(referencia, 'referencia')}</div>
            </div>

            <div class="td-mini">
                <div class="td-dato"><span class="td-etq">Banco</span><div class="td-valor-fila"><span class="td-valor-sm">${escHTML(t.banco)}</span></div></div>
                <div class="td-dato"><span class="td-etq">Beneficiario</span><div class="td-valor-fila"><span class="td-valor-sm">${escHTML(t.beneficiario)}</span>${btnCopiar(t.beneficiario, 'beneficiario')}</div></div>
            </div>

            ${limite ? `<div class="td-limite">${icon('clock', 15)}<span>Transfiere antes del <strong>${limite.toLocaleDateString('es-MX', { dateStyle: 'long' })}</strong>; después la recarga se cancela.</span></div>` : ''}

            <ol class="td-pasos">
                <li>Abre la app de tu banco y elige <strong>transferir a otro banco (SPEI)</strong>.</li>
                <li>Pega la <strong>CLABE</strong> y el <strong>monto exacto</strong>.</li>
                <li>En el concepto escribe la <strong>referencia</strong>: así identificamos tu depósito.</li>
            </ol>
            <p class="td-nota">Tu saldo se acredita cuando confirmamos el depósito. Estos datos siguen disponibles en tu historial de movimientos.</p>

            <div class="td-acciones">
                <button type="button" class="btn btn-outline" data-todo>${icon('clipboard', 16)} Copiar todos los datos</button>
                <button type="button" class="btn btn-primary" data-x>Entendido</button>
            </div>
        </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('open'));
    const cerrar = () => { ov.classList.remove('open'); document.removeEventListener('keydown', esc); setTimeout(() => ov.remove(), 200); };
    const esc = (e) => { if (e.key === 'Escape') cerrar(); };
    document.addEventListener('keydown', esc);
    ov.querySelectorAll('[data-x]').forEach((b) => b.addEventListener('click', cerrar));
    ov.addEventListener('click', (e) => { if (e.target === ov) cerrar(); });
    const copiar = async (texto, boton) => {
        if (await copiarTexto(texto)) {
            const antes = boton.innerHTML;
            boton.classList.add('copiado');
            boton.innerHTML = `${icon('check', 15)}<span>Copiado</span>`;
            setTimeout(() => { boton.classList.remove('copiado'); boton.innerHTML = antes; }, 1600);
        } else { toast('No se pudo copiar; selecciónalo y cópialo a mano', 'warn'); }
    };
    ov.querySelectorAll('[data-copiar]').forEach((b) => b.addEventListener('click', () => copiar(b.dataset.copiar, b)));
    ov.querySelector('[data-todo]').addEventListener('click', (e) => copiar(todo, e.currentTarget));
    ov.querySelector('.td-dato .td-copiar').focus();
}

function formatoMoneda2(v) {
    return Number(v || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
}
</script>
</body>
</html>
