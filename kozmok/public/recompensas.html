<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club de puntos · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
montarCuenta('recompensas', async (panel, P) => {
    const r = await api(`/clientes/${P.id}/recompensas`);
    const sig = r.siguiente_nivel;

    panel.innerHTML = `
        <div class="cuenta-head">
            <h1>Club de puntos</h1>
            <p>Gana puntos con cada compra y canjéalos como descuento. 100 puntos = ${formatoMoneda(100 * r.valor_punto)}.</p>
        </div>

        <div class="club-hero">
            <div class="club-card lv-${r.nivel.clave}">
                <div class="cc-top">
                    <span class="cc-marca">${icon('star', 15)} Kozmok <em>Club</em></span>
                    <span class="cc-nivel">${nivelBadge(r.nivel.clave, 18)} ${r.nivel.nombre}</span>
                </div>
                <div class="cc-chip" aria-hidden="true"></div>
                <div class="cc-saldo">
                    <span class="cc-pts">${r.puntos.toLocaleString('es-MX')}<small>pts</small></span>
                    <span class="cc-val">= ${formatoMoneda(r.valor_en_dinero)} para tu próxima compra</span>
                </div>
                <div class="cc-pie">
                    <div><span class="cc-label">Socio</span><strong>${P.nombre}</strong></div>
                    <div class="cc-der"><span class="cc-label">Desde</span><strong>${P.fecha_registro ? new Date(P.fecha_registro).toLocaleDateString('es-MX', { month: '2-digit', year: '2-digit' }) : '—'}</strong></div>
                    <div class="cc-der"><span class="cc-label">No.</span><strong class="mono">KZ ${String(P.id).padStart(4, '0')}</strong></div>
                </div>
            </div>

            <div class="club-resumen">
                <div class="cr-stats">
                    <div><span>Ganas por compra</span><strong>x${r.nivel.multiplicador}</strong></div>
                    <div><span>Valor del punto</span><strong>$${Number(r.valor_punto).toFixed(2)}</strong></div>
                    <div><span>Pedidos</span><strong>${r.compras_total}</strong></div>
                </div>
                ${sig ? `
                <div class="cr-sig">
                    <div class="cr-sig-head">
                        <span>Rumbo a ${nivelBadge(sig.clave, 16)} <strong>${sig.nombre}</strong></span>
                        <span class="mono">${r.progreso}%</span>
                    </div>
                    <div class="cr-meta">
                        <span>Compras <em class="mono">${formatoMoneda(r.gasto_total)} / ${formatoMoneda(sig.minGasto)}</em></span>
                        <div class="club-bar"><span style="width:${Math.min(100, Math.round(r.gasto_total / sig.minGasto * 100))}%"></span></div>
                    </div>
                    <div class="cr-meta">
                        <span>Pedidos <em class="mono">${r.compras_total} / ${sig.minCompras}</em></span>
                        <div class="club-bar"><span style="width:${Math.min(100, Math.round(r.compras_total / sig.minCompras * 100))}%"></span></div>
                    </div>
                    <p>Cumple cualquiera de las dos y subes a ${sig.nombre} (x${sig.multiplicador} puntos).</p>
                </div>` : `
                <div class="cr-sig"><p style="margin:0">Estás en el nivel máximo: <strong>${r.nivel.nombre}</strong>. Ganas x${r.nivel.multiplicador} puntos en cada compra.</p></div>`}
                <a class="btn btn-primary" href="/carrito.html">${icon('cart', 16)} Canjear en el carrito</a>
            </div>
        </div>

        <h3 style="margin-bottom:12px">Niveles</h3>
        <div class="niveles-grid">
            ${r.niveles.map((n) => `
                <div class="nivel-item ${n.clave === r.nivel.clave ? 'is-actual' : ''}">
                    <div class="ni-head">${nivelBadge(n.clave, 22)} <strong>${n.nombre}</strong></div>
                    <span>x${n.multiplicador} puntos</span>
                    <span class="ni-req">Desde ${formatoMoneda(n.minGasto)} ó ${n.minCompras} compras</span>
                </div>
            `).join('')}
        </div>

        <div class="card" style="margin:22px 0">
            <h3 style="margin-top:0">¿Cómo funciona?</h3>
            <ul style="margin:0;padding-left:18px;color:var(--text-muted);font-size:.9rem;line-height:1.8">
                <li>Ganas puntos al confirmar un pedido (más puntos según tu nivel).</li>
                <li>Canjéalos en el carrito: cada 100 puntos son ${formatoMoneda(100 * r.valor_punto)} de descuento.</li>
                <li>Tu nivel sube por lo que compras (en total) o por qué tan seguido compras.</li>
            </ul>
        </div>

        <h3 style="margin-bottom:12px">Movimientos recientes</h3>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Puntos</th></tr></thead>
                <tbody>
                    ${r.movimientos.length === 0
                        ? '<tr><td colspan="3">Aún no tienes movimientos.</td></tr>'
                        : r.movimientos.map((m) => `
                            <tr>
                                <td>${formatoFecha(m.fecha)}</td>
                                <td>${m.motivo || (m.tipo === 'ganado' ? 'Puntos ganados' : 'Canje de puntos')}</td>
                                <td class="mono" style="text-align:right;color:${m.puntos >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                    ${m.puntos >= 0 ? '+' : ''}${m.puntos}
                                </td>
                            </tr>
                        `).join('')}
                </tbody>
            </table>
        </div>
    `;
});
</script>
</body>
</html>
