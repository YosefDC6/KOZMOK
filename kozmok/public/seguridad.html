<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seguridad · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
let CID = null;
const REGLAS = {
    len: (pw) => pw.length >= 8, may: (pw) => /[a-z]/.test(pw) && /[A-Z]/.test(pw),
    num: (pw) => /\d/.test(pw), sim: (pw) => /[^A-Za-z0-9]/.test(pw),
};
const MOTIVO = { credenciales: 'contraseña incorrecta', bloqueado: 'bloqueado por intentos', cuenta_inactiva: 'cuenta inactiva', registro: 'registro' };

montarCuenta('seguridad', async (panel, P) => {
    CID = P.id;
    const [sesiones, actividad] = await Promise.all([api('/auth/sesiones'), api('/auth/actividad')]);
    const fallidos = actividad.filter((a) => !a.exito).length;
    panel.innerHTML = `
        <div class="cuenta-head"><h1>Seguridad</h1><p>Tu contraseña, los dispositivos con sesión abierta y los últimos intentos de acceso a tu cuenta.</p></div>
        ${fallidos ? `<div class="pago-box pendiente" style="margin-top:0"><h4>${icon('alert', 15)} ${fallidos} intento(s) fallido(s) recientes</h4>
            <div class="pb-sub" style="margin:0">Si no fuiste tú, cambia tu contraseña: al hacerlo se cierran tus otras sesiones.</div></div>` : ''}
        <div class="card" style="max-width:520px;margin-bottom:16px">
            <h3 style="margin:0 0 12px">Cambiar contraseña</h3>
            <div class="field"><label for="s-actual">Contraseña actual</label><input type="password" id="s-actual" autocomplete="current-password" /></div>
            <div class="field"><label for="s-nueva">Nueva contraseña</label><input type="password" id="s-nueva" maxlength="72" autocomplete="new-password" />
                <ul class="pass-reglas" id="pass-reglas">
                    <li data-r="len">8 caracteres o más</li><li data-r="may">Mayúsculas y minúsculas</li>
                    <li data-r="num">Al menos un número</li><li data-r="sim">Al menos un símbolo</li>
                </ul></div>
            <div class="field"><label for="s-rep">Repetir nueva contraseña</label><input type="password" id="s-rep" autocomplete="new-password" /></div>
            <button class="btn btn-primary" id="btn-pass">Actualizar contraseña</button>
        </div>

        <div class="card" style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
                <h3 style="margin:0">Sesiones abiertas (${sesiones.length})</h3>
                ${sesiones.length > 1 ? '<button class="btn btn-outline btn-sm" id="btn-otras">Cerrar las demás sesiones</button>' : ''}
            </div>
            ${sesiones.map((x) => `
                <div class="sesion-fila">
                    <div><strong>${esc(navegadorDe(x.user_agent))}</strong> ${x.actual ? '<span class="tag ok">Esta sesión</span>' : ''}
                        <small>IP ${esc(x.ip || '—')} · inició ${formatoFechaHora(x.creada)} · último uso ${formatoFechaHora(x.ultimo_uso)} · vence ${formatoFecha(x.expira)}</small></div>
                    ${x.actual ? '' : `<button class="btn btn-ghost btn-sm" onclick="cerrarSesion(${x.id})">Cerrar</button>`}
                </div>`).join('')}
        </div>

        <div class="card">
            <h3 style="margin:0 0 6px">Actividad de inicio de sesión</h3>
            ${actividad.length === 0 ? '<p style="margin:0;color:var(--text-muted)">Sin registros.</p>' : actividad.map((a) => `
                <div class="sesion-fila">
                    <div><strong>${a.exito ? 'Acceso correcto' : 'Intento fallido'}</strong>${!a.exito && a.motivo ? ` · ${esc(MOTIVO[a.motivo] || a.motivo)}` : a.motivo === 'registro' ? ' · registro' : ''}
                        <small>${formatoFechaHora(a.fecha)} · IP ${esc(a.ip || '—')} · ${esc(navegadorDe(a.user_agent))}</small></div>
                    <span class="tag ${a.exito ? 'ok' : 'mal'}">${a.exito ? 'OK' : 'Fallido'}</span>
                </div>`).join('')}
        </div>`;
    document.getElementById('s-nueva').addEventListener('input', (e) => {
        document.querySelectorAll('#pass-reglas li').forEach((li) => li.classList.toggle('ok', REGLAS[li.dataset.r](e.target.value)));
    });
    document.getElementById('btn-pass').addEventListener('click', cambiarPassword);
    const otras = document.getElementById('btn-otras');
    if (otras) otras.addEventListener('click', async () => {
        try { const r = await api('/auth/sesiones/cerrar-otras', { method: 'POST' }); toast(r.message, 'ok'); setTimeout(() => location.reload(), 700); }
        catch (e) { toast(e.message, 'error'); }
    });
});

async function cerrarSesion(id) {
    try { await api(`/auth/sesiones/${id}`, { method: 'DELETE' }); toast('Sesión cerrada', 'ok'); setTimeout(() => location.reload(), 500); }
    catch (e) { toast(e.message, 'error'); }
}

async function cambiarPassword() {
    const actual = document.getElementById('s-actual').value, nueva = document.getElementById('s-nueva').value, rep = document.getElementById('s-rep').value;
    if (Object.values(REGLAS).some((f) => !f(nueva))) { toast('La nueva contraseña no cumple los requisitos', 'warn'); return; }
    if (nueva !== rep) { toast('Las contraseñas nuevas no coinciden', 'warn'); return; }
    try {
        const r = await api(`/clientes/${CID}/password`, { method: 'PUT', body: { actual, nueva } });
        toast(r.message, 'ok', 4500);
        setTimeout(() => location.reload(), 1200);
    } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
