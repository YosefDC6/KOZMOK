<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar contraseña · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
    <div class="page-hero">
        <div class="hero-badge" data-ic="lock" data-ic-size="28"></div>
        <h1>Recuperar contraseña</h1>
        <p>Escribe el correo de tu cuenta y te mandamos un enlace para crear una contraseña nueva.</p>
    </div>

    <div class="card" id="form-card">
        <form id="form-recuperar">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" required placeholder="tucorreo@ejemplo.com" autocomplete="email" />
            </div>
            <div id="rec-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-enviar">Enviar enlace</button>
        </form>
        <p style="margin-top:16px;text-align:center"><a href="/login.html">Volver a iniciar sesión</a></p>
    </div>

    <div class="card" id="enviado" hidden>
        <p style="margin-top:0;color:var(--text)" id="enviado-txt"></p>
        <p class="auth-nota" style="text-align:left">El enlace vence en 30 minutos y solo sirve una vez. Por seguridad no te decimos si el correo existe o no.</p>
        <a class="btn btn-outline" style="width:100%" href="/login.html">Volver a iniciar sesión</a>
    </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-enviar');
    const err = document.getElementById('rec-error');
    err.hidden = true;
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
        const r = await api('/auth/recuperar', { method: 'POST', body: { correo: document.getElementById('correo').value } });
        document.getElementById('enviado-txt').textContent = r.message;
        document.getElementById('form-card').hidden = true;
        document.getElementById('enviado').hidden = false;
    } catch (ex) {
        err.textContent = ex.message; err.hidden = false;
        btn.disabled = false; btn.textContent = 'Enviar enlace';
    }
});
</script>
</body>
</html>
