<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Promociones · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="stat-grid" id="kpis"></div>

        <div class="filters-bar" style="margin-top:18px">
            <input type="search" id="f-buscar" placeholder="Buscar promoción…" />
            <select id="f-situacion">
                <option value="">Todas</option>
                <option value="vigente">Vigentes</option>
                <option value="programada">Programadas</option>
                <option value="vencida">Vencidas</option>
                <option value="inactiva">Inactivas</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Promoción</th><th>Descuento</th><th>Aplica a</th><th>Vigencia</th><th>Situación</th><th>Uso</th><th></th></tr></thead>
                <tbody id="tabla"><tr><td colspan="7">Cargando…</td></tr></tbody>
            </table>
        </div>
        <p style="font-size:.8rem;color:var(--text-muted);margin-top:10px">
            Las promociones vigentes se aplican solas en el catálogo, el carrito, el checkout y las órdenes del ERP. Si a un producto le tocan varias, se usa la que más descuenta.
        </p>
    </main>
</div>

<div class="modal-overlay" id="modal-promo">
    <div class="modal modal-promo-x" id="modal-promo-body"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('promociones');
document.getElementById('topbar').innerHTML = adminHeader(
    'Promociones', 'Descuentos por porcentaje o monto, con vigencia y productos aplicables.',
    '<button class="btn btn-primary" onclick="abrirPromo()">Nueva promoción</button>'
);

let PROMOS = [], CATEGORIAS = [], PRODUCTOS = [];
const SITUACION = {
    vigente:    ['Vigente', 'var(--success)'],
    programada: ['Programada', 'var(--accent-light)'],
    vencida:    ['Vencida', 'var(--text-muted)'],
    inactiva:   ['Inactiva', 'var(--warning)'],
};

const valorTxt = (p) => p.tipo_descuento === 'porcentaje' ? `${Number(p.valor)}%` : `${formatoMoneda(p.valor)} por pieza`;
const alcanceTxt = (p) => {
    const d = p.alcance === 'todos' ? 'Todo el catálogo' : escHTML((p.donde || '').replace(/^en /, '').replace(/^./, (c) => c.toUpperCase()));
    return `${d}<div style="color:var(--text-muted);font-size:.76rem">${p.productos ?? 0} producto${p.productos === 1 ? '' : 's'} activo${p.productos === 1 ? '' : 's'}</div>`;
};
const pill = (k) => { const [t, c] = SITUACION[k] || [k, 'var(--text-muted)']; return `<span class="tag" style="color:${c};border-color:${c}">${t}</span>`; };

async function cargar() {
    PROMOS = await api('/admin/promociones');
    const vig = PROMOS.filter((p) => p.situacion === 'vigente');
    const desc = PROMOS.reduce((a, p) => a + Number(p.descuento_otorgado || 0), 0);
    document.getElementById('kpis').innerHTML = `
        <div class="stat-card"><div class="stat-label">Vigentes</div><div class="stat-value">${vig.length}</div><div class="stat-sub">${vig.filter((p) => p.mostrar_banner).length} en el banner de la tienda</div></div>
        <div class="stat-card"><div class="stat-label">Programadas</div><div class="stat-value">${PROMOS.filter((p) => p.situacion === 'programada').length}</div></div>
        <div class="stat-card"><div class="stat-label">Pedidos con promoción</div><div class="stat-value">${PROMOS.reduce((a, p) => a + p.pedidos, 0)}</div></div>
        <div class="stat-card"><div class="stat-label">Descuento otorgado</div><div class="stat-value" style="font-size:1.4rem">${formatoMoneda(desc)}</div><div class="stat-sub">en pedidos no cancelados</div></div>`;
    pintar();
}

function pintar() {
    const q = document.getElementById('f-buscar').value.trim().toLowerCase();
    const sit = document.getElementById('f-situacion').value;
    const lista = PROMOS.filter((p) => (!sit || p.situacion === sit) && (!q || `${p.nombre} ${p.descripcion || ''}`.toLowerCase().includes(q)));
    document.getElementById('tabla').innerHTML = lista.length ? lista.map((p) => `
        <tr>
            <td><strong>${p.nombre}</strong>${p.mostrar_banner ? ` <span class="tag" title="Se muestra en el banner de la portada">Banner</span>` : ''}${p.boletin_enviado ? ` <span class="tag ok" title="Anunciada por correo a los clientes suscritos al boletín">Boletín enviado</span>` : ''}
                <div style="color:var(--text-muted);font-size:.78rem">${p.descripcion || ''}</div></td>
            <td class="mono">${valorTxt(p)}</td>
            <td>${alcanceTxt(p)}</td>
            <td style="font-size:.84rem">${formatoFecha(p.fecha_inicio)} – ${formatoFecha(p.fecha_fin)}</td>
            <td>${pill(p.situacion)}</td>
            <td style="font-size:.84rem">${p.pedidos} pedido${p.pedidos === 1 ? '' : 's'}<div style="color:var(--text-muted)">${formatoMoneda(p.descuento_otorgado)}</div></td>
            <td style="white-space:nowrap">
                <button class="btn btn-outline btn-sm" onclick="abrirPromo(${p.id})">Editar</button>
                <button class="btn btn-ghost btn-sm" onclick="alternar(${p.id})">${p.estado === 'activa' ? 'Desactivar' : 'Activar'}</button>
                <button class="btn btn-ghost btn-sm" onclick="eliminar(${p.id})" title="Eliminar">${icon('x', 14)}</button>
            </td>
        </tr>`).join('') : `<tr><td colspan="7" style="color:var(--text-muted)">No hay promociones con ese filtro.</td></tr>`;
}

const fechaInput = (f) => { if (!f) return ''; const d = new Date(f); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

// ---- Alcance: mismo criterio que el servidor ----
const sinAcentos = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const palabras = (t) => String(t || '').split(',').map(sinAcentos).filter(Boolean);
let AL = { modo: 'todos', cat: '', marca: '', texto: '', sel: new Set(), q: '', fcat: '', fmarca: '', soloSel: false };

function coincide(x) {
    if (AL.modo === 'todos') return true;
    if (AL.modo === 'seleccion') return AL.sel.has(x.id);
    if (AL.cat && x.categoria_id !== Number(AL.cat)) return false;
    if (AL.marca && sinAcentos(x.marca) !== sinAcentos(AL.marca)) return false;
    const pal = palabras(AL.texto);
    return !pal.length || pal.some((w) => sinAcentos(x.nombre).includes(w));
}
// Tipo de producto = primera palabra del nombre (Mouse, Teclado, Audífonos…)
const tipoDe = (x) => (x.nombre || '').split(/\s+/)[0];
const conteo = (arr, f) => { const m = new Map(); arr.forEach((x) => { const k = f(x); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])); };

async function abrirPromo(id) {
    if (!CATEGORIAS.length) CATEGORIAS = await api('/categorias');
    if (!PRODUCTOS.length) PRODUCTOS = (await api('/admin/productos').catch(() => api('/productos'))).filter((p) => p.activo !== false);
    const p = id ? PROMOS.find((x) => x.id === id) : { tipo_descuento: 'porcentaje', alcance: 'todos', estado: 'activa', mostrar_banner: true,
        fecha_inicio: new Date(), fecha_fin: new Date(Date.now() + 14 * 86400000) };
    const yaEmpezo = !!id && new Date(p.fecha_inicio) <= new Date();
    // Las de antes (una categoría / un producto) se abren con el formato nuevo.
    AL = { modo: 'todos', cat: '', marca: '', texto: '', sel: new Set(), q: '', fcat: '', fmarca: '', soloSel: false };
    if (p.alcance === 'categoria' || p.alcance === 'filtro') Object.assign(AL, { modo: 'filtro', cat: p.categoria_id ? String(p.categoria_id) : '', marca: p.marca || '', texto: p.texto || '' });
    if (p.alcance === 'producto' || p.alcance === 'seleccion') Object.assign(AL, { modo: 'seleccion', sel: new Set((p.productos_ids || [p.producto_id]).filter(Boolean).map(Number)), soloSel: true });
    const v = (t) => escHTML(t || '');
    document.getElementById('modal-promo-body').innerHTML = `
        <button class="modal-close" onclick="cerrarModal()">${icon('x', 18)}</button>
        <h3>${id ? 'Editar promoción' : 'Nueva promoción'}</h3>
        <div class="px-grid">
          <div class="px-datos">
            <div class="field"><label>Nombre</label><input id="pr-nombre" value="${v(p.nombre)}" placeholder="Ej. Semana del mouse" /></div>
            <div class="field"><label>Descripción (se ve en el banner)</label><input id="pr-desc" value="${v(p.descripcion)}" placeholder="Ej. 15% en mouse Logitech" /></div>
            <div class="field-row">
                <div class="field"><label>Tipo de descuento</label>
                    <select id="pr-tipo" onchange="vistaPrevia()">
                        <option value="porcentaje" ${p.tipo_descuento === 'porcentaje' ? 'selected' : ''}>Porcentaje (%)</option>
                        <option value="monto" ${p.tipo_descuento === 'monto' ? 'selected' : ''}>Monto fijo por pieza ($)</option>
                    </select></div>
                <div class="field"><label>Valor</label><input id="pr-valor" type="number" min="1" step="1" value="${p.valor ?? ''}" oninput="vistaPrevia()" /></div>
            </div>
            <div class="field-row">
                <div class="field"><label>Inicia</label><input id="pr-ini" type="date" value="${fechaInput(p.fecha_inicio)}" min="${HOY}" ${yaEmpezo ? 'disabled' : ''} onchange="ajustarFin()" /></div>
                <div class="field"><label>Termina (incluido)</label><input id="pr-fin" type="date" value="${fechaInput(p.fecha_fin)}" min="${fechaInput(p.fecha_inicio) > HOY ? fechaInput(p.fecha_inicio) : HOY}" /></div>
            </div>
            ${yaEmpezo ? `<p style="margin:-6px 0 12px;font-size:.78rem;color:var(--text-muted)">${icon('lock', 12)} Ya empezó el ${formatoFecha(p.fecha_inicio)}: su inicio no se cambia. Puedes ajustar la fecha de término.</p>` : ''}
            <div class="field-row">
                <div class="field"><label><input type="checkbox" id="pr-activa" style="width:auto;display:inline-block" ${p.estado !== 'inactiva' ? 'checked' : ''}/> Activa</label></div>
                <div class="field"><label><input type="checkbox" id="pr-banner" style="width:auto;display:inline-block" ${p.mostrar_banner ? 'checked' : ''}/> Mostrar en el banner</label></div>
            </div>
            <div class="pago-box" id="pr-preview" style="font-size:.85rem"></div>
            <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="guardar(${id || ''})">${id ? 'Guardar cambios' : 'Crear promoción'}</button>
          </div>
          <div class="px-alcance">
            <label class="px-tit">¿A qué productos aplica?</label>
            <div class="seg px-seg" role="radiogroup">
                <label class="seg-op"><input type="radio" name="px-modo" value="todos" ${AL.modo === 'todos' ? 'checked' : ''} />Todo el catálogo</label>
                <label class="seg-op"><input type="radio" name="px-modo" value="filtro" ${AL.modo === 'filtro' ? 'checked' : ''} />Categoría, marca o tipo</label>
                <label class="seg-op"><input type="radio" name="px-modo" value="seleccion" ${AL.modo === 'seleccion' ? 'checked' : ''} />Elegir productos</label>
            </div>
            <div id="px-cuerpo"></div>
          </div>
        </div>`;
    document.querySelectorAll('[name="px-modo"]').forEach((r) => r.onchange = () => { AL.modo = r.value; pintarAlcance(); });
    document.getElementById('modal-promo').classList.add('open');
    pintarAlcance();
}
function cerrarModal() { document.getElementById('modal-promo').classList.remove('open'); }
const HOY = fechaInput(new Date());
// El término no puede quedar antes del inicio (ni de hoy).
function ajustarFin() {
    const ini = document.getElementById('pr-ini').value, fin = document.getElementById('pr-fin');
    if (ini && ini < HOY) document.getElementById('pr-ini').value = HOY;
    const minimo = (document.getElementById('pr-ini').value || HOY) > HOY ? document.getElementById('pr-ini').value : HOY;
    fin.min = minimo;
    if (fin.value && fin.value < minimo) fin.value = minimo;
}

const catNombre = (id) => (CATEGORIAS.find((c) => c.id === Number(id)) || {}).nombre || '';
function precioCon(x) {
    const tipo = document.getElementById('pr-tipo').value, valor = Number(document.getElementById('pr-valor').value) || 0;
    const d = Math.min(Number(x.precio), tipo === 'porcentaje' ? Number(x.precio) * valor / 100 : valor);
    return valor ? Number(x.precio) - d : null;
}
function filaProd(x, check) {
    const nuevo = coincide(x) ? precioCon(x) : null;
    return `<label class="px-prod ${check && AL.sel.has(x.id) ? 'on' : ''}">
        ${check ? `<input type="checkbox" ${AL.sel.has(x.id) ? 'checked' : ''} onchange="alternarSel(${x.id}, this.checked)" />` : ''}
        <span class="px-pn"><strong>${escHTML(x.nombre)}</strong><em>${escHTML(x.marca || '—')} · ${escHTML(catNombre(x.categoria_id))}</em></span>
        <span class="px-pp">${nuevo !== null ? `<s>${formatoMoneda(x.precio)}</s><b>${formatoMoneda(nuevo)}</b>` : formatoMoneda(x.precio)}</span>
    </label>`;
}

// Panel derecho según el modo
function pintarAlcance() {
    const el = document.getElementById('px-cuerpo');
    if (AL.modo === 'todos') {
        el.innerHTML = `<p class="px-ayuda">Todos los productos activos de la tienda (${PRODUCTOS.length}).</p><div class="px-lista" id="px-lista"></div>`;
    } else if (AL.modo === 'filtro') {
        const base = PRODUCTOS.filter((x) => !AL.cat || x.categoria_id === Number(AL.cat));
        const marcas = conteo(base, (x) => x.marca);
        const tipos = conteo(base.filter((x) => !AL.marca || sinAcentos(x.marca) === sinAcentos(AL.marca)), tipoDe).filter(([, n]) => n > 1 || base.length < 15).slice(0, 10);
        const pal = palabras(AL.texto);
        el.innerHTML = `<p class="px-ayuda">Combina lo que quieras; vacío = cualquiera. Ej.: Periféricos + Logitech + "mouse".</p>
            <div class="field-row">
                <div class="field"><label>Categoría</label><select id="px-cat"><option value="">Cualquiera</option>${CATEGORIAS.map((c) => `<option value="${c.id}" ${String(c.id) === AL.cat ? 'selected' : ''}>${escHTML(c.nombre)}</option>`).join('')}</select></div>
                <div class="field"><label>Marca</label><select id="px-marca"><option value="">Cualquiera</option>${marcas.map(([m, n]) => `<option value="${escHTML(m)}" ${sinAcentos(m) === sinAcentos(AL.marca) ? 'selected' : ''}>${escHTML(m)} (${n})</option>`).join('')}
                    ${AL.marca && !marcas.some(([m]) => sinAcentos(m) === sinAcentos(AL.marca)) ? `<option selected value="${escHTML(AL.marca)}">${escHTML(AL.marca)} (0)</option>` : ''}</select></div>
            </div>
            <div class="field"><label>Palabras en el nombre <span style="font-weight:400;color:var(--text-muted)">(separa con coma: mouse, teclado)</span></label>
                <input id="px-texto" value="${escHTML(AL.texto)}" placeholder="Ej. mouse" /></div>
            ${tipos.length ? `<div class="px-chips">${tipos.map(([t, n]) => `<button type="button" class="px-tipo ${pal.includes(sinAcentos(t)) ? 'on' : ''}" onclick="alternarTipo('${escHTML(t).replace(/'/g, '')}')">${escHTML(t)} <small>${n}</small></button>`).join('')}</div>` : ''}
            <div class="px-lista" id="px-lista"></div>`;
        document.getElementById('px-cat').onchange = (e) => { AL.cat = e.target.value; pintarAlcance(); };
        document.getElementById('px-marca').onchange = (e) => { AL.marca = e.target.value; pintarAlcance(); };
        const t = document.getElementById('px-texto');
        t.oninput = () => { AL.texto = t.value; pintarLista(); };
        t.onchange = () => pintarAlcance();
    } else {
        const marcas = conteo(PRODUCTOS.filter((x) => !AL.fcat || x.categoria_id === Number(AL.fcat)), (x) => x.marca);
        el.innerHTML = `<p class="px-ayuda">Marca uno por uno los artículos que entran, de cualquier categoría o marca.</p>
            <div class="px-busca">
                <input type="search" id="px-q" placeholder="Buscar producto…" value="${escHTML(AL.q)}" />
                <select id="px-fcat"><option value="">Categoría: todas</option>${CATEGORIAS.map((c) => `<option value="${c.id}" ${String(c.id) === AL.fcat ? 'selected' : ''}>${escHTML(c.nombre)}</option>`).join('')}</select>
                <select id="px-fmarca"><option value="">Marca: todas</option>${marcas.map(([m]) => `<option ${m === AL.fmarca ? 'selected' : ''}>${escHTML(m)}</option>`).join('')}</select>
            </div>
            <div class="px-barra">
                <span id="px-nsel"></span>
                <span style="display:flex;gap:6px">
                    <button type="button" class="btn btn-ghost btn-sm" onclick="selVisibles(true)">Marcar visibles</button>
                    <button type="button" class="btn btn-ghost btn-sm" onclick="selVisibles(false)">Quitar visibles</button>
                    <label class="px-solo"><input type="checkbox" id="px-solo" ${AL.soloSel ? 'checked' : ''} /> Solo elegidos</label>
                </span>
            </div>
            <div class="px-lista" id="px-lista"></div>`;
        const q = document.getElementById('px-q'); q.oninput = () => { AL.q = q.value; pintarLista(); };
        document.getElementById('px-fcat').onchange = (e) => { AL.fcat = e.target.value; AL.fmarca = ''; pintarAlcance(); };
        document.getElementById('px-fmarca').onchange = (e) => { AL.fmarca = e.target.value; pintarLista(); };
        document.getElementById('px-solo').onchange = (e) => { AL.soloSel = e.target.checked; pintarLista(); };
    }
    pintarLista();
}
function visiblesSel() {
    const q = sinAcentos(AL.q);
    return PRODUCTOS.filter((x) => (!AL.fcat || x.categoria_id === Number(AL.fcat)) && (!AL.fmarca || x.marca === AL.fmarca)
        && (!q || sinAcentos(`${x.nombre} ${x.marca}`).includes(q)) && (!AL.soloSel || AL.sel.has(x.id)));
}
function pintarLista() {
    const box = document.getElementById('px-lista'); if (!box) return;
    if (AL.modo === 'seleccion') {
        const vis = visiblesSel();
        box.innerHTML = vis.map((x) => filaProd(x, true)).join('') || `<p class="px-vacio">${AL.soloSel ? 'Aún no eliges productos: quita "Solo elegidos" para ver el catálogo.' : 'Ningún producto con esa búsqueda.'}</p>`;
        document.getElementById('px-nsel').innerHTML = `<strong>${AL.sel.size}</strong> elegido${AL.sel.size === 1 ? '' : 's'}`;
    } else {
        const ap = PRODUCTOS.filter(coincide);
        box.innerHTML = `<div class="px-cuenta">${ap.length ? `Entran <strong>${ap.length}</strong> producto${ap.length === 1 ? '' : 's'}` : 'Ningún producto coincide: ajusta el filtro'}</div>`
            + ap.slice(0, 60).map((x) => filaProd(x, false)).join('') + (ap.length > 60 ? `<p class="px-vacio">… y ${ap.length - 60} más.</p>` : '');
    }
    vistaPrevia();
}
function alternarSel(id, on) { on ? AL.sel.add(id) : AL.sel.delete(id); pintarLista(); }
function selVisibles(on) { visiblesSel().forEach((x) => on ? AL.sel.add(x.id) : AL.sel.delete(x.id)); pintarLista(); }
function alternarTipo(t) {
    const pal = palabras(AL.texto), k = sinAcentos(t);
    const nuevas = pal.includes(k) ? pal.filter((w) => w !== k) : [...pal, k];
    AL.texto = nuevas.join(', ');
    pintarAlcance();
}

// Resumen: cuántos productos toca y cómo queda un precio de ejemplo
function vistaPrevia() {
    const box = document.getElementById('pr-preview'); if (!box) return;
    const aplica = PRODUCTOS.filter(coincide);
    const ej = aplica[0];
    const n = `Aplica a <strong>${aplica.length}</strong> producto${aplica.length === 1 ? '' : 's'}`;
    const nuevo = ej ? precioCon(ej) : null;
    box.innerHTML = nuevo === null ? `${icon('info', 14)} ${n}.`
        : `${icon('info', 14)} ${n}. Ejemplo: ${escHTML(ej.nombre)} pasa de ${formatoMoneda(ej.precio)} a <strong style="color:var(--success)">${formatoMoneda(nuevo)}</strong>.`;
}

async function guardar(id) {
    const iniEl = document.getElementById('pr-ini');
    const ini = iniEl.value, fin = document.getElementById('pr-fin').value;
    if (!iniEl.disabled && ini && ini < HOY) { toast('La fecha de inicio no puede ser anterior a hoy', 'warn'); return; }
    if (fin && fin < HOY) { toast('La fecha de término no puede ser anterior a hoy', 'warn'); return; }
    if (AL.modo === 'seleccion' && !AL.sel.size) { toast('Elige al menos un producto', 'warn'); return; }
    if (AL.modo === 'filtro' && !PRODUCTOS.some(coincide)) { toast('Ningún producto coincide con el filtro', 'warn'); return; }
    const body = {
        nombre: document.getElementById('pr-nombre').value.trim(),
        descripcion: document.getElementById('pr-desc').value.trim(),
        tipo_descuento: document.getElementById('pr-tipo').value,
        valor: Number(document.getElementById('pr-valor').value),
        alcance: AL.modo,
        ...(AL.modo === 'filtro' ? { categoria_id: AL.cat ? Number(AL.cat) : null, marca: AL.marca || null, texto: AL.texto || null } : {}),
        ...(AL.modo === 'seleccion' ? { productos_ids: [...AL.sel] } : {}),
        ...(iniEl.disabled ? {} : { fecha_inicio: ini ? ini + 'T00:00:00' : '' }),
        fecha_fin: fin ? fin + 'T23:59:59' : '',
        estado: document.getElementById('pr-activa').checked ? 'activa' : 'inactiva',
        mostrar_banner: document.getElementById('pr-banner').checked,
    };
    try {
        const r = id ? await api(`/admin/promociones/${id}`, { method: 'PUT', body }) : await api('/admin/promociones', { method: 'POST', body });
        toast(r.message, 'ok');
        cerrarModal();
        cargar();
    } catch (e) { toast(e.message, 'error'); }
}

async function alternar(id) {
    const p = PROMOS.find((x) => x.id === id);
    try {
        await api(`/admin/promociones/${id}`, { method: 'PUT', body: { estado: p.estado === 'activa' ? 'inactiva' : 'activa' } });
        toast(p.estado === 'activa' ? 'Promoción desactivada' : 'Promoción activada', 'ok');
        cargar();
    } catch (e) { toast(e.message, 'error'); }
}

async function eliminar(id) {
    if (!(await confirmar('¿Eliminar esta promoción? Si ya se usó en pedidos solo se desactiva.', { okText: 'Eliminar', peligro: true }))) return;
    try { const r = await api(`/admin/promociones/${id}`, { method: 'DELETE' }); toast(r.message, 'ok'); cargar(); }
    catch (e) { toast(e.message, 'error'); }
}

document.getElementById('f-buscar').addEventListener('input', pintar);
document.getElementById('f-situacion').addEventListener('change', pintar);
document.getElementById('modal-promo').addEventListener('click', (e) => { if (e.target.id === 'modal-promo') cerrarModal(); });
cargar();
</script>
</body>
</html>
