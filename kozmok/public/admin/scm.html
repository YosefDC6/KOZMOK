<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel SCM · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="modulo-tiles" id="modulo-tiles"></div>

        <div class="stat-grid" id="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">
                <h3 style="margin:0">Nivel de madurez SCM</h3>
                <span id="madurez-nivel"></span>
            </div>
            <p style="color:var(--text-muted);font-size:.85rem;margin:6px 0 0">
                Calculado a partir de datos reales del sistema, no de una lista marcada a mano: conforme se usa cada parte del módulo, el nivel avanza solo.
            </p>
            <div class="madurez-track"><div class="madurez-fill" id="madurez-fill"></div></div>

            <div id="madurez-descripcion" class="pago-box" style="margin:4px 0 16px"></div>

            <div id="madurez-checklist"></div>
        </div>
    </main>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('scm');
document.getElementById('topbar').innerHTML = adminHeader(
    'Panel SCM', 'Nivel de madurez de la cadena de suministro: proveedores, inventario y logística.'
);
renderModuloTiles('modulo-tiles', 'SCM', 'scm');

const NIVEL_LABEL = { inicial: 'Inicial', en_desarrollo: 'En desarrollo', optimizado: 'Optimizado' };

// Qué hacer para resolver cada punto pendiente del checklist: a dónde
// mandar al admin con un clic para avanzar de nivel.
const CHECKLIST_DESTINO = {
    proveedores: { href: '/admin/productos.html', texto: 'Asignar proveedores en Inventario' },
    movimientos: { href: '/admin/movimientos.html', texto: 'Ver Movimientos de inventario' },
    estrategia: { href: '/admin/logistica.html', texto: 'Definir estrategias en Logística' },
    ordenes: { href: '/admin/ordenes-compra.html', texto: 'Generar una orden de compra' },
    reportes: { href: '/admin/reportes-scm.html', texto: 'Ver Reportes de la cadena' },
};

const NIVEL_DESCRIPCION = {
    inicial: 'Tu cadena de suministro apenas se está armando. Asigna proveedores a tus productos, registra tu primer movimiento de inventario y define si cada producto es push o pull para empezar a avanzar de nivel.',
    en_desarrollo: 'Ya hay trazabilidad básica: proveedores y movimientos en uso. Para llegar a Optimizado, usa las dos estrategias de reabastecimiento según corresponda, genera órdenes de compra reales a tus proveedores, y asegúrate de tener ventas registradas para que los reportes reflejen datos reales.',
    optimizado: 'Tu módulo SCM está completo: hay trazabilidad de principio a fin, desde el proveedor hasta la venta, con las dos estrategias de reabastecimiento en uso y reportes basados en datos reales del negocio.',
};

async function cargar() {
    const r = await api('/admin/scm/resumen');

    document.getElementById('stat-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Productos activos</div><div class="stat-value">${r.stats.total_productos}</div></div>
        <div class="stat-card"><div class="stat-label">Proveedores</div><div class="stat-value">${r.stats.total_proveedores}</div></div>
        <div class="stat-card"><div class="stat-label">Órdenes de compra abiertas</div><div class="stat-value" style="color:var(--warning)">${r.stats.ordenes_pendientes}</div></div>
        <div class="stat-card"><div class="stat-label">Productos en stock bajo</div><div class="stat-value" style="color:var(--danger)">${r.stats.stock_bajo}</div></div>
        <div class="stat-card"><div class="stat-label">Rotación de inventario</div><div class="stat-value" style="color:var(--accent)">${r.rotacion_pct}%</div><div class="stat-sub">unidades vendidas vs. stock actual</div></div>
    `;

    document.getElementById('madurez-nivel').innerHTML = `<span class="madurez-nivel n-${r.madurez.nivel}">${NIVEL_LABEL[r.madurez.nivel]}</span>`;
    document.getElementById('madurez-fill').style.width = `${Math.round((r.madurez.cumplidos / r.madurez.total) * 100)}%`;

    document.getElementById('madurez-descripcion').innerHTML = `
        <h4>${icon('info', 16)} Qué significa este nivel</h4>
        <div class="pb-sub">${NIVEL_DESCRIPCION[r.madurez.nivel]}</div>
    `;

    // Cada punto es un enlace: si ya está cumplido lleva a revisarlo, si
    // está pendiente lleva directo a dónde resolverlo.
    document.getElementById('madurez-checklist').innerHTML = r.madurez.checklist.map((c) => {
        const destino = CHECKLIST_DESTINO[c.clave];
        return `
            <a class="madurez-check ${c.cumplido ? 'cumplido' : 'pendiente'}" href="${destino.href}" style="text-decoration:none;cursor:pointer">
                <span class="mc-ico">${icon(c.cumplido ? 'check' : 'clock', 15)}</span>
                <span style="flex:1">${c.etiqueta}</span>
                <span style="font-size:.76rem;color:var(--accent)">${c.cumplido ? 'Revisar' : destino.texto} ${icon('arrow', 13)}</span>
            </a>
        `;
    }).join('');
}

cargar();
</script>
</body>
</html>
