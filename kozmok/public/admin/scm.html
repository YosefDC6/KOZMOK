<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard SCM · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="modulo-tiles" id="modulo-tiles"></div>

        <div class="stat-grid" id="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"></div>

        <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div>
                <h3 style="margin:0 0 4px">Nivel de madurez SCM</h3>
                <div style="color:var(--text-muted);font-size:.85rem" id="madurez-resumen"></div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
                <span id="madurez-nivel"></span>
                <a class="btn btn-outline btn-sm" href="/admin/nivel-scm.html">Ver detalle</a>
            </div>
            <div class="madurez-track" style="flex-basis:100%;margin:4px 0 0"><div class="madurez-fill" id="madurez-fill"></div></div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
            <div class="card">
                <h3 style="margin-top:0">Productos más vendidos</h3>
                <div id="mas-vendidos"></div>
            </div>
            <div class="card">
                <h3 style="margin-top:0">Estrategia de reabastecimiento</h3>
                <div id="push-pull"></div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <h3 style="margin:0">Inventario crítico</h3>
                <a class="btn btn-ghost btn-sm" href="/admin/inventario.html">Ir a Inventario</a>
            </div>
            <div class="table-wrap" style="margin-top:10px">
                <table>
                    <thead><tr><th>Producto</th><th>Stock actual</th><th>Stock mínimo</th><th>Proveedor</th><th>Pedido en curso</th><th></th></tr></thead>
                    <tbody id="tabla-critico"><tr><td colspan="6">Cargando…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script src="/admin/js/erp.js"></script>
<script src="/admin/js/scm-acciones.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('scm');
const ROL = (Sesion.usuario() || {}).rol;
document.getElementById('topbar').innerHTML = adminHeader(
    'Dashboard SCM', 'Cadena de suministro: productos, inventario, proveedores y logística.',
    '<button class="btn btn-outline" onclick="ScmAcciones.nuevoMovimiento({ onListo: cargar })">Registrar movimiento</button>' +
    (puedeVer((Sesion.usuario() || {}).rol, 'ordenes-compra') ? ' <button class="btn btn-primary" onclick="ScmAcciones.pedidoReposicion({ onListo: cargar })">Generar pedido</button>' : '')
);
renderModuloTiles('modulo-tiles', 'SCM', 'scm');

const NIVEL_LABEL = { inicial: 'Inicial', en_desarrollo: 'En desarrollo', optimizado: 'Optimizado' };

async function cargar() {
    const [r, mp] = await Promise.all([api('/admin/scm/resumen'), api('/admin/metricas-productos')]);

    document.getElementById('stat-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Productos activos</div><div class="stat-value">${r.stats.total_productos}</div></div>
        <div class="stat-card"><div class="stat-label">Proveedores</div><div class="stat-value">${r.stats.total_proveedores}</div></div>
        <div class="stat-card"><div class="stat-label">Pedidos de reposición abiertos</div><div class="stat-value" style="color:var(--warning)">${r.stats.ordenes_pendientes}</div></div>
        <div class="stat-card"><div class="stat-label">Productos en stock bajo</div><div class="stat-value" style="color:var(--danger)">${r.stats.stock_bajo}</div></div>
        <div class="stat-card"><div class="stat-label">Rotación de inventario</div><div class="stat-value" style="color:var(--accent)">${r.rotacion_pct}%</div><div class="stat-sub">unidades vendidas vs. stock actual</div></div>
    `;

    const m = r.madurez;
    document.getElementById('madurez-nivel').innerHTML = `<span class="madurez-nivel n-${m.nivel}" style="font-size:1rem">${NIVEL_LABEL[m.nivel]}</span>`;
    document.getElementById('madurez-resumen').textContent = `${m.cumplidos} de ${m.total} puntos del checklist cumplidos.`;
    document.getElementById('madurez-fill').style.width = `${Math.round((m.cumplidos / m.total) * 100)}%`;

    renderBarrasH(document.getElementById('mas-vendidos'),
        r.mas_vendidos.filter((p) => Number(p.unidades_vendidas) > 0),
        { etiqueta: 'nombre', valor: 'unidades_vendidas' });

    const pp = r.push_pull;
    const tot = (pp.push + pp.pull) || 1;
    document.getElementById('push-pull').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            <div class="stat-card"><div class="stat-label" style="color:var(--info)">PUSH</div><div class="stat-value">${pp.push}</div><div class="stat-sub">${formatoMoneda(pp.valor_push)} en stock</div></div>
            <div class="stat-card"><div class="stat-label" style="color:var(--warning)">PULL</div><div class="stat-value">${pp.pull}</div><div class="stat-sub">${formatoMoneda(pp.valor_pull)} en stock</div></div>
        </div>
        <div style="display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)">
            <div style="width:${Math.round(pp.push / tot * 100)}%;background:var(--info)"></div>
            <div style="width:${Math.round(pp.pull / tot * 100)}%;background:var(--warning)"></div>
        </div>
        <p style="font-size:.8rem;color:var(--text-muted);margin:8px 0 0">Push: se pide en cuanto el stock toca el mínimo. Pull: solo cuando una venta o salida lo deja en el mínimo.</p>`;

    document.getElementById('tabla-critico').innerHTML = mp.inventario_critico.length ? mp.inventario_critico.map((p) => `
        <tr>
            <td>${p.nombre}</td>
            <td class="mono ${p.stock === 0 ? 'stock-out' : 'stock-low'}">${p.stock}</td>
            <td class="mono">${p.stock_minimo}</td>
            <td>${p.proveedor_nombre || '<span style="color:var(--text-muted)">sin asignar</span>'}</td>
            <td>${p.orden_abierta_folio ? `<span class="tag" style="color:var(--info);border-color:var(--info)">${p.orden_abierta_folio}</span>` : '—'}</td>
            <td style="white-space:nowrap;text-align:right">
                ${!p.orden_abierta_folio && puedeVer(ROL, 'ordenes-compra') ? `<button class="btn btn-outline btn-sm" onclick="ScmAcciones.pedidoReposicion({ productoId: ${p.id}, onListo: cargar })">Generar pedido</button>` : ''}
                <button class="btn btn-ghost btn-sm" onclick="ScmAcciones.nuevoMovimiento({ productoId: ${p.id}, onListo: cargar })">Movimiento</button>
            </td>
        </tr>`).join('') : `<tr><td colspan="6" style="color:var(--text-muted)">Ningún producto está en su stock mínimo.</td></tr>`;
}

cargar().catch((e) => toast(e.message, 'error'));
</script>
</body>
</html>
