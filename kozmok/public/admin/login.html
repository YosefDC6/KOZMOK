<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso interno · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="container" style="max-width:400px">
    <div style="text-align:center;margin-bottom:20px">
        <span class="brand-mark" style="display:inline-flex" data-logo="44"></span>
        <h2 style="margin-top:12px">Acceso equipo interno</h2>
        <p>Panel de administración y ventas de Kozmok.</p>
    </div>
    <div class="card">
        <form id="form-login-admin">
            <div class="field"><label for="email">Correo</label><input type="email" id="email" required autocomplete="username" /></div>
            <div class="field"><label for="password">Contraseña</label><input type="password" id="password" required autocomplete="current-password" /></div>
            <div id="login-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-entrar">Entrar</button>
        </form>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/index.html">Volver a la tienda</a></p>
</div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/admin/js/permisos.js"></script>
<script>
// Si la sesión del panel sigue abierta (p. ej. con "Mantener sesión
// iniciada"), se entra directo sin volver a escribir la contraseña.
(async () => {
    try {
        const u = await api('/admin/whoami');
        if (u && u.rol) { Sesion.guardarUsuario(u); location.replace(homeDe(u.rol)); }
    } catch { /* sin sesión: se muestra el formulario */ }
})();

// El panel no recuerda cuentas: se borra lo que haya quedado de antes.
try { localStorage.removeItem('kz_cuentas_equipo'); } catch { /* sin almacenamiento */ }
const inEmail = document.getElementById('email');

document.getElementById('form-login-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = inEmail.value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-entrar');
    errorBox.hidden = true;
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
        const data = await api('/auth/login-usuario', { method: 'POST', body: { email, password } });
        Sesion.guardarUsuario(data.usuario);
        window.location.href = homeDe(data.usuario.rol);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        document.getElementById('password').value = '';
        btn.disabled = false; btn.textContent = 'Entrar';
    }
});
</script>
</body>
</html>
