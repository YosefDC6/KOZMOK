<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso interno · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="container" style="max-width:400px">
    <div style="text-align:center;margin-bottom:20px">
        <span class="brand-mark" style="display:inline-flex;width:44px;height:44px" data-ic="ghost" data-ic-size="20"></span>
        <h2 style="margin-top:12px">Acceso equipo interno</h2>
        <p>Panel de administración y ventas de Kozmok.</p>
    </div>
    <div class="card">
        <form id="form-login-admin">
            <div class="field"><label for="email">Correo</label><input type="email" id="email" required autocomplete="username" /></div>
            <div class="field"><label for="password">Contraseña</label><input type="password" id="password" required autocomplete="current-password" /></div>
            <div id="login-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-entrar">Entrar</button>
        </form>
        <p class="auth-nota">Acceso solo para el equipo. Los intentos quedan registrados; tras 5 contraseñas equivocadas la cuenta se bloquea 15 minutos.</p>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/index.html">Volver a la tienda</a></p>
</div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/admin/js/permisos.js"></script>
<script>
if (new URLSearchParams(location.search).get('vencida')) {
    const b = document.getElementById('login-error');
    b.textContent = 'Tu sesión terminó (por inactividad o porque se cerró). Inicia sesión de nuevo.';
    b.classList.add('bloqueado'); b.hidden = false;
}
document.getElementById('form-login-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-entrar');
    errorBox.hidden = true; errorBox.classList.remove('bloqueado');
    btn.disabled = true;
    try {
        const data = await api('/auth/login', { method: 'POST', body: { tipo: 'usuario', email, password } });
        Sesion.guardarUsuario(data.usuario);
        window.location.href = homeDe(data.usuario.rol);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.toggle('bloqueado', err.status === 429);
        errorBox.hidden = false;
        document.getElementById('password').value = '';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
