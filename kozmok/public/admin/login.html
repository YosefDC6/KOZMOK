<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso interno · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="container" style="max-width:400px">
    <div style="text-align:center;margin-bottom:20px">
        <span class="auth-marca"><span class="brand-mark" style="display:inline-flex" data-logo="44"></span><span class="auth-mascota" data-mascota="52"></span></span>
        <h2 style="margin-top:12px">Acceso equipo interno</h2>
        <p>Panel de administración y ventas de Kozmok.</p>
    </div>
    <div class="card">
        <div class="cuentas-recordadas" id="cuentas" hidden></div>
        <form id="form-login-admin">
            <div class="field" id="campo-correo"><label for="email">Correo</label><input type="email" id="email" required autocomplete="username" /></div>
            <div class="field"><label for="password">Contraseña</label><input type="password" id="password" required autocomplete="off" /></div>
            <div id="captcha" hidden></div>
            <div id="login-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-entrar">Entrar</button>
            <p style="text-align:center;margin:12px 0 0;font-size:.88rem"><a href="/admin/recuperar.html">¿Olvidaste tu contraseña?</a></p>
        </form>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/index.html">Volver a la tienda</a></p>
</div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dos-pasos.js"></script>
<script>
const CAPTCHA = Captcha.montar(document.getElementById('captcha'));
// Enlace directo a una pantalla del panel (p. ej. el de un correo): el
// servidor manda aquí con ?next=<pantalla> si no había sesión, y al entrar
// se abre esa pantalla. Solo pantallas de este panel, nunca otro sitio; si
// el rol no la puede ver, el servidor lo manda a su inicio.
const NEXT = (() => {
    const n = new URLSearchParams(location.search).get('next') || '';
    return RUTA_PANEL && n.startsWith(RUTA_PANEL) && /^[a-z0-9-]+\.html(\?[^#\s]*)?$/i.test(n.slice(RUTA_PANEL.length)) ? n : null;
})();
const destinoDe = (rol) => NEXT || homeDe(rol);
// Si la sesión del panel sigue abierta (p. ej. con "Mantener sesión
// iniciada"), se entra directo sin volver a escribir la contraseña.
// Solo si hay otra pestaña del panel abierta; si no, la sesión anterior
// (de una pestaña que se cerró) se termina.
(async () => {
    try {
        const u = await api('/admin/whoami');
        if (!(u && u.rol)) return;
        if (await PestanaPanel.verificar()) { Sesion.guardarUsuario(u); location.replace(destinoDe(u.rol)); }
        else await Sesion.cerrarSesionUsuario();
    } catch { /* sin sesión: se muestra el formulario */ }
})();

// El panel recuerda la cuenta (correo y nombre), nunca la contraseña.
const inEmail = document.getElementById('email');
const campoCorreo = document.getElementById('campo-correo');
const contCuentas = document.getElementById('cuentas');
function elegirCuenta(c) {
    inEmail.value = c ? c.correo : '';
    campoCorreo.classList.toggle('campo-oculto', !!c);
    contCuentas.querySelectorAll('.cr-elegir').forEach((b, i) => b.classList.toggle('activa', !!c && CuentasRecordadas.lista('usuario')[i]?.correo === c.correo));
    document.getElementById(c ? 'password' : 'email').focus();
}
function pintarCuentas() {
    CuentasRecordadas.pintar(contCuentas, 'usuario', elegirCuenta);
    const l = CuentasRecordadas.lista('usuario');
    if (!l.length) { campoCorreo.classList.remove('campo-oculto'); return; }
    const otra = document.createElement('a');
    otra.href = '#'; otra.className = 'cr-otra'; otra.textContent = 'Usar otra cuenta';
    otra.addEventListener('click', (ev) => { ev.preventDefault(); elegirCuenta(null); });
    contCuentas.appendChild(otra);
    contCuentas.querySelectorAll('.cr-quitar').forEach((b) => b.addEventListener('click', () => setTimeout(pintarCuentas)));
    elegirCuenta(l[0]);
}
pintarCuentas();

document.getElementById('form-login-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = inEmail.value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-entrar');
    errorBox.hidden = true;
    const cap = await CAPTCHA;
    const captcha = cap.token();
    if (cap.activo && !captcha) { errorBox.textContent = 'Marca la casilla "No soy un robot".'; errorBox.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
        let data = await api('/auth/login-usuario', { method: 'POST', body: { email, password, captcha } });
        // En el panel la verificación en dos pasos es obligatoria.
        if (data.requiere_2fa) {
            btn.textContent = 'Esperando el código…';
            data = await DosPasos.pedir(data);
            if (!data) { cap.reiniciar(); document.getElementById('password').value = ''; btn.disabled = false; btn.textContent = 'Entrar'; return; }
        }
        Sesion.guardarUsuario(data.usuario);
        PestanaPanel.marcar();
        CuentasRecordadas.guardar('usuario', { correo: data.usuario.email, nombre: data.usuario.nombre });
        window.location.href = destinoDe(data.usuario.rol);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        document.getElementById('password').value = '';
        cap.reiniciar();
        btn.disabled = false; btn.textContent = 'Entrar';
    }
});
</script>
</body>
</html>
