<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soporte · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main" id="main"><p>Cargando…</p></main>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script src="/admin/js/gestion-pedido.js"></script>
<script src="/js/fotos.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('soporte');
const EST = { abierto: 'Abierto', en_proceso: 'En proceso', resuelto: 'Resuelto', cerrado: 'Cerrado' };
const PRIO = { baja: 'Baja', media: 'Media', alta: 'Alta' };
const ID = new URLSearchParams(location.search).get('ticket');

if (ID) vistaHilo(ID); else vistaLista();

async function vistaLista() {
    const f = new URLSearchParams(location.search);
    const estado = f.get('estado') || 'Todos';
    const prioridad = f.get('prioridad') || 'Todas';
    const d = await api(`/admin/tickets?estado=${estado}&prioridad=${prioridad}`);
    const main = document.getElementById('main');
    main.innerHTML = `
        ${adminHeader('Soporte', 'Cola de tickets de los clientes.')}
        <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
            <div class="stat-card"><div class="stat-label">Abiertos</div><div class="stat-value" style="color:var(--info)">${d.conteos.abiertos}</div></div>
            <div class="stat-card"><div class="stat-label">En proceso</div><div class="stat-value" style="color:var(--warning)">${d.conteos.en_proceso}</div></div>
            <div class="stat-card"><div class="stat-label">Resueltos</div><div class="stat-value" style="color:var(--success)">${d.conteos.resueltos}</div></div>
            <div class="stat-card"><div class="stat-label">Cerrados</div><div class="stat-value">${d.conteos.cerrados}</div></div>
        </div>
        <div class="filters-bar">
            <select id="f-estado">
                ${['Todos', 'abierto', 'en_proceso', 'resuelto', 'cerrado'].map((e) => `<option value="${e}" ${e === estado ? 'selected' : ''}>${EST[e] || e}</option>`).join('')}
            </select>
            <select id="f-prio">
                ${['Todas', 'alta', 'media', 'baja'].map((p) => `<option value="${p}" ${p === prioridad ? 'selected' : ''}>${PRIO[p] || p}</option>`).join('')}
            </select>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Folio</th><th>Cliente</th><th>Asunto</th><th>Prioridad</th><th>Estado</th><th>Actualizado</th></tr></thead>
                <tbody>
                    ${d.tickets.length === 0 ? '<tr><td colspan="6">Sin tickets.</td></tr>' : d.tickets.map((t) => `
                        <tr onclick="location.href='/admin/soporte.html?ticket=${t.id}'" style="cursor:pointer">
                            <td class="mono">${t.folio}</td>
                            <td>${t.cliente_nombre}<div style="font-size:.76rem;color:var(--text-muted)">${t.cliente_correo}</div></td>
                            <td>${t.asunto}<div style="font-size:.76rem;color:var(--text-muted)">${t.mensajes} mensaje(s) · ${t.categoria}${t.numero_orden ? ` · <span class="mono">${t.numero_orden}</span>` : ''}</div></td>
                            <td><span class="tag prio-${t.prioridad}">${PRIO[t.prioridad]}</span></td>
                            <td><span class="tag estado-${t.estado}">${EST[t.estado]}</span></td>
                            <td>${formatoFecha(t.fecha_actualizacion)}</td>
                        </tr>`).join('')}
                </tbody>
            </table>
        </div>
    `;
    document.getElementById('f-estado').addEventListener('change', (e) => filtrar('estado', e.target.value));
    document.getElementById('f-prio').addEventListener('change', (e) => filtrar('prioridad', e.target.value));
}
function filtrar(k, v) {
    const q = new URLSearchParams(location.search);
    q.set(k, v);
    location.search = q.toString();
}

async function vistaHilo(id) {
    let t;
    try { t = await api(`/admin/tickets/${id}`); }
    catch (e) { document.getElementById('main').innerHTML = `<p>${escHTML(e.message)}</p><a href="/admin/soporte.html">Volver</a>`; return; }
    TICKET = t;
    const borrador = (document.getElementById('resp') || {}).value || '';
    document.getElementById('main').innerHTML = `
        <a href="/admin/soporte.html" style="font-size:.85rem">← Cola de tickets</a>
        ${adminHeader(escHTML(t.asunto), `<span class="mono">${t.folio}</span> · <a href="/admin/cliente.html?id=${t.cliente_id}">${escHTML(t.cliente_nombre)}</a> · ${escHTML(t.cliente_correo)}`)}
        <div class="tk-layout">
            <section class="tk-hilo">
                <div class="hilo">
                    ${t.mensajes.map((m) => `
                        <div class="hilo-msg ${m.autor === 'equipo' ? 'mio' : 'equipo'}">
                            <div class="hm-meta">${m.autor === 'equipo' ? escHTML(m.usuario_nombre || 'Equipo') : escHTML(t.cliente_nombre)} · ${formatoFechaHora(m.fecha)}</div>
                            ${m.mensaje ? `<div class="hm-txt">${escHTML(m.mensaje)}</div>` : ''}
                            ${(m.fotos || []).length ? `<div class="foto-lista">${m.fotos.map((f) => `<a href="/api/admin/tickets/${t.id}/fotos/${f.id}" target="_blank" rel="noopener" class="foto-prev" title="Abrir foto"><img src="/api/admin/tickets/${t.id}/fotos/${f.id}" alt="${escHTML(f.nombre || 'foto')}" loading="lazy" /></a>`).join('')}</div>` : ''}
                        </div>`).join('')}
                </div>
                <div class="field" style="margin-top:16px"><textarea id="resp" rows="3" placeholder="Responder al cliente…">${escHTML(borrador)}</textarea></div>
                <div class="foto-sel"><label class="btn btn-ghost btn-sm foto-btn">${icon('image', 14)} Adjuntar fotos<input type="file" id="resp-fotos" accept="image/*" multiple hidden /></label>
                    <small>Hasta 3, por ejemplo para mostrarle al cliente cómo hacer algo.</small></div>
                <div class="foto-lista" id="resp-prev"></div>
                <button class="btn btn-primary" onclick="responder(${t.id})">Enviar respuesta</button>
            </section>
            <aside class="tk-lado">
                <div class="card">
                    <h3 style="margin:0 0 10px;font-size:1rem">Caso</h3>
                    <div class="field"><label>Estado</label>
                        <select id="t-estado">${['abierto', 'en_proceso', 'resuelto', 'cerrado'].map((e) => `<option value="${e}" ${e === t.estado ? 'selected' : ''}>${EST[e]}</option>`).join('')}</select>
                    </div>
                    <div class="field"><label>Prioridad</label>
                        <select id="t-prio">${['baja', 'media', 'alta'].map((p) => `<option value="${p}" ${p === t.prioridad ? 'selected' : ''}>${PRIO[p]}</option>`).join('')}</select>
                    </div>
                    <button class="btn btn-outline btn-sm" style="width:100%" onclick="guardarEstado(${t.id})">Actualizar ticket</button>
                    <p style="margin:10px 0 0;font-size:.78rem;color:var(--text-muted)">Categoría: ${escHTML(t.categoria)} · abierto el ${formatoFecha(t.fecha_creacion)}</p>
                </div>
                <div class="card" id="tk-pedido"><p style="margin:0;color:var(--text-muted)">Cargando pedido…</p></div>
                ${puedeVer((Sesion.usuario() || {}).rol, 'cupones') ? '<div class="card" id="tk-cupones"><p style="margin:0;color:var(--text-muted)">Cargando cupones…</p></div>' : ''}
            </aside>
        </div>
    `;
    SEL_RESP = FotosReclamo.selector(document.getElementById('resp-fotos'), document.getElementById('resp-prev'), { alError: (m) => toast(m, 'warn') });
    pintarPedido();
    pintarCupones();
}
let SEL_RESP = null;

// ---- Cupones del cliente: revisar el problema y resolverlo sin salir del caso ----
const EST_CUP = { disponible: 'Disponible', usado: 'Usado', vencido: 'Vencido', cancelado: 'Cancelado' };
const COLOR_CUP = { disponible: 'var(--success)', usado: 'var(--text-muted)', vencido: 'var(--warning)', cancelado: 'var(--danger)' };
async function pintarCupones() {
    const caja = document.getElementById('tk-cupones');
    if (!caja) return;
    let lista = [];
    try { lista = await api(`/admin/clientes/${TICKET.cliente_id}/cupones`); } catch (e) { caja.innerHTML = `<p style="margin:0">${escHTML(e.message)}</p>`; return; }
    // El cupón del caso va primero.
    lista.sort((a, b) => (b.id === TICKET.cupon_id) - (a.id === TICKET.cupon_id));
    caja.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <h3 style="margin:0;font-size:1rem">Cupones del cliente</h3>
            <button class="btn btn-outline btn-sm" onclick="darCupon()">${icon('plus', 14)} Dar cupón</button>
        </div>
        ${!lista.length ? '<p style="margin:8px 0 0;font-size:.84rem;color:var(--text-muted)">No tiene cupones.</p>' : lista.map((c) => `
            <div class="tk-cupon ${c.id === TICKET.cupon_id ? 'del-caso' : ''}">
                <div class="tk-kv"><span class="mono">${escHTML(c.codigo)}</span><span style="color:${COLOR_CUP[c.estado]}">${EST_CUP[c.estado] || c.estado}</span></div>
                <div style="font-size:.8rem">${escHTML(c.beneficio)}${c.minimo > 0 ? ` · desde ${formatoMoneda(c.minimo)}` : ''}</div>
                <div style="font-size:.74rem;color:var(--text-muted)">${c.id === TICKET.cupon_id ? '<strong>Cupón de este caso</strong> · ' : ''}${c.vence ? `vence ${formatoFecha(c.vence)}` : 'sin vencimiento'}${c.numero_orden ? ` · usado en ${escHTML(c.numero_orden)}` : ''}</div>
                ${c.motivo ? `<div style="font-size:.72rem;color:var(--text-muted);margin-top:2px">${escHTML(c.motivo)}</div>` : ''}
                <div class="tk-cupon-acc">
                    ${c.estado !== 'usado' && c.estado !== 'cancelado' ? `<button class="btn btn-ghost btn-sm" onclick="accionCupon(${c.id}, 'extender')">Extender</button>` : ''}
                    ${c.estado === 'usado' || c.estado === 'vencido' || c.estado === 'cancelado' ? `<button class="btn btn-ghost btn-sm" onclick="accionCupon(${c.id}, 'reactivar')">Reactivar</button>` : ''}
                    ${c.estado === 'disponible' ? `<button class="btn btn-ghost btn-sm" onclick="accionCupon(${c.id}, 'cancelar')">Cancelar</button>` : ''}
                </div>
            </div>`).join('')}
        <p style="margin:8px 0 0;font-size:.74rem;color:var(--text-muted)">Cada cambio pide motivo y queda en la bitácora.</p>`;
}
function modalCupon(html, alGuardar) {
    const m = document.getElementById('modal-generico') || (() => {
        const d = document.createElement('div'); d.className = 'modal-overlay'; d.id = 'modal-generico';
        d.innerHTML = '<div class="modal" id="modal-generico-body" style="max-width:480px"></div>';
        document.body.appendChild(d);
        d.addEventListener('click', (e) => { if (e.target === d) d.classList.remove('open'); });
        return d;
    })();
    document.getElementById('modal-generico-body').innerHTML = `<button class="modal-close" type="button" onclick="document.getElementById('modal-generico').classList.remove('open')" aria-label="Cerrar">${icon('x', 20)}</button>${html}
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
            <button class="btn btn-ghost" type="button" onclick="document.getElementById('modal-generico').classList.remove('open')">Cancelar</button>
            <button class="btn btn-primary" type="button" id="cup-ok">Guardar</button></div>`;
    document.getElementById('cup-ok').onclick = async () => {
        try { const r = await alGuardar(); toast(r.message, 'ok'); m.classList.remove('open'); pintarCupones(); }
        catch (e) { toast(e.message, 'error'); }
    };
    m.classList.add('open');
}
function darCupon() {
    modalCupon(`<h3 style="margin-top:0">Dar un cupón a ${escHTML(TICKET.cliente_nombre)}</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="field"><label>Tipo</label><select id="cp-tipo"><option value="porcentaje">Porcentaje</option><option value="monto">Monto fijo ($)</option></select></div>
            <div class="field"><label>Valor</label><input id="cp-valor" type="number" min="1" step="1" value="10" /></div>
            <div class="field" id="cp-tope-w"><label>Descuento máximo ($)</label><input id="cp-tope" type="number" min="1" step="50" value="500" /></div>
            <div class="field"><label>Compra mínima ($)</label><input id="cp-min" type="number" min="0" step="100" value="0" /></div>
            <div class="field"><label>Vigencia (días)</label><input id="cp-dias" type="number" min="1" max="365" value="30" /></div>
        </div>
        <div class="field"><label>Motivo</label><input id="cp-motivo" maxlength="300" placeholder="Ej. compensación por ${escHTML(TICKET.folio)}" value="Compensación por ${escHTML(TICKET.folio)}" /></div>
        <p style="font-size:.78rem;color:var(--text-muted);margin:0">El cliente lo recibe por correo y lo ve en Mis cupones.</p>`,
        () => api(`/admin/clientes/${TICKET.cliente_id}/cupones`, { method: 'POST', body: {
            tipo: document.getElementById('cp-tipo').value, valor: Number(document.getElementById('cp-valor').value),
            tope: Number(document.getElementById('cp-tope').value), minimo: Number(document.getElementById('cp-min').value),
            dias: Number(document.getElementById('cp-dias').value), motivo: document.getElementById('cp-motivo').value } }));
    document.getElementById('cp-tipo').onchange = (e) => { document.getElementById('cp-tope-w').style.display = e.target.value === 'porcentaje' ? '' : 'none'; };
}
function accionCupon(id, accion) {
    const TXT = { extender: 'Extender la vigencia', reactivar: 'Reactivar el cupón', cancelar: 'Cancelar el cupón' };
    modalCupon(`<h3 style="margin-top:0">${TXT[accion]}</h3>
        ${accion === 'extender' ? '<div class="field"><label>Días más</label><input id="cp-dias" type="number" min="1" max="90" value="15" /></div>' : ''}
        ${accion === 'reactivar' ? '<p style="font-size:.84rem;margin:0 0 10px">Vuelve a quedar disponible con al menos 7 días de vigencia. Si se usó en un pedido que sigue activo, no se puede: dale un cupón nuevo.</p>' : ''}
        <div class="field"><label>Motivo</label><input id="cp-motivo" maxlength="300" value="${accion === 'cancelar' ? '' : `Atención del ticket ${escHTML(TICKET.folio)}`}" /></div>`,
        () => api(`/admin/cupones/${id}`, { method: 'PUT', body: { accion, motivo: document.getElementById('cp-motivo').value,
            dias: Number((document.getElementById('cp-dias') || {}).value) || undefined } }));
}

// ---- Pedido del caso: resumen y gestión sin salir del ticket ----
let TICKET = null;
const EST_PED = ['pendiente', 'confirmado', 'procesando', 'enviado', 'entregado'];
const EST_PED_TXT = { pendiente: 'Pendiente', confirmado: 'Confirmado', procesando: 'Procesando', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };
async function pintarPedido() {
    const caja = document.getElementById('tk-pedido');
    const t = TICKET;
    if (!t.pedido_id) {
        let lista = [];
        try { lista = await api(`/admin/clientes/${t.cliente_id}/pedidos`); } catch { /* sin permiso o sin pedidos */ }
        caja.innerHTML = `<h3 style="margin:0 0 6px;font-size:1rem">Pedido relacionado</h3>
            ${lista.length ? `<p style="margin:0 0 10px;font-size:.84rem;color:var(--text-muted)">Este caso no tiene pedido. Si trata de uno, lígalo para verlo y gestionarlo aquí.</p>
                <div class="field"><select id="tk-ligar"><option value="">Elige un pedido del cliente</option>
                    ${lista.map((p) => `<option value="${p.id}">${escHTML(p.numero_orden)} · ${EST_PED_TXT[p.estado] || p.estado} · ${formatoMoneda(p.total)}</option>`).join('')}</select></div>
                <button class="btn btn-outline btn-sm" style="width:100%" onclick="ligarPedido()">Ligar pedido</button>`
            : '<p style="margin:0;font-size:.84rem;color:var(--text-muted)">El cliente no tiene pedidos.</p>'}`;
        return;
    }
    let d;
    try { d = await api(`/admin/pedidos/${t.pedido_id}`); }
    catch {
        caja.innerHTML = `<h3 style="margin:0 0 6px;font-size:1rem">Pedido relacionado</h3>
            <p style="margin:0" class="mono">${escHTML(t.numero_orden)}</p>
            <p style="margin:4px 0 0;font-size:.84rem;color:var(--text-muted)">${EST_PED_TXT[t.pedido_estado] || t.pedido_estado} · ${formatoMoneda(t.pedido_total)}. Tu rol no puede gestionar pedidos.</p>`;
        return;
    }
    const i = EST_PED.indexOf(d.estado);
    caja.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <h3 style="margin:0;font-size:1rem">Pedido relacionado</h3>
            <button class="btn btn-ghost btn-sm" title="Quitar el pedido de este caso" onclick="desligarPedido()">${icon('x', 14)}</button>
        </div>
        <p style="margin:4px 0 10px"><span class="mono">${escHTML(d.numero_orden)}</span> · ${formatoFecha(d.fecha_pedido)}</p>
        ${d.estado === 'cancelado' ? '<span class="tag" style="color:var(--danger);border-color:var(--danger)">Cancelado</span>' : `
        <div class="tk-mini-pipe">${EST_PED.map((e, k) => `<span class="${k <= i ? 'on' : ''} ${k === i ? 'actual' : ''}" title="${EST_PED_TXT[e]}"></span>`).join('')}</div>
        <p style="margin:6px 0 10px;font-size:.84rem"><strong>${EST_PED_TXT[d.estado]}</strong>${d.numero_guia ? ` · guía <span class="mono">${escHTML(d.numero_guia)}</span>` : ''}</p>`}
        <div class="tk-kv"><span>Pago</span><span>${d.pago_estado === 'pagado' ? '<span style="color:var(--success)">Pagado</span>' : '<span style="color:var(--warning)">Pendiente</span>'}</span></div>
        <div class="tk-kv"><span>Total</span><span class="mono">${formatoMoneda(d.total)}</span></div>
        <div class="tk-kv"><span>Envío a</span><span style="text-align:right">${escHTML(d.direccion_envio || '—')}</span></div>
        <ul class="tk-items">${(d.items || []).map((it) => `<li><span>${it.cantidad} × ${escHTML(it.nombre)}</span><span class="mono">${formatoMoneda(it.subtotal)}</span></li>`).join('')}</ul>
        <button class="btn btn-primary btn-sm" style="width:100%" onclick="gestionarPedido()">${icon('truck', 15)} Gestionar pedido</button>
        <p style="margin:8px 0 0;font-size:.76rem;color:var(--text-muted)">Avanza el estado, registra el pago o cancélalo sin salir del caso.</p>`;
    PEDIDO_ANTES = d.estado;
}
let PEDIDO_ANTES = null;
function gestionarPedido() {
    GestionPedido.abrir(TICKET.pedido_id, { onCambio: async () => {
        const antes = PEDIDO_ANTES;
        await pintarPedido();
        // Si cambió el estado, se deja escrita una respuesta para avisarle al cliente.
        let d; try { d = await api(`/admin/pedidos/${TICKET.pedido_id}`); } catch { return; }
        if (d.estado !== antes) {
            const resp = document.getElementById('resp');
            if (resp && !resp.value.trim()) {
                resp.value = d.estado === 'cancelado'
                    ? `Cancelamos tu pedido ${d.numero_orden}. Si pagaste, el reembolso se hace al mismo medio de pago.`
                    : `Actualizamos tu pedido ${d.numero_orden}: ahora está «${EST_PED_TXT[d.estado]}».${d.numero_guia ? ` Número de guía: ${d.numero_guia}.` : ''}`;
                toast('Dejamos escrita una respuesta para avisarle al cliente; revísala y envíala.', 'ok');
            }
        }
    } });
}
async function ligarPedido() {
    const pid = Number(document.getElementById('tk-ligar').value);
    if (!pid) { toast('Elige un pedido', 'warn'); return; }
    try { const r = await api(`/admin/tickets/${TICKET.id}`, { method: 'PUT', body: { pedido_id: pid } }); toast(r.message, 'ok'); vistaHilo(TICKET.id); }
    catch (e) { toast(e.message, 'error'); }
}
async function desligarPedido() {
    if (!(await confirmar('¿Quitar el pedido de este caso? El pedido no cambia.', { okText: 'Quitar' }))) return;
    try { const r = await api(`/admin/tickets/${TICKET.id}`, { method: 'PUT', body: { pedido_id: 0 } }); toast(r.message, 'ok'); vistaHilo(TICKET.id); }
    catch (e) { toast(e.message, 'error'); }
}
async function guardarEstado(id) {
    try {
        await api(`/admin/tickets/${id}`, { method: 'PUT', body: {
            estado: document.getElementById('t-estado').value,
            prioridad: document.getElementById('t-prio').value,
        }});
        toast('Ticket actualizado', 'ok');
    } catch (e) { toast(e.message, 'error'); }
}
async function responder(id) {
    const mensaje = document.getElementById('resp').value.trim();
    const fotos = SEL_RESP ? SEL_RESP.fotos() : [];
    if (!mensaje && !fotos.length) { toast('Escribe una respuesta o adjunta una foto', 'warn'); return; }
    try {
        await api(`/admin/tickets/${id}/mensajes`, { method: 'POST', body: { mensaje, fotos } });
        location.reload();
    } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
