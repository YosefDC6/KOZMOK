<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seguridad · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
    .seg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .seg-tabs button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-panel); color: var(--text-muted); cursor: pointer; }
    .seg-tabs button.on { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--bg-panel)); }
    .sev-alta { color: var(--danger); border-color: var(--danger); }
    .sev-media { color: var(--warning); border-color: var(--warning); }
    .sev-baja { color: var(--text-muted); }
    .sev-info { color: var(--text-muted); border-style: dashed; opacity: .8; }
    .defensas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .defensas .card h4 { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
    .defensas ul { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--text-muted); line-height: 1.6; }
    td.det { max-width: 420px; word-break: break-word; font-size: .82rem; }
</style>
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>
        <div class="stat-grid" id="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>
        <div class="defensas" id="defensas"></div>
        <div class="seg-tabs" id="tabs">
            <button data-t="eventos" class="on">Eventos de seguridad</button>
            <button data-t="intentos">Intentos de inicio de sesión</button>
            <button data-t="bloqueos">Bloqueos</button>
            <button data-t="sesiones">Sesiones activas</button>
            <button data-t="correos">Correos enviados</button>
        </div>
        <div id="contenido"></div>
    </main>
</div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('seguridad');
document.getElementById('topbar').innerHTML = adminHeader('Seguridad', 'Ataques detectados y defensas activas: fuerza bruta, robo de credenciales o de sesión, inyección SQL y XSS.',
    '<button class="btn btn-outline" onclick="cargar()">Actualizar</button>');
const TIPO = {
    inyeccion_sql: 'Inyección SQL', xss: 'XSS (código en un formulario)', fuerza_bruta: 'Fuerza bruta', sesion_robada: 'Sesión robada (otro navegador)',
    token_invalido: 'Token falso o alterado', sesion_revocada: 'Reuso de sesión cerrada', csrf: 'CSRF (petición de otro sitio)', limite_peticiones: 'Exceso de peticiones',
    acceso_ajeno: 'Acceso a datos ajenos', cambio_password: 'Cambio de contraseña', recuperacion: 'Recuperación de contraseña', pago_rechazado: 'Pago rechazado',
    desbloqueo: 'Desbloqueo manual', ajuste_monedero: 'Ajuste de monedero', sesion_revocada_admin: 'Sesión cerrada por admin',
    panel_oculto: 'Intento de abrir el panel por su dirección pública',
    qr_aprobado: 'Inicio de sesión con QR aprobado desde el celular',
    qr_rechazado: 'Inicio de sesión con QR rechazado ("No fui yo")',
    qr_numero_erroneo: 'QR cancelado: se eligió un número que no coincide',
    sesion_qr: 'Inicio de sesión con QR',
    navegador_actualizado: 'El navegador se actualizó (sesión sigue)',
    sesion_emulacion: 'Modo de dispositivo (herramientas de desarrollador)',
    registro_correo_existente: 'Intento de registro con un correo que ya tiene cuenta',
    registro_alias_correo: 'Intento de abrir otra cuenta con la misma bandeja de correo (alias)',
};
// Detalles de un evento (columna datos): veredicto, petición, sesión,
// cambios de navegador y QR. Los eventos de antes de guardar detalles solo
// muestran lo que hay en sus columnas.
const ETIQUETA = {
    ip: 'IP', red: 'Red', navegador: 'Navegador', metodo: 'Método', ruta: 'Ruta', pagina: 'Página de origen', host: 'Dirección usada',
    id: 'Sesión #', tipo: 'De', abierta: 'Abierta', como: 'Cómo se abrió', ultima_ip: 'Última IP', ultima_red: 'Red',
    navegador_al_abrir: 'Navegador al abrir', ultimo_uso: 'Último uso', mantener_sesion: 'Mantener sesión', cerrada: 'Cerrada', motivo_cierre: 'Motivo del cierre',
    pedido_desde_ip: 'QR pedido desde', pedido_desde_red: 'Red de la computadora', pedido_con: 'Computadora', aprobado_desde_ip: 'Aprobado desde', aprobado_desde_red: 'Red del celular',
    aprobado_con: 'Celular', pedido: 'Pedido', aprobado: 'Aprobado', sesion_nueva: 'Sesión nueva #', antes: 'Antes', ahora: 'Ahora',
};
const valorDet = (k, v) => v === true ? 'Sí' : v === false ? 'No' : v == null || v === '' ? '—'
    : /^\d{4}-\d\d-\d\dT/.test(String(v)) ? formatoFechaHora(v) : escHTML(String(v));
function bloqueDet(titulo, obj) {
    const filas = Object.entries(obj || {}).filter(([, v]) => v !== null && v !== undefined && typeof v !== 'object');
    if (!filas.length) return '';
    return `<div class="ev-bloque"><h5>${titulo}</h5>${filas.map(([k, v]) => `<div class="ev-fila"><span>${escHTML(ETIQUETA[k] || k.replace(/_/g, ' '))}</span><strong>${valorDet(k, v)}</strong></div>`).join('')}</div>`;
}
function veredictoDe(e) {
    const d = e.datos || {};
    if (d.veredicto) return d.veredicto;
    if (e.severidad === 'info') return { normal: true, explicacion: 'Actividad normal de la cuenta.' };
    return null;
}
function detalleEvento(e) {
    const d = e.datos || {};
    const v = veredictoDe(e);
    const pet = d.peticion && Object.keys(d.peticion).length ? d.peticion : { ip: e.ip, navegador: navegadorDe(e.user_agent), metodo: e.metodo, ruta: e.ruta };
    const extra = Object.fromEntries(Object.entries(d).filter(([k, x]) => !['veredicto', 'peticion', 'sesion', 'qr', 'diferencias', 'antes', 'ahora'].includes(k) && typeof x !== 'object'));
    return `<div class="ev-det">
        ${v ? `<div class="ev-veredicto ${v.normal ? 'ok' : 'mal'}">${icon(v.normal ? 'check' : 'alert', 16)}<div><strong>${v.normal ? 'Dentro de lo normal' : 'Fuera de lo normal'}</strong><p>${escHTML(v.explicacion)}</p></div></div>`
            : '<div class="ev-veredicto"><div><strong>Sin veredicto</strong><p>Este evento es de antes de que se guardaran los detalles: solo hay IP, navegador y ruta.</p></div></div>'}
        ${d.diferencias && d.diferencias.length ? `<div class="ev-bloque"><h5>Qué cambió</h5><ul class="ev-lista">${d.diferencias.map((x) => `<li>${escHTML(x)}</li>`).join('')}</ul>${d.antes ? `<div class="ev-fila"><span>Antes</span><strong>${escHTML(d.antes)}</strong></div><div class="ev-fila"><span>Ahora</span><strong>${escHTML(d.ahora)}</strong></div>` : ''}</div>` : ''}
        <div class="ev-bloques">
            ${bloqueDet('Petición', pet)}
            ${bloqueDet('Sesión', d.sesion)}
            ${bloqueDet('Inicio con QR', d.qr)}
            ${bloqueDet('Más datos', extra)}
        </div>
        ${e.user_agent ? `<div class="ev-ua"><span>Navegador completo (lo que envió):</span> <code>${escHTML(e.user_agent)}</code></div>` : ''}
    </div>`;
}
function abrirEvento(id) {
    const fila = document.getElementById('evd-' + id);
    if (!fila) return;
    fila.hidden = !fila.hidden;
    document.getElementById('ev-' + id).classList.toggle('abierta', !fila.hidden);
}
let D = null, CORREOS = [], TAB = 'eventos';

async function cargar() {
    [D, CORREOS] = await Promise.all([api('/admin/seguridad/resumen'), api('/admin/correos').catch(() => [])]);
    const k = D.kpis, c = D.config;
    document.getElementById('kpis').innerHTML = `
        <div class="stat-card"><div class="stat-label">Logins fallidos (24 h)</div><div class="stat-value" style="color:var(--danger)">${k.fallidos_24h}</div><div class="stat-sub">${k.exitosos_24h} exitosos</div></div>
        <div class="stat-card"><div class="stat-label">Bloqueos activos</div><div class="stat-value" style="color:var(--warning)">${k.bloqueos_activos}</div><div class="stat-sub">cuentas o IPs</div></div>
        <div class="stat-card"><div class="stat-label">Inyección SQL (7 días)</div><div class="stat-value">${k.sqli_7d}</div><div class="stat-sub">intentos ${c.filtro_sql === 'bloquear' ? 'bloqueados' : 'registrados'}</div></div>
        <div class="stat-card"><div class="stat-label">XSS neutralizados (7 días)</div><div class="stat-value">${k.xss_7d}</div></div>
        <div class="stat-card"><div class="stat-label">Sesiones rechazadas (7 días)</div><div class="stat-value">${k.sesiones_7d}</div><div class="stat-sub">falsas, robadas o cerradas</div></div>
        <div class="stat-card"><div class="stat-label">Sesiones activas</div><div class="stat-value">${k.sesiones_activas}</div></div>`;
    document.getElementById('defensas').innerHTML = `
        <div class="card"><h4>${icon('lock', 16)} Fuerza bruta</h4><ul>
            <li>Cuenta bloqueada ${c.bloqueo_cuenta_min} min tras ${c.max_fallos_cuenta} contraseñas equivocadas seguidas.</li>
            <li>IP bloqueada ${c.bloqueo_ip_min} min tras ${c.max_fallos_ip} fallos en ${c.ventana_min} min (varias cuentas).</li>
            <li>Máximo 15 intentos por minuto por conexión y retraso progresivo.</li>
            <li>bcrypt costo ${c.costo_bcrypt} y mismo mensaje exista o no el correo.</li></ul></div>
        <div class="card"><h4>${icon('shield', 16)} Robo de credenciales y sesión</h4><ul>
            <li>Cookie HttpOnly + SameSite=Strict: JavaScript no puede leerla.</li>
            <li>Token aleatorio de 256 bits; en la base solo su hash SHA-256.</li>
            <li>Vence (${c.horas_sesion_cliente} h tienda, ${c.horas_sesion_equipo} h panel, ${c.inactividad_min_equipo} min sin uso) y se revoca al salir o cambiar contraseña.</li>
            <li>Atada al navegador: copiada a otro, se rechaza y se revoca.</li></ul></div>
        <div class="card"><h4>${icon('layers', 16)} Inyección SQL, XSS y CSRF</h4><ul>
            <li>Todas las consultas parametrizadas ($1, $2…): el dato nunca se concatena.</li>
            <li>Filtro de patrones (OR 1=1, UNION SELECT, ; DROP…) en modo <strong>${escHTML(c.filtro_sql)}</strong>.</li>
            <li>Ids numéricos validados; la base nunca muestra su error al usuario.</li>
            <li>HTML eliminado de toda entrada + CSP + escape al mostrar.</li>
            <li>Peticiones de otro sitio rechazadas (Origin + SameSite=Strict).</li></ul></div>`;
    pintar();
}

let FILTRO_SEV = 'baja';
function pintar() {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === TAB));
    const el = document.getElementById('contenido');
    if (TAB === 'eventos') {
        // Por defecto solo alertas; la actividad normal de las cuentas (activar
        // dos pasos, cambiar contraseña, pestañas viejas…) se ve si se pide.
        const NIVEL = { info: 0, baja: 1, media: 2, alta: 3 };
        const min = NIVEL[FILTRO_SEV] ?? 1;
        const evs = D.eventos.filter((e) => (NIVEL[e.severidad] ?? 2) >= min);
        const normales = D.eventos.filter((e) => e.severidad === 'info').length;
        el.innerHTML = `<div class="filters-bar" style="margin-bottom:10px">
            <select id="f-sev" onchange="FILTRO_SEV=this.value;pintar()">
                <option value="baja" ${FILTRO_SEV === 'baja' ? 'selected' : ''}>Alertas (baja, media y alta)</option>
                <option value="media" ${FILTRO_SEV === 'media' ? 'selected' : ''}>Solo media y alta</option>
                <option value="alta" ${FILTRO_SEV === 'alta' ? 'selected' : ''}>Solo alta</option>
                <option value="info" ${FILTRO_SEV === 'info' ? 'selected' : ''}>Todo, con actividad normal (${normales})</option>
            </select>
            <span style="font-size:.8rem;color:var(--text-muted)">La actividad normal (activar dos pasos, cambiar contraseña, una pestaña vieja tras cerrar sesión) se guarda, pero no es alerta.</span>
        </div>
        <div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Tipo</th><th>Severidad</th><th>Veredicto</th><th>Origen</th><th>Detalle</th></tr></thead>
            <tbody>${evs.map((e) => { const v = veredictoDe(e); return `<tr id="ev-${e.id}" class="ev-fila-clic" onclick="abrirEvento(${e.id})" title="Ver detalles">
                <td style="white-space:nowrap">${formatoFechaHora(e.fecha)}</td>
                <td><strong>${escHTML(TIPO[e.tipo] || e.tipo)}</strong>${e.cliente_nombre || e.usuario_nombre ? `<div style="font-size:.74rem;color:var(--text-muted)">${escHTML(e.cliente_nombre || e.usuario_nombre)}</div>` : ''}</td>
                <td><span class="tag sev-${escHTML(e.severidad)}">${e.severidad === 'info' ? 'normal' : escHTML(e.severidad)}</span></td>
                <td>${v ? `<span class="ev-v ${v.normal ? 'ok' : 'mal'}">${v.normal ? 'Normal' : 'Fuera de lo normal'}</span>` : '<span class="ev-v">—</span>'}</td>
                <td class="mono" style="font-size:.78rem">${escHTML(e.ip || '—')}${e.datos && e.datos.peticion && e.datos.peticion.red ? `<div style="color:var(--text-muted)">${escHTML(e.datos.peticion.red)}</div>` : ''}<div style="color:var(--text-muted)">${escHTML(e.metodo || '')} ${escHTML(e.ruta || '')}</div><div style="color:var(--text-muted)">${escHTML(navegadorDe(e.user_agent))}</div></td>
                <td class="det">${escHTML(e.detalle)}<div class="ev-ver">${icon('chevron', 13)} Ver detalles</div></td></tr>
                <tr id="evd-${e.id}" class="ev-det-fila" hidden><td colspan="6">${detalleEvento(e)}</td></tr>`; }).join('') || '<tr><td colspan="6">Sin alertas con este filtro.</td></tr>'}</tbody></table></div>`;
    } else if (TAB === 'intentos') {
        el.innerHTML = `${D.top_ips.length ? `<div class="card" style="margin-bottom:12px"><strong>IPs con más fallos (24 h)</strong>${D.top_ips.map((x) => `<div class="resumen-linea" style="margin-top:6px"><span class="mono">${escHTML(x.ip)}</span><span>${x.fallos} fallos · ${x.cuentas} cuenta(s)</span></div>`).join('')}</div>` : ''}
            <div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Acceso</th><th>Correo</th><th>IP / navegador</th><th>Resultado</th></tr></thead>
            <tbody>${D.intentos.map((i) => `<tr>
                <td style="white-space:nowrap">${formatoFechaHora(i.fecha)}</td><td>${i.tipo === 'usuario' ? 'Panel' : 'Tienda'}</td><td>${escHTML(i.correo)}</td>
                <td class="mono" style="font-size:.78rem">${escHTML(i.ip)}<div style="color:var(--text-muted)">${escHTML(navegadorDe(i.user_agent))}</div></td>
                <td><span class="tag ${i.exito ? 'ok' : 'mal'}">${i.exito ? 'Correcto' : escHTML(i.motivo || 'Fallido')}</span></td></tr>`).join('') || '<tr><td colspan="5">Sin intentos.</td></tr>'}</tbody></table></div>`;
    } else if (TAB === 'bloqueos') {
        el.innerHTML = `<div class="table-wrap"><table>
            <thead><tr><th>Tipo</th><th>Bloqueado</th><th>Motivo</th><th>Desde</th><th>Hasta</th><th></th></tr></thead>
            <tbody>${D.bloqueos.map((b) => `<tr>
                <td>${b.tipo === 'ip' ? 'IP' : 'Cuenta'}</td><td class="mono" style="font-size:.82rem">${escHTML(b.valor)}</td><td>${escHTML(b.motivo)}</td>
                <td style="white-space:nowrap">${formatoFechaHora(b.creado)}</td><td style="white-space:nowrap">${formatoFechaHora(b.hasta)}</td>
                <td>${b.activo ? `<button class="btn btn-outline btn-sm" onclick="levantar(${b.id})">Desbloquear</button>` : `<span class="tag">${b.levantado ? 'Levantado' + (b.levantado_por_nombre ? ' por ' + escHTML(b.levantado_por_nombre) : '') : 'Vencido'}</span>`}</td></tr>`).join('') || '<tr><td colspan="6">Sin bloqueos.</td></tr>'}</tbody></table></div>`;
    } else if (TAB === 'correos') {
        const ESTADO_CORREO = { enviado: ['ok', 'Enviado'], pendiente: ['aviso', 'En cola'], error: ['mal', 'No se envió'], sin_smtp: ['', 'Solo guardado'] };
        el.innerHTML = `<div id="smtp-estado" style="margin:0 0 10px;font-size:.86rem;color:var(--text-muted)">Revisando la cuenta de correo…</div>
            <div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Para</th><th>Asunto</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
            <tbody>${(CORREOS || []).map((m) => { const [cls, txt] = ESTADO_CORREO[m.estado] || ['', m.estado || '—']; return `<tr>
                <td style="white-space:nowrap">${formatoFechaHora(m.fecha)}</td><td>${escHTML(m.para)}</td>
                <td>${escHTML(m.asunto)}<div style="font-size:.76rem;color:var(--text-muted)">${escHTML(m.vista)}…</div></td>
                <td><span class="tag">${escHTML(m.tipo)}</span></td>
                <td><span class="tag ${cls}" ${m.error ? `title="${escHTML(m.error)}"` : ''}>${txt}</span></td>
                <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="verCorreo(${Number(m.id)})">Ver</button>
                    ${m.estado === 'error' || m.estado === 'sin_smtp' ? `<button class="btn btn-ghost btn-sm" onclick="reenviarCorreo(${Number(m.id)})">Reenviar</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="6">Todavía no se ha enviado ningún correo.</td></tr>'}</tbody></table></div>
            <div class="card" id="correo-abierto" hidden style="margin-top:14px"></div>`;
        api('/admin/correos/estado').then((e) => {
            const box = document.getElementById('smtp-estado');
            if (!box) return;
            box.innerHTML = !e.configurado
                ? 'Todavía no hay cuenta de Gmail de la tienda configurada: los correos solo se guardan aquí y no llegan a los clientes.'
                : e.ok ? `Los correos se envían de verdad desde <strong>${escHTML(e.cuenta)}</strong>.`
                : `<span style="color:var(--danger)">No se pudo entrar a ${escHTML(e.cuenta)}: ${escHTML(e.motivo)}</span>`;
        }).catch(() => {});
    } else {
        el.innerHTML = `<div class="table-wrap"><table>
            <thead><tr><th>Tipo</th><th>Dueño</th><th>IP / navegador</th><th>Inició</th><th>Último uso</th><th></th></tr></thead>
            <tbody>${D.sesiones.map((s) => `<tr>
                <td>${s.tipo === 'usuario' ? 'Panel' : 'Tienda'}</td><td>${escHTML(s.dueno)}<div style="font-size:.74rem;color:var(--text-muted)">${escHTML(s.correo)}</div></td>
                <td class="mono" style="font-size:.78rem">${escHTML(s.ip)}<div style="color:var(--text-muted)">${escHTML(navegadorDe(s.user_agent))}</div></td>
                <td style="white-space:nowrap">${formatoFechaHora(s.creada)}</td><td style="white-space:nowrap">${formatoFechaHora(s.ultimo_uso)}</td>
                <td>${s.actual ? '<span class="tag ok">Tu sesión</span>' : `<button class="btn btn-ghost btn-sm" onclick="revocar(${s.id})">Cerrar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    }
}
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => { TAB = b.dataset.t; pintar(); }));

async function levantar(id) {
    try { const r = await api(`/admin/seguridad/bloqueos/${id}/levantar`, { method: 'POST' }); toast(r.message, 'ok'); cargar(); }
    catch (e) { toast(e.message, 'error'); }
}
async function revocar(id) {
    if (!(await confirmar('¿Cerrar esta sesión? La persona tendrá que volver a iniciar sesión.', { okText: 'Cerrar sesión', peligro: true }))) return;
    try { const r = await api(`/admin/seguridad/sesiones/${id}/revocar`, { method: 'POST' }); toast(r.message, 'ok'); cargar(); }
    catch (e) { toast(e.message, 'error'); }
}
async function verCorreo(id) {
    try {
        const m = await api(`/admin/correos/${id}`);
        const box = document.getElementById('correo-abierto');
        box.innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div><strong>${escHTML(m.asunto)}</strong><div style="font-size:.8rem;color:var(--text-muted)">Para ${escHTML(m.para)} · ${formatoFechaHora(m.fecha)}</div></div>
            <button class="btn btn-ghost btn-sm" onclick="this.closest('.card').hidden = true">Cerrar</button></div>
            <pre style="white-space:pre-wrap;word-break:break-word;font-family:var(--font-body);margin:12px 0 0">${escHTML(m.cuerpo)}</pre>`;
        box.hidden = false;
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) { toast(e.message, 'error'); }
}
async function reenviarCorreo(id) {
    try { const r = await api(`/admin/correos/${id}/reenviar`, { method: 'POST' }); toast(r.message, r.estado === 'enviado' ? 'ok' : 'error'); cargar(); }
    catch (e) { toast(e.message, 'error'); }
}
cargar();
</script>
</body>
</html>
