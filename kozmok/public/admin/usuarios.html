<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuentas y equipo · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Rol</th><th>Estado</th><th>Dos pasos</th><th>Último acceso</th></tr></thead>
                <tbody id="tabla-usuarios"><tr><td colspan="7">Cargando…</td></tr></tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-usuario">
    <div class="modal" id="modal-usuario-body"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('usuarios');
const usuarioActual = Sesion.usuario();
const esAdmin = usuarioActual && usuarioActual.rol === 'admin';
document.getElementById('topbar').innerHTML = adminHeader(
    'Cuentas y equipo',
    'Da de alta cuentas de cliente o de personal interno (administrador, ventas, logística).',
    esAdmin ? '<button class="btn btn-primary" onclick="abrirNueva()">Nueva cuenta</button>' : ''
);
if (!esAdmin) {
    document.querySelector('.admin-main').insertAdjacentHTML('beforeend',
        '<p style="color:var(--text-muted);font-size:.88rem;margin-top:10px">Solo un administrador puede crear o modificar cuentas.</p>');
}

let ROLES = [];

async function cargarUsuarios() {
    const [usuarios, roles] = await Promise.all([
        api('/admin/usuarios'),
        api('/admin/roles').catch(() => []),
    ]);
    ROLES = roles;
    document.getElementById('tabla-usuarios').innerHTML = usuarios.map((u) => `
        <tr>
            <td class="mono">${u.id}</td>
            <td>${u.nombre}</td>
            <td>${u.email}</td>
            <td>${u.telefono || '—'}</td>
            <td>${esAdmin && ROLES.length
                ? `<select class="sel-rol" style="width:auto;min-width:140px;padding:4px 8px" onchange="cambiarRol(${u.id}, this)" data-actual="${u.rol}"
                        ${u.id === usuarioActual.id ? 'disabled title="No puedes cambiar tu propio rol"' : ''}>
                    ${ROLES.map((r) => `<option value="${r.clave}" ${r.clave === u.rol ? 'selected' : ''}>${r.nombre}</option>`).join('')}
                   </select>`
                : `<span class="tag">${(window.ROL_LABEL && ROL_LABEL[u.rol]) || u.rol}</span>`}</td>
            <td>${celdaEstado(u)}</td>
            <td>${u.dosf_metodo === 'app' ? '<span class="tag">App</span>' : '<span class="tag">Correo</span>'}
                ${esAdmin && u.dosf_metodo === 'app' && u.id !== usuarioActual.id ? `<button class="btn btn-ghost btn-sm" title="Si perdió su celular: vuelve a recibir el código por correo" onclick="reiniciar2fa(${u.id}, '${escHTML(u.nombre).replace(/'/g, '&#39;')}')">Reiniciar</button>` : ''}</td>
            <td>${u.ultimo_login ? formatoFecha(u.ultimo_login) : 'Nunca'}</td>
        </tr>
    `).join('');
}

// Estado de la cuenta y, para el administrador, el botón para activarla
// (manda un enlace por correo) o desactivarla.
function celdaEstado(u) {
    const nombre = escHTML(u.nombre).replace(/'/g, '&#39;');
    const propia = u.id === usuarioActual.id;
    if (u.activo) {
        return `<span class="tag" style="color:var(--success);border-color:var(--success)">Activo</span>`
            + (esAdmin && !propia ? ` <button class="btn btn-ghost btn-sm" onclick="desactivarCuenta(${u.id}, '${nombre}')">Desactivar</button>` : '');
    }
    if (u.activacion_enviada) {
        return `<span class="tag" style="color:var(--warning, #d4a017);border-color:var(--warning, #d4a017)" title="Enlace enviado el ${formatoFechaHora(u.activacion_enviada)}">Activación enviada</span>`
            + (esAdmin ? `<div style="margin-top:4px"><button class="btn btn-ghost btn-sm" onclick="activarCuenta(${u.id}, '${nombre}', true)">Reenviar</button>
                          <button class="btn btn-ghost btn-sm" onclick="desactivarCuenta(${u.id}, '${nombre}', true)">Cancelar</button></div>` : '');
    }
    return `<span class="tag" style="color:var(--danger);border-color:var(--danger)">Inactivo</span>`
        + (esAdmin ? ` <button class="btn btn-outline btn-sm" onclick="activarCuenta(${u.id}, '${nombre}')">Activar</button>` : '');
}

async function activarCuenta(id, nombre, reenviar = false) {
    const txt = reenviar
        ? `¿Reenviar el enlace de activación a ${nombre}? El enlace anterior deja de servir.`
        : `¿Activar la cuenta de ${nombre}? Le mandaremos un correo con un enlace para crear su contraseña; la cuenta queda activa cuando lo abra.`;
    if (!(await confirmar(txt, { okText: reenviar ? 'Reenviar' : 'Mandar enlace' }))) return;
    try { const r = await api(`/admin/usuarios/${id}/activar`, { method: 'POST' }); toast(r.message, 'ok'); cargarUsuarios(); }
    catch (e) { toast(e.message, 'error'); }
}

async function desactivarCuenta(id, nombre, soloEnlace = false) {
    const txt = soloEnlace
        ? `¿Cancelar el enlace de activación de ${nombre}? La cuenta sigue inactiva.`
        : `¿Desactivar la cuenta de ${nombre}? Ya no podrá entrar al panel y se cerrarán sus sesiones abiertas.`;
    if (!(await confirmar(txt, { okText: soloEnlace ? 'Cancelar enlace' : 'Desactivar' }))) return;
    try { const r = await api(`/admin/usuarios/${id}/desactivar`, { method: 'POST' }); toast(r.message, 'ok'); cargarUsuarios(); }
    catch (e) { toast(e.message, 'error'); }
}

// Si alguien perdió el celular con su app autenticadora, vuelve a recibir el
// código por correo hasta que la configure otra vez.
async function reiniciar2fa(id, nombre) {
    if (!(await confirmar(`¿Reiniciar la verificación en dos pasos de ${nombre}? Al entrar recibirá el código por correo hasta que vuelva a configurar su app.`, { okText: 'Reiniciar' }))) return;
    try { const r = await api(`/admin/usuarios/${id}/reiniciar-2fa`, { method: 'POST' }); toast(r.message, 'ok'); cargarUsuarios(); }
    catch (e) { toast(e.message, 'error'); }
}

async function cambiarRol(id, sel) {
    const nuevo = sel.value;
    const anterior = sel.dataset.actual;
    const nombre = (ROLES.find((r) => r.clave === nuevo) || {}).nombre || nuevo;
    if (!(await confirmar(`¿Cambiar el rol a ${nombre}? Cambia lo que ve en el menú y lo que puede hacer desde su siguiente acción.`, { okText: 'Cambiar rol' }))) {
        sel.value = anterior; return;
    }
    try {
        const r = await api(`/admin/usuarios/${id}/rol`, { method: 'PUT', body: { rol: nuevo } });
        sel.dataset.actual = nuevo;
        toast(r.message, 'ok');
    } catch (e) { sel.value = anterior; toast(e.message, 'error'); }
}

function cerrarModal() { document.getElementById('modal-usuario').classList.remove('open'); }

function abrirNueva() {
    const opciones = [
        '<option value="cliente">Cliente (tienda)</option>',
        ...ROLES.map((r) => `<option value="int:${r.clave}">${r.nombre} (equipo interno)</option>`),
    ].join('');
    document.getElementById('modal-usuario-body').innerHTML = `
        <button class="modal-close" onclick="cerrarModal()">${icon('x', 18)}</button>
        <h3>Nueva cuenta</h3>
        <div class="field">
            <label>Tipo de cuenta</label>
            <select id="tipo" onchange="pintarCampos()">${opciones}</select>
            <span id="tipo-desc" style="font-size:.8rem;color:var(--text-muted)"></span>
        </div>
        <div id="campos"></div>
        <div id="u-error" style="color:var(--danger);font-size:.85rem;margin:4px 0 10px;display:none"></div>
        <button class="btn btn-primary" style="width:100%" onclick="guardar()">Crear cuenta</button>
    `;
    document.getElementById('modal-usuario').classList.add('open');
    pintarCampos();
}

// Contraseña con las mismas reglas que la tienda (8+, mayúsculas y
// minúsculas, número y símbolo) y un botón que genera una segura.
function campoPassword(esCliente = false) {
    return `
        <div class="field">
            <label for="f-pass">Contraseña temporal</label>
            <div style="display:flex;gap:8px">
                <input type="password" id="f-pass" maxlength="72" autocomplete="new-password" />
                <button type="button" class="btn btn-outline btn-sm" onclick="verPass()" title="Mostrar u ocultar" aria-label="Mostrar u ocultar contraseña">${icon('eye', 16)}</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="generarPass()" title="Generar una contraseña segura">Generar</button>
            </div>
            ${ReglasPass.html('f-reglas')}
        </div>
        <div class="field"><label for="f-pass2">Repetir contraseña</label><input type="password" id="f-pass2" maxlength="72" autocomplete="new-password" /></div>
        <p style="font-size:.8rem;color:var(--text-muted);margin:-6px 0 12px">${esCliente
            ? 'No va en el correo de bienvenida. El correo le explica cómo poner su propia contraseña con «¿Olvidaste tu contraseña?».'
            : 'Dásela a la persona por un medio seguro (no va en el correo de bienvenida). Al entrar por primera vez se le pide cambiarla.'}</p>`;
}
function verPass() {
    ['f-pass', 'f-pass2'].forEach((id) => { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; });
}
function generarPass() {
    const grupos = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '#$%&*!?@+-'];
    const azar = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
    const todos = grupos.join('');
    const c = grupos.map((g) => g[azar(g.length)]);              // al menos uno de cada tipo
    while (c.length < 14) c.push(todos[azar(todos.length)]);
    for (let i = c.length - 1; i > 0; i--) { const j = azar(i + 1); [c[i], c[j]] = [c[j], c[i]]; }
    const pw = c.join('');
    ['f-pass', 'f-pass2'].forEach((id) => { const i = document.getElementById(id); i.value = pw; i.type = 'text'; i.dispatchEvent(new Event('input')); });
    document.getElementById('u-error').style.display = 'none';
    if (window.copiarTexto) copiarTexto(pw).then((ok) => ok && toast('Contraseña generada y copiada', 'ok'));
}

function pintarCampos() {
    const tipo = document.getElementById('tipo').value;
    const desc = document.getElementById('tipo-desc');
    const cont = document.getElementById('campos');

    if (tipo === 'cliente') {
        desc.textContent = 'Cuenta para comprar en la tienda. Aparece en Clientes, no en esta tabla.';
        cont.innerHTML = `
            <div class="field"><label>Nombre completo</label><input id="f-nombre" /></div>
            <div class="field"><label>Correo electrónico</label><input type="email" id="f-correo" /></div>
            <div class="field"><label>Teléfono</label><input id="f-tel" /></div>
            ${campoPassword(true)}
            <div class="field"><label>Empresa (opcional)</label><input id="f-empresa" /></div>
            <div class="field-row">
                <div class="field"><label>Ciudad</label><input id="f-ciudad" /></div>
                <div class="field"><label>Estado</label><input id="f-estado" /></div>
            </div>`;
        ReglasPass.enlazar(document.getElementById('f-pass'), document.getElementById('f-reglas'));
    } else {
        const clave = tipo.slice(4);
        const r = ROLES.find((x) => x.clave === clave);
        desc.textContent = r ? r.descripcion : 'Cuenta con acceso al panel interno.';
        cont.innerHTML = `
            <div class="field"><label>Nombre completo</label><input id="f-nombre" /></div>
            <div class="field"><label>Email</label><input type="email" id="f-correo" /></div>
            <div class="field"><label>Teléfono</label><input id="f-tel" /></div>
            ${campoPassword()}`;
        ReglasPass.enlazar(document.getElementById('f-pass'), document.getElementById('f-reglas'));
    }
}

async function guardar() {
    const tipo = document.getElementById('tipo').value;
    const err = document.getElementById('u-error');
    err.style.display = 'none';
    const g = (id) => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
    const nombre = g('f-nombre'), correo = g('f-correo'), password = document.getElementById('f-pass').value, telefono = g('f-tel');

    if (!nombre || !correo || !password) { err.textContent = 'Nombre, correo y contraseña son obligatorios.'; err.style.display = 'block'; return; }
    const falta = ReglasPass.faltante(password);
    if (falta) { err.textContent = falta; err.style.display = 'block'; return; }
    if (password !== document.getElementById('f-pass2').value) { err.textContent = 'Las contraseñas no coinciden.'; err.style.display = 'block'; return; }

    try {
        if (tipo === 'cliente') {
            const r = await api('/admin/clientes', { method: 'POST', body: {
                nombre, correo, password, telefono,
                empresa: g('f-empresa'), ciudad: g('f-ciudad'), estado: g('f-estado'),
            }});
            cerrarModal();
            toast(r.message || 'Cliente creado', 'ok');
            if (await confirmar('Cliente creado. ¿Abrir su ficha ahora?', { okText: 'Abrir ficha' })) {
                location.href = '/admin/cliente.html?id=' + r.cliente.id;
            }
        } else {
            const r = await api('/admin/usuarios', { method: 'POST', body: {
                nombre, email: correo, password, telefono, rol: tipo.slice(4),
            }});
            cerrarModal();
            toast(r.message || 'Cuenta interna creada', 'ok');
            cargarUsuarios();
        }
    } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
    }
}

cargarUsuarios();
</script>
</body>
</html>
