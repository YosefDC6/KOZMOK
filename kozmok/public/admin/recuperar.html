<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar contraseña · Panel Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="container" style="max-width:400px">
    <div style="text-align:center;margin-bottom:20px">
        <span class="auth-marca"><span class="brand-mark" style="display:inline-flex" data-logo="44"></span><span class="auth-mascota" data-mascota="52"></span></span>
        <h2 style="margin-top:12px">Recuperar contraseña</h2>
        <p>Escribe el correo de tu cuenta del panel y te mandamos un enlace para crear una nueva.</p>
    </div>
    <div class="card">
        <form id="rec-form">
            <div class="field"><label for="rec-correo">Correo</label><input type="email" id="rec-correo" required autocomplete="username" /></div>
            <div id="captcha" hidden></div>
            <div id="rec-error" class="auth-error" role="alert" hidden></div>
            <div id="rec-ok" role="status" hidden style="margin:0 0 12px;padding:10px 12px;border:1px solid var(--success);border-radius:10px;color:var(--text);font-size:.88rem"></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="rec-btn">Enviar enlace</button>
        </form>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/admin/login.html">Volver a iniciar sesión</a></p>
</div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dos-pasos.js"></script>
<script>
const CAPTCHA = Captcha.montar(document.getElementById('captcha'));
document.getElementById('rec-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = document.getElementById('rec-error'), ok = document.getElementById('rec-ok'), btn = document.getElementById('rec-btn');
    err.hidden = true; ok.hidden = true;
    const correo = document.getElementById('rec-correo').value.trim();
    const cap = await CAPTCHA;
    const captcha = cap.token();
    if (cap.activo && !captcha) { err.textContent = 'Marca la casilla "No soy un robot".'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
        const r = await api('/auth/recuperar-usuario', { method: 'POST', body: { correo, captcha } });
        ok.textContent = r.message; ok.hidden = false;
        btn.textContent = 'Enlace enviado';
    } catch (e) {
        err.textContent = e.message; err.hidden = false;
        btn.disabled = false; btn.textContent = 'Enviar enlace';
        if (cap.reiniciar) cap.reiniciar();
    }
});
</script>
</body>
</html>
