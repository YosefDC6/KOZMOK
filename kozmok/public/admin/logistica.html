<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logística · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>
        <div class="lg-leyenda">
            <div class="estrategia-tile push" id="tile-push"></div>
            <div class="estrategia-tile pull" id="tile-pull"></div>
            <div class="lg-expl">
                <p><strong>Push</strong>: se pide al proveedor en cuanto el stock llega al mínimo. Para alta rotación y demanda predecible.</p>
                <p><strong>Pull</strong>: se pide solo cuando una venta deja el producto en su mínimo. Para bajo volumen, caros o armados a la medida.</p>
            </div>
        </div>
        <div class="lg-layout">
            <aside class="card lg-filtros">
                <div class="field"><label for="lg-busca">Buscar</label><input id="lg-busca" placeholder="Nombre o marca…" autocomplete="off" /></div>
                <div class="stat-label" style="margin:6px 0 8px">Categoría</div>
                <div class="lg-cats" id="lg-cats"></div>
                <div class="stat-label" style="margin:14px 0 8px">Estrategia</div>
                <div class="seg" role="radiogroup" id="lg-est">
                    <label class="seg-op"><input type="radio" name="lg-est" value="" checked />Todas</label>
                    <label class="seg-op"><input type="radio" name="lg-est" value="push" />Push</label>
                    <label class="seg-op"><input type="radio" name="lg-est" value="pull" />Pull</label>
                </div>
                <label style="display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:.85rem"><input type="checkbox" id="lg-criticos" /> Solo en stock mínimo o agotados</label>
            </aside>
            <section>
                <div class="lg-barra">
                    <label style="display:flex;gap:8px;align-items:center;margin:0;font-size:.85rem"><input type="checkbox" id="lg-todos" /> <span id="lg-conteo">—</span></label>
                    <div class="lg-masivo" id="lg-masivo" hidden>
                        <span id="lg-sel-n"></span>
                        <button class="btn btn-outline btn-sm" onclick="cambiarVarios('push')">Pasar a push</button>
                        <button class="btn btn-outline btn-sm" onclick="cambiarVarios('pull')">Pasar a pull</button>
                    </div>
                </div>
                <div class="lg-lista" id="lg-lista"><div class="empty-state">Cargando…</div></div>
            </section>
        </div>
    </main>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('logistica');
document.getElementById('topbar').innerHTML = adminHeader(
    'Logística', 'Filtra el catálogo y cambia la estrategia push o pull de cada producto con un clic.'
);
const $ = (id) => document.getElementById(id);
let PRODUCTOS = [];
let CAT = '';
const SEL = new Set();

function filtrados() {
    const q = $('lg-busca').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const est = document.querySelector('input[name="lg-est"]:checked').value;
    const crit = $('lg-criticos').checked;
    return PRODUCTOS.filter((p) => (!CAT || p.categoria_nombre === CAT)
        && (!est || (p.restock || 'push') === est)
        && (!crit || p.stock <= p.stock_minimo)
        && (!q || `${p.nombre} ${p.marca || ''}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)));
}

function pintar() {
    const push = PRODUCTOS.filter((p) => p.restock !== 'pull').length;
    $('tile-push').innerHTML = `${icon('calendar', 20)}<div class="et-num">${push}</div><div class="et-label">Productos PUSH</div>`;
    $('tile-pull').innerHTML = `${icon('clock', 20)}<div class="et-num">${PRODUCTOS.length - push}</div><div class="et-label">Productos PULL</div>`;
    const cats = {};
    PRODUCTOS.forEach((p) => { const c = p.categoria_nombre || 'Sin categoría'; cats[c] = (cats[c] || 0) + 1; });
    $('lg-cats').innerHTML = [['', 'Todas', PRODUCTOS.length], ...Object.entries(cats).sort((a, b) => a[0].localeCompare(b[0])).map(([c, n]) => [c, c, n])]
        .map(([v, t, n]) => `<button class="lg-cat ${CAT === v ? 'on' : ''}" data-cat="${escHTML(v)}">${escHTML(t)}<span>${n}</span></button>`).join('');
    $('lg-cats').querySelectorAll('.lg-cat').forEach((b) => b.onclick = () => { CAT = b.dataset.cat; SEL.clear(); pintar(); });

    const lista = filtrados();
    $('lg-conteo').textContent = `${lista.length} producto${lista.length === 1 ? '' : 's'}${CAT ? ' en ' + CAT : ''}`;
    $('lg-todos').checked = lista.length > 0 && lista.every((p) => SEL.has(p.id));
    $('lg-masivo').hidden = SEL.size === 0;
    $('lg-sel-n').textContent = `${SEL.size} seleccionado${SEL.size === 1 ? '' : 's'}`;
    $('lg-lista').innerHTML = lista.length ? lista.map((p) => {
        const est = p.restock === 'pull' ? 'pull' : 'push';
        const cls = p.stock === 0 ? 'stock-out' : p.stock <= p.stock_minimo ? 'stock-low' : 'stock-ok';
        return `
        <div class="lg-item ${SEL.has(p.id) ? 'sel' : ''}">
            <input type="checkbox" data-id="${p.id}" ${SEL.has(p.id) ? 'checked' : ''} aria-label="Seleccionar ${escHTML(p.nombre)}" />
            <div class="lg-item-txt">
                <strong>${escHTML(p.nombre)}</strong>
                <span>${escHTML(p.marca || '')}${p.marca ? ' · ' : ''}${escHTML(p.categoria_nombre || 'Sin categoría')}${p.proveedor_nombre ? ' · ' + escHTML(p.proveedor_nombre) : ''}</span>
            </div>
            <div class="lg-item-stock"><span class="mono ${cls}">${p.stock}</span><small>/ mín. ${p.stock_minimo}</small></div>
            <div class="seg lg-toggle">
                <label class="seg-op ${est === 'push' ? '' : ''}"><input type="radio" name="e${p.id}" value="push" ${est === 'push' ? 'checked' : ''} data-prod="${p.id}" />${icon('calendar', 14)} Push</label>
                <label class="seg-op"><input type="radio" name="e${p.id}" value="pull" ${est === 'pull' ? 'checked' : ''} data-prod="${p.id}" />${icon('clock', 14)} Pull</label>
            </div>
        </div>`;
    }).join('') : '<div class="empty-state">Ningún producto coincide con estos filtros.</div>';
    $('lg-lista').querySelectorAll('input[type=checkbox][data-id]').forEach((c) => c.onchange = () => {
        const id = Number(c.dataset.id); c.checked ? SEL.add(id) : SEL.delete(id); pintar();
    });
    $('lg-lista').querySelectorAll('input[type=radio][data-prod]').forEach((r) => r.onchange = () => cambiar(Number(r.dataset.prod), r.value));
}

async function cambiar(id, estrategia) {
    const p = PRODUCTOS.find((x) => x.id === id);
    try {
        await api(`/admin/productos/${id}/estrategia`, { method: 'PUT', body: { estrategia } });
        p.restock = estrategia;
        toast(`${p.nombre}: ${estrategia === 'pull' ? 'Pull' : 'Push'}`, 'ok');
    } catch (e) { toast(e.message, 'error'); }
    pintar();
}
async function cambiarVarios(estrategia) {
    const ids = [...SEL].filter((id) => (PRODUCTOS.find((p) => p.id === id).restock || 'push') !== estrategia);
    if (!ids.length) { toast(`Los seleccionados ya están en ${estrategia}`, 'ok'); return; }
    if (!(await confirmar(`¿Pasar ${ids.length} producto(s) a ${estrategia === 'pull' ? 'Pull' : 'Push'}?`, { okText: 'Cambiar' }))) return;
    let ok = 0;
    for (const id of ids) {
        try { await api(`/admin/productos/${id}/estrategia`, { method: 'PUT', body: { estrategia } }); PRODUCTOS.find((p) => p.id === id).restock = estrategia; ok++; }
        catch (e) { toast(e.message, 'error'); break; }
    }
    SEL.clear();
    toast(`${ok} producto(s) cambiados a ${estrategia === 'pull' ? 'Pull' : 'Push'}`, 'ok');
    pintar();
}

$('lg-busca').addEventListener('input', pintar);
$('lg-criticos').addEventListener('change', pintar);
document.querySelectorAll('input[name="lg-est"]').forEach((r) => r.addEventListener('change', pintar));
$('lg-todos').addEventListener('change', () => {
    const lista = filtrados();
    if ($('lg-todos').checked) lista.forEach((p) => SEL.add(p.id)); else lista.forEach((p) => SEL.delete(p.id));
    pintar();
});
(async () => {
    PRODUCTOS = await api('/admin/productos');
    const cat = new URLSearchParams(location.search).get('categoria');
    if (cat) CAT = cat;
    pintar();
    $('lg-busca').focus();
})();
</script>
</body>
</html>
