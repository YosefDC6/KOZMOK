<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movimientos de inventario · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="filters-bar">
            <select id="f-tipo" onchange="aplicarFiltro()">
                <option value="">Todos los tipos</option>
                <option value="entrada">Entradas</option>
                <option value="salida">Salidas</option>
            </select>
            <input type="text" id="f-producto" placeholder="Buscar producto…" oninput="aplicarFiltro()" />
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Fecha del movimiento</th><th>Registrado</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th></th></tr></thead>
                <tbody id="tabla-movimientos"><tr><td colspan="7">Cargando…</td></tr></tbody>
            </table>
        </div>
    </main>
</div>


<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/permisos.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script src="/admin/js/scm-acciones.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('movimientos');
document.getElementById('topbar').innerHTML = adminHeader(
    'Movimientos de inventario', 'Historial de entradas y salidas de stock: automáticas (ventas, cancelaciones, restocks, pedidos surtidos) o registradas a mano.',
    '<button class="btn btn-primary" onclick="abrirNuevoMovimiento()">Nuevo movimiento</button>'
);

let MOVIMIENTOS = [];
// Desde Inventario se puede llegar con ?producto=<nombre> para ver su historial.
const productoURL = new URLSearchParams(location.search).get('producto');
if (productoURL) document.getElementById('f-producto').value = productoURL;

function fechaCorta(f) {
    return new Date(f).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderTabla() {
    const filtroProducto = document.getElementById('f-producto').value.trim().toLowerCase();
    const lista = filtroProducto
        ? MOVIMIENTOS.filter((m) => (m.producto_nombre || '').toLowerCase().includes(filtroProducto))
        : MOVIMIENTOS;

    const yo = Sesion.usuario() || {};
    document.getElementById('tabla-movimientos').innerHTML = lista.length ? lista.map((m) => {
        const dias = Math.round(Math.abs(new Date(m.fecha_registro) - new Date(m.fecha_movimiento)) / 86400000);
        const puede = m.usuario_id && (yo.rol === 'admin' || Number(m.usuario_id) === Number(yo.id));
        return `
        <tr>
            <td class="mono" style="font-size:.8rem">${fechaCorta(m.fecha_movimiento)}
                ${m.cambios_fecha ? `<div><button class="link-btn mv-aviso" onclick="verCambiosFecha(${m.id})">Fecha corregida ${m.cambios_fecha === 1 ? '1 vez' : m.cambios_fecha + ' veces'}</button></div>` : ''}</td>
            <td style="font-size:.8rem"><span class="mono">${fechaCorta(m.fecha_registro)}</span>
                <div style="color:var(--text-muted)">${escHTML(m.usuario_nombre || 'sistema')}</div>
                ${dias >= 1 ? `<div class="mv-aviso">${dias === 1 ? '1 día' : dias + ' días'} después</div>` : ''}</td>
            <td>${escHTML(m.producto_nombre || '—')}</td>
            <td><span class="estado-pill ${m.tipo === 'entrada' ? 'e-entregado' : 'e-cancelado'}">${m.tipo}</span>${m.estado && m.estado !== 'aplicado' ? ` <span class="tag">${m.estado}</span>` : ''}</td>
            <td class="mono">${m.tipo === 'entrada' ? '+' : '−'}${m.cantidad}</td>
            <td style="color:var(--text-muted);font-size:.85rem">${escHTML(m.motivo || '—')}</td>
            <td>${puede ? `<button class="btn btn-ghost btn-sm" onclick="corregirFecha(${m.id})">Corregir fecha</button>` : ''}</td>
        </tr>`;
    }).join('') : `<tr><td colspan="7" style="color:var(--text-muted)">No hay movimientos con este filtro.</td></tr>`;
}

const abrirModal = (html) => ScmAcciones.abrirModal(html), cerrarModal = () => ScmAcciones.cerrar();
const aLocal = (f) => { const d = new Date(f); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
function corregirFecha(id) {
    const m = MOVIMIENTOS.find((x) => x.id === id);
    abrirModal(`
        <h3 style="margin-bottom:2px">Corregir fecha del movimiento</h3>
        <p style="margin:0 0 12px;color:var(--text-muted);font-size:.85rem">${escHTML(m.producto_nombre || '')} · ${m.tipo === 'entrada' ? '+' : '−'}${m.cantidad}</p>
        <div class="field-row">
            <div class="field"><label>Fecha actual del movimiento</label><input value="${fechaCorta(m.fecha_movimiento)}" disabled /></div>
            <div class="field"><label>Nueva fecha</label><input type="datetime-local" id="cf-fecha" value="${aLocal(m.fecha_movimiento)}" max="${aLocal(new Date())}" /></div>
        </div>
        <div class="field"><label>Motivo del cambio (obligatorio)</label><textarea id="cf-motivo" rows="2" maxlength="300" placeholder="Ej. La merma se detectó en el conteo del lunes y se capturó hoy"></textarea></div>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0">La fecha real de registro (${fechaCorta(m.fecha_registro)}, ${escHTML(m.usuario_nombre || 'sistema')}) no cambia. Este cambio queda en el historial con tu nombre, la hora real y el motivo.</p>
        <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="guardarFecha(${id})">Guardar fecha</button>`);
}
async function guardarFecha(id) {
    const fecha = document.getElementById('cf-fecha').value, motivo = document.getElementById('cf-motivo').value.trim();
    if (!fecha) return toast('Elige la nueva fecha', 'warn');
    if (motivo.length < 10) return toast('Explica el motivo (al menos 10 caracteres)', 'warn');
    try { const r = await api(`/admin/movimientos-inventario/${id}/fecha`, { method: 'PUT', body: { fecha, motivo } }); cerrarModal(); toast(r.message, 'ok'); cargarMovimientos(); }
    catch (e) { toast(e.message, 'error'); }
}
async function verCambiosFecha(id) {
    const m = MOVIMIENTOS.find((x) => x.id === id);
    let h = [];
    try { h = await api(`/admin/movimientos-inventario/${id}/fechas`); } catch (e) { return toast(e.message, 'error'); }
    abrirModal(`
        <h3 style="margin-bottom:2px">Historial de la fecha</h3>
        <p style="margin:0 0 12px;color:var(--text-muted);font-size:.85rem">${escHTML(m.producto_nombre || '')} · registrado el ${fechaCorta(m.fecha_registro)} por ${escHTML(m.usuario_nombre || 'sistema')}</p>
        <div class="table-wrap"><table>
            <thead><tr><th>Cuándo se cambió</th><th>De</th><th>A</th><th>Quién y por qué</th></tr></thead>
            <tbody>${h.map((c) => `<tr><td class="mono" style="font-size:.8rem">${fechaCorta(c.fecha)}</td><td class="mono" style="font-size:.8rem">${fechaCorta(c.fecha_anterior)}</td>
                <td class="mono" style="font-size:.8rem">${fechaCorta(c.fecha_nueva)}</td><td style="font-size:.84rem"><strong>${escHTML(c.usuario_nombre || '—')}</strong><div style="color:var(--text-muted)">${escHTML(c.motivo)}</div></td></tr>`).join('')}</tbody>
        </table></div>`);
}

function aplicarFiltro() {
    cargarMovimientos();
}

async function cargarMovimientos() {
    const tipo = document.getElementById('f-tipo').value;
    const q = new URLSearchParams();
    if (tipo) q.set('tipo', tipo);
    MOVIMIENTOS = await api('/admin/movimientos-inventario?' + q.toString());
    renderTabla();
}

// Mismo formulario que en Inventario (ver admin/js/scm-acciones.js).
function abrirNuevoMovimiento() { ScmAcciones.nuevoMovimiento({ onListo: cargarMovimientos }); }

cargarMovimientos();
</script>
</body>
</html>
