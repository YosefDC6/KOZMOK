<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movimientos de inventario · Admin Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="admin-main">
        <div id="topbar"></div>

        <div class="filters-bar">
            <select id="f-tipo" onchange="aplicarFiltro()">
                <option value="">Todos los tipos</option>
                <option value="entrada">Entradas</option>
                <option value="salida">Salidas</option>
            </select>
            <input type="text" id="f-producto" placeholder="Buscar producto…" oninput="aplicarFiltro()" />
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Usuario</th></tr></thead>
                <tbody id="tabla-movimientos"><tr><td colspan="6">Cargando…</td></tr></tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-movimiento">
    <div class="modal" style="max-width:480px" id="modal-movimiento-body"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/admin/js/admin-layout.js"></script>
<script>
requireAuthAdmin();
renderAdminSidebar('movimientos');
document.getElementById('topbar').innerHTML = adminHeader(
    'Movimientos de inventario', 'Historial de entradas y salidas de stock: automáticas (ventas, cancelaciones, restocks, órdenes recibidas) o registradas a mano.',
    '<button class="btn btn-primary" onclick="abrirNuevoMovimiento()">Nuevo movimiento</button>'
);

let MOVIMIENTOS = [];
let PRODUCTOS_MOV = [];

function fechaCorta(f) {
    return new Date(f).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderTabla() {
    const filtroProducto = document.getElementById('f-producto').value.trim().toLowerCase();
    const lista = filtroProducto
        ? MOVIMIENTOS.filter((m) => (m.producto_nombre || '').toLowerCase().includes(filtroProducto))
        : MOVIMIENTOS;

    document.getElementById('tabla-movimientos').innerHTML = lista.length ? lista.map((m) => `
        <tr>
            <td class="mono" style="font-size:.8rem">${fechaCorta(m.fecha)}</td>
            <td>${m.producto_nombre || '—'}</td>
            <td><span class="estado-pill ${m.tipo === 'entrada' ? 'e-entregado' : 'e-cancelado'}">${m.tipo}</span></td>
            <td class="mono">${m.tipo === 'entrada' ? '+' : '−'}${m.cantidad}</td>
            <td style="color:var(--text-muted);font-size:.85rem">${m.motivo || '—'}</td>
            <td>${m.usuario_nombre || '<span style="color:var(--text-muted)">sistema</span>'}</td>
        </tr>
    `).join('') : `<tr><td colspan="6" style="color:var(--text-muted)">No hay movimientos con este filtro.</td></tr>`;
}

function aplicarFiltro() {
    cargarMovimientos();
}

async function cargarMovimientos() {
    const tipo = document.getElementById('f-tipo').value;
    const q = new URLSearchParams();
    if (tipo) q.set('tipo', tipo);
    MOVIMIENTOS = await api('/admin/movimientos-inventario?' + q.toString());
    renderTabla();
}

async function abrirNuevoMovimiento() {
    if (!PRODUCTOS_MOV.length) PRODUCTOS_MOV = await api('/admin/productos');
    const opciones = PRODUCTOS_MOV.map((p) => `<option value="${p.id}">${p.nombre} (stock ${p.stock})</option>`).join('');
    document.getElementById('modal-movimiento-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-movimiento').classList.remove('open')">${icon('x', 18)}</button>
        <h3>Nuevo movimiento</h3>
        <div class="field"><label>Producto</label><select id="mv-producto">${opciones}</select></div>
        <div class="field-row">
            <div class="field"><label>Tipo</label>
                <select id="mv-tipo">
                    <option value="entrada">Entrada (suma al stock)</option>
                    <option value="salida">Salida (resta del stock)</option>
                </select>
            </div>
            <div class="field"><label>Cantidad</label><input type="number" min="1" id="mv-cantidad" value="1" /></div>
        </div>
        <div class="field"><label>Motivo</label><input id="mv-motivo" placeholder="Ej. merma, conteo físico, ajuste de inventario" /></div>
        <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="guardarMovimiento()">Registrar movimiento</button>
    `;
    document.getElementById('modal-movimiento').classList.add('open');
}

async function guardarMovimiento() {
    const body = {
        producto_id: Number(document.getElementById('mv-producto').value),
        tipo: document.getElementById('mv-tipo').value,
        cantidad: Number(document.getElementById('mv-cantidad').value),
        motivo: document.getElementById('mv-motivo').value,
    };
    if (!body.cantidad || body.cantidad < 1) { toast('La cantidad debe ser mayor a 0', 'warn'); return; }
    try {
        await api('/admin/movimientos-inventario', { method: 'POST', body });
        document.getElementById('modal-movimiento').classList.remove('open');
        toast('Movimiento registrado', 'ok');
        PRODUCTOS_MOV = []; // refrescar stocks la próxima vez que se abra el formulario
        cargarMovimientos();
    } catch (e) { toast(e.message, 'error'); }
}

cargarMovimientos();
</script>
</body>
</html>
