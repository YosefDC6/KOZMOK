<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi cuenta · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando tu cuenta…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script src="/js/qrcode.min.js"></script>
<script>
// QR de la tarjeta de socio con Tibu (8-bit) en el centro; corrección H.
function qrSVG(texto) {
    try {
        const q = qrcode(0, 'H');
        q.addData(texto);
        q.make();
        return qrConTibu(q, { margen: 0, titulo: 'Código QR de socio' });
    } catch (e) { return ''; }
}

function tarjetaSocio(P, rec) {
    const num = String(P.id).padStart(4, '0');
    const numero = `4021 ${num.slice(0, 2)}88 71${num.slice(2, 4)} ${num}`;
    const desde = P.fecha_registro
        ? new Date(P.fecha_registro).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })
        : '—';
    const codigo = P.codigo_socio || '';
    const urlSocio = location.origin + '/socio.html?c=' + encodeURIComponent(codigo);
    const d = DisenoTarjeta.actual(P);
    return `
        <div class="socio-card tj-card diseno-${d} lv-${rec.nivel.clave}">
            ${DisenoTarjeta.adornos(200)}
            <div class="socio-main">
                <div class="socio-top">
                    <span class="socio-brand"><span class="socio-logo">${DisenoTarjeta.logo()}</span> Kozmok <em>Club</em></span>
                    <span class="socio-tier">${nivelBadge(rec.nivel.clave, 18)} Nivel ${rec.nivel.nombre}</span>
                </div>
                <div class="socio-chip" aria-hidden="true"></div>
                <div class="socio-num">${numero}</div>
                <div class="socio-grid">
                    <div><span>Titular</span><strong>${P.nombre}</strong></div>
                    <div><span>Socio desde</span><strong>${desde}</strong></div>
                    <div><span>Puntos</span><strong>${Number(rec.puntos).toLocaleString('es-MX')}</strong></div>
                    <div><span>Compras</span><strong>${formatoMoneda(rec.gasto_total)}</strong></div>
                </div>
            </div>
            ${codigo ? `
            <div class="socio-qr">
                <div class="sq-code">${qrSVG(urlSocio)}</div>
                <span class="sq-label">Escanéala en tienda</span>
                <span class="sq-id mono">${codigo}</span>
            </div>` : ''}
        </div>
        ${DisenoTarjeta.selector(P, d)}`;
}

montarCuenta('perfil', async (panel, P) => {
    const [pedidos, favs, rec, mon] = await Promise.all([
        api(`/pedidos/cliente/${P.id}`),
        api(`/clientes/${P.id}/favoritos`),
        api(`/clientes/${P.id}/recompensas`),
        api('/monedero').catch(() => ({ saldo: 0 })),
    ]);
    const gastado = rec.gasto_total || pedidos.filter((x) => x.estado !== 'cancelado').reduce((a, x) => a + Number(x.total), 0);
    const numCompras = rec.compras_total || pedidos.length;
    const ultimos = pedidos.slice(0, 3);

    panel.innerHTML = `
        <div class="cuenta-head">
            <h1>Hola, ${P.nombre.split(' ')[0]}</h1>
            <p>Tu tarjeta de socio, tus puntos y tus últimos pedidos.</p>
        </div>

        ${tarjetaSocio(P, rec)}

        <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
            <a class="stat-card" href="/recompensas.html" style="text-decoration:none"><div class="stat-label">Mis puntos</div><div class="stat-value" style="font-size:1.25rem">${Number(rec.puntos).toLocaleString('es-MX')}</div><div class="stat-sub">Valen ${formatoMoneda(rec.valor_en_dinero)} en tu próxima compra</div></a>
            <a class="stat-card" href="/monedero.html" style="text-decoration:none"><div class="stat-label">Mi monedero</div><div class="stat-value" style="font-size:1.25rem;color:var(--success)">${formatoMoneda(mon.saldo)}</div><div class="stat-sub">Recargar o ver movimientos</div></a>
            <a class="stat-card" href="/pedidos.html" style="text-decoration:none"><div class="stat-label">Mis pedidos</div><div class="stat-value">${numCompras}</div><div class="stat-sub">${formatoMoneda(gastado)} en compras</div></a>
            <a class="stat-card" href="/favoritos.html" style="text-decoration:none"><div class="stat-label">Favoritos</div><div class="stat-value">${favs.length}</div><div class="stat-sub">Productos guardados</div></a>
        </div>

        <div class="card">
            <div class="section-head" style="margin-bottom:12px"><h3 style="margin:0">Últimos pedidos</h3><a href="/pedidos.html">Ver todos</a></div>
            ${ultimos.length === 0
                ? '<p style="margin:0">Aún no tienes pedidos. <a href="/index.html?ver=todo">Ir al catálogo</a></p>'
                : ultimos.map((p) => `
                    <div class="mini-order">
                        <div><span class="mono">${p.numero_orden}</span><span class="mo-sub">${formatoFecha(p.fecha_pedido)} · ${p.productos || ''}</span></div>
                        <div class="mo-right"><span class="mono">${formatoMoneda(p.total)}</span><span class="tag">${ESTADO_LABEL[p.estado] || p.estado}</span></div>
                    </div>
                `).join('')}
        </div>
    `;
    DisenoTarjeta.activar(P, panel);
});
</script>
</body>
</html>
