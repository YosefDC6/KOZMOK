<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
    <div class="page-hero">
        <div class="hero-badge" data-ic="user" data-ic-size="28"></div>
        <h1 id="auth-title">Bienvenido</h1>
        <p id="auth-sub">Accede a tu cuenta de Kozmok para ver pedidos, favoritos y recomendaciones.</p>
    </div>

    <!-- Ya hay sesión iniciada -->
    <div class="card" id="ya-sesion" hidden>
        <p style="text-align:center;color:var(--text)">Ya iniciaste sesión como <strong id="ya-nombre"></strong>.</p>
        <a class="btn btn-primary" style="width:100%;margin-bottom:10px" href="/perfil.html">Ir a mi perfil</a>
        <button class="btn btn-outline" style="width:100%" id="btn-otra">Usar otra cuenta</button>
    </div>

    <!-- Formulario de acceso -->
    <div class="card" id="form-card">
        <form id="form-login">
            <div class="field">
                <label>Correo electrónico</label>
                <input type="email" id="correo" required placeholder="tucorreo@ejemplo.com" autocomplete="email" />
            </div>
            <div class="field">
                <label>Contraseña</label>
                <div style="display:flex;gap:8px">
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
                    <button type="button" class="btn btn-outline btn-sm" id="toggle-pass" aria-label="Mostrar u ocultar contraseña" data-ic="eye" data-ic-size="16"></button>
                </div>
            </div>
            <div style="text-align:right;margin:-6px 0 12px"><a href="/recuperar.html" id="link-olvide" style="font-size:.84rem">¿Olvidaste tu contraseña?</a></div>
            <div id="login-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-entrar">Ingresar</button>
        </form>
        <p style="margin-top:16px;text-align:center">¿No tienes cuenta? <a href="/registro.html">Crear cuenta</a></p>
        <p class="auth-nota"><span data-ic="lock" data-ic-size="13"></span> Tu sesión se guarda en una cookie protegida. Tras 5 intentos fallidos la cuenta se bloquea 15 minutos.</p>
    </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script>
function destinoNext() {
    const n = new URLSearchParams(location.search).get('next');
    if (n && n.startsWith('/') && !n.startsWith('//')) return n;
    return '/perfil.html';
}

// Si ya hay sesión, no autoenviamos a ningún lado: mostramos el estado
// y dejamos que la persona decida.
(async () => {
const sesion = await Sesion.sincronizar();
if (sesion) {
    document.getElementById('form-card').hidden = true;
    document.getElementById('ya-sesion').hidden = false;
    document.getElementById('auth-title').textContent = 'Ya tienes sesión';
    document.getElementById('auth-sub').textContent = 'Continúa a tu perfil o entra con otra cuenta.';
    document.getElementById('ya-nombre').textContent = sesion.nombre;
    document.getElementById('btn-otra').addEventListener('click', async () => {
        await Sesion.cerrarSesionCliente();
        location.reload();
    });
}
})();

document.getElementById('toggle-pass').addEventListener('click', () => {
    const i = document.getElementById('password');
    i.type = i.type === 'password' ? 'text' : 'password';
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const correo = document.getElementById('correo').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-entrar');
    errorBox.hidden = true;
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
        const data = await api('/auth/login', { method: 'POST', body: { tipo: 'cliente', correo, password } });
        Sesion.guardarCliente(data.cliente);
        const r = await CarritoInvitado.fusionar();
        toast(r.pasados ? `Bienvenido de vuelta. Pasamos ${r.pasados} producto(s) a tu carrito.` : 'Bienvenido de vuelta', 'ok');
        r.avisos.forEach((m) => toast(m, 'warn'));
        setTimeout(() => location.href = r.pasados && !new URLSearchParams(location.search).get('next') ? '/carrito.html' : destinoNext(), 500);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.toggle('bloqueado', err.status === 429);
        errorBox.hidden = false;
        document.getElementById('password').value = '';
        btn.disabled = false; btn.textContent = 'Ingresar';
    }
});

// Conserva a dónde volver (p. ej. el carrito) al cambiar entre entrar y crear cuenta.
(() => {
    const next = new URLSearchParams(location.search).get('next');
    if (next) document.querySelectorAll('a[href="/registro.html"]').forEach((a) => { a.href = '/registro.html?next=' + encodeURIComponent(next); });
})();
</script>
</body>
</html>
