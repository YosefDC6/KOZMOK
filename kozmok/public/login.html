<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
    <div class="page-hero">
        <div class="hero-badge" data-ic="user" data-ic-size="28"></div>
        <h1 id="auth-title">Bienvenido</h1>
        <p id="auth-sub">Accede a tu cuenta de Kozmok para ver pedidos, favoritos y recomendaciones.</p>
    </div>

    <!-- Ya hay sesión iniciada -->
    <div class="card" id="ya-sesion" hidden>
        <p style="text-align:center;color:var(--text)">Ya iniciaste sesión como <strong id="ya-nombre"></strong>.</p>
        <a class="btn btn-primary" style="width:100%;margin-bottom:10px" href="/perfil.html">Ir a mi perfil</a>
        <button class="btn btn-outline" style="width:100%" id="btn-otra">Usar otra cuenta</button>
    </div>

    <!-- Formulario de acceso -->
    <div class="card" id="form-card">
        <div class="cuentas-recordadas" id="cuentas" hidden></div>
        <form id="form-login">
            <div class="field" id="campo-correo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="username" required placeholder="tucorreo@ejemplo.com" autocomplete="username" />
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div style="display:flex;gap:8px">
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
                    <button type="button" class="btn btn-outline btn-sm" id="toggle-pass" aria-label="Mostrar u ocultar contraseña" data-ic="eye" data-ic-size="16"></button>
                </div>
            </div>
            <div class="auth-fila">
                <label class="auth-recordar"><input type="checkbox" id="recordar" checked /> Mantener sesión iniciada</label>
                <div class="auth-olvide"><a href="/recuperar.html" id="link-olvide">¿Olvidaste tu contraseña?</a></div>
            </div>
            <div id="captcha" hidden></div>
            <div id="login-error" class="auth-error" role="alert" hidden></div>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-entrar">Entrar</button>
        </form>
        <p style="margin-top:16px;text-align:center">¿No tienes cuenta? <a href="/registro.html">Crear cuenta</a></p>
        <p class="auth-nota">Si usas una computadora compartida, desmarca «Mantener sesión iniciada».</p>
    </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/dos-pasos.js"></script>
<script>
const CAPTCHA = Captcha.montar(document.getElementById('captcha'));
function destinoNext() {
    const n = new URLSearchParams(location.search).get('next');
    if (n && n.startsWith('/') && !n.startsWith('//')) return n;
    return '/perfil.html';
}

// Si ya hay sesión, no autoenviamos a ningún lado: mostramos el estado
// y dejamos que la persona decida.
const sesion = Sesion.cliente();
if (sesion) {
    document.getElementById('form-card').hidden = true;
    document.getElementById('ya-sesion').hidden = false;
    document.getElementById('auth-title').textContent = 'Ya tienes sesión';
    document.getElementById('auth-sub').textContent = 'Continúa a tu perfil o entra con otra cuenta.';
    document.getElementById('ya-nombre').textContent = sesion.nombre;
    document.getElementById('btn-otra').addEventListener('click', async () => {
        await Sesion.cerrarSesionCliente();
        location.reload();
    });
}

document.getElementById('toggle-pass').addEventListener('click', () => {
    const i = document.getElementById('password');
    i.type = i.type === 'password' ? 'text' : 'password';
});

// Si la cookie de sesión sigue viva (sesión recordada) pero el navegador
// perdió los datos de pantalla, se recupera la sesión sin pedir contraseña.
if (!sesion) {
    api('/auth/estado').then(({ cliente }) => {
        if (cliente) { Sesion.guardarCliente(cliente); location.replace(destinoNext()); }
    }).catch(() => {});
}

// Cuentas que este navegador recuerda: un clic y solo falta la contraseña.
const inCorreo = document.getElementById('correo');
const campoCorreo = document.getElementById('campo-correo');
const contCuentas = document.getElementById('cuentas');
function elegirCuenta(c) {
    inCorreo.value = c ? c.correo : '';
    document.getElementById('link-olvide').href = '/recuperar.html' + (c ? '?correo=' + encodeURIComponent(c.correo) : '');
    // Con una cuenta elegida el campo se oculta a la vista, pero sigue en el
    // formulario: así el navegador sabe a qué correo pertenece la contraseña
    // que guarda o autollena.
    campoCorreo.classList.toggle('campo-oculto', !!c);
    contCuentas.querySelectorAll('.cr-elegir').forEach((b, i) => b.classList.toggle('activa', !!c && CuentasRecordadas.lista('cliente')[i]?.correo === c.correo));
    document.getElementById(c ? 'password' : 'correo').focus();
}
function pintarCuentas() {
    CuentasRecordadas.pintar(contCuentas, 'cliente', elegirCuenta);
    const l = CuentasRecordadas.lista('cliente');
    if (!l.length) { campoCorreo.classList.remove('campo-oculto'); return; }
    const otra = document.createElement('a');
    otra.href = '#'; otra.className = 'cr-otra'; otra.textContent = 'Usar otra cuenta';
    otra.addEventListener('click', (ev) => { ev.preventDefault(); elegirCuenta(null); });
    contCuentas.appendChild(otra);
    // Al quitar una cuenta se vuelve a pintar la lista
    contCuentas.querySelectorAll('.cr-quitar').forEach((b) => b.addEventListener('click', () => setTimeout(pintarCuentas)));
    if (!sesion) elegirCuenta(l.find((c) => c.correo === inCorreo.value) || l[0]);
}
pintarCuentas();

document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const correo = inCorreo.value;
    const password = document.getElementById('password').value;
    const recordar = document.getElementById('recordar').checked;
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-entrar');
    errorBox.hidden = true;
    const cap = await CAPTCHA;
    const captcha = cap.token();
    if (cap.activo && !captcha) { errorBox.textContent = 'Marca la casilla "No soy un robot".'; errorBox.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
        let data = await api('/auth/login-cliente', { method: 'POST', body: { correo, password, recordar, captcha } });
        // Verificación en dos pasos: falta el código de la app o del correo.
        if (data.requiere_2fa) {
            btn.textContent = 'Esperando el código…';
            data = await DosPasos.pedir(data);
            if (!data) { cap.reiniciar(); btn.disabled = false; btn.textContent = 'Entrar'; return; }
        }
        Sesion.guardarCliente({ ...data.cliente, recordar });
        if (recordar) { CuentasRecordadas.guardar('cliente', data.cliente); await guardarCredencial(correo, password, data.cliente.nombre); }
        else CuentasRecordadas.olvidar('cliente', data.cliente.correo);
        const r = await CarritoInvitado.fusionar();
        toast(r.pasados ? `Bienvenido de vuelta. Pasamos ${r.pasados} producto(s) a tu carrito.` : 'Bienvenido de vuelta', 'ok');
        r.avisos.forEach((m) => toast(m, 'warn'));
        const destino = r.pasados && !new URLSearchParams(location.search).get('next') ? '/carrito.html' : destinoNext();
        // Contraseña de antes de la política actual: primero se le pide cambiarla.
        const ir = data.cliente.password_debil ? `/seguridad.html?debil=1&next=${encodeURIComponent(destino)}` : destino;
        setTimeout(() => location.href = ir, 500);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.toggle('bloqueado', /bloquead/i.test(err.message));
        errorBox.hidden = false;
        document.getElementById('password').value = '';
        cap.reiniciar();   // cada marca de "No soy un robot" sirve una sola vez
        btn.disabled = false; btn.textContent = 'Entrar';
    }
});

// Conserva a dónde volver (p. ej. el carrito) al cambiar entre entrar y crear cuenta.
(() => {
    const next = new URLSearchParams(location.search).get('next');
    if (next) document.querySelectorAll('a[href="/registro.html"]').forEach((a) => { a.href = '/registro.html?next=' + encodeURIComponent(next); });
})();
</script>
</body>
</html>
