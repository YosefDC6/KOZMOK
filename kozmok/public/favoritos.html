<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Favoritos · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
let CID = null;

// Activa los avisos de favoritos (bajas de precio y existencias)
document.addEventListener('click', async (e) => {
    if (e.target.id !== 'btn-fav-avisos') return;
    try {
        const actuales = (await api(`/clientes/${Sesion.cliente().id}`)).preferencias || {};
        await api(`/clientes/${Sesion.cliente().id}/preferencias`, { method: 'PUT', body: { ...actuales, ofertas: true, stock_favoritos: true } });
        document.getElementById('fav-avisos').innerHTML = `${icon('check', 16)} Listo: te avisaremos por correo. Puedes cambiarlo en Preferencias.`;
    } catch (ex) { toast(ex.message, 'error'); }
});

montarCuenta('favoritos', async (panel, P) => {
    CID = P.id;
    const favs = await api(`/clientes/${P.id}/favoritos`);
    if (favs.length === 0) {
        panel.innerHTML = `<div class="cuenta-head"><h1>Favoritos</h1></div>
            <div class="empty-state">No has guardado productos.<br>Usa el corazón en cualquier producto para guardarlo aquí.</div>`;
        return;
    }
    const prefs = P.preferencias || {};
    const avisos = prefs.ofertas && prefs.stock_favoritos;
    panel.innerHTML = `<div class="cuenta-head"><h1>Favoritos</h1><p>${favs.length} producto(s) guardados.</p></div>
        ${avisos ? '' : `<div class="card fav-avisos" id="fav-avisos" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
            <span style="flex:1;min-width:200px">${icon('mail', 16)} ¿Te avisamos por correo cuando alguno baje de precio o vuelva a estar disponible?</span>
            <button class="btn btn-outline btn-sm" id="btn-fav-avisos">Sí, avisarme</button></div>`}
        <div class="grid-products" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
        ${favs.map((p) => `
            <div class="product-card ${p.activo === false ? 'is-off' : ''}">
                <button class="fav-btn on" title="Quitar de favoritos" onclick="quitarFav(${p.id})">${icon('heart', 16)}</button>
                <img src="${imagenProducto(p)}" referrerpolicy="no-referrer" alt="${p.nombre}" onerror="this.onerror=null;this.src='${ilustracionProducto(p)}'" onclick="location.href='/index.html#producto-${p.id}'" style="cursor:pointer" />
                <div class="product-body">
                    <span class="product-brand">${p.marca || ''}</span>
                    <span class="product-name">${p.nombre}</span>
                    <span class="product-price">${formatoMoneda(p.precio)}</span>
                    <div class="card-actions">
                        ${p.activo === false
                            ? '<span class="tag" style="color:var(--warning);border-color:var(--warning)">Ya no está a la venta</span>'
                            : `<button class="btn btn-primary btn-sm" ${p.stock === 0 ? 'disabled' : ''} onclick="favAlCarrito(${p.id})">${p.stock === 0 ? 'Sin stock' : 'Agregar al carrito'}</button>`}
                    </div>
                </div>
            </div>
        `).join('')}
        </div>`;
});

async function quitarFav(pid) {
    try {
        await api(`/clientes/${CID}/favoritos/${pid}`, { method: 'DELETE' });
        toast('Quitado de favoritos', 'ok');
        actualizarBadgeFavoritos();
        setTimeout(() => location.reload(), 400);
    } catch (e) { toast(e.message, 'error'); }
}
async function favAlCarrito(pid) {
    try {
        await agregarProducto(pid, 1);
        actualizarBadgeCarrito();
    } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
