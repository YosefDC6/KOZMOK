<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
    <div class="page-hero">
        <div class="hero-badge" data-ic="user" data-ic-size="28"></div>
        <h1 id="auth-title">Crea tu cuenta</h1>
        <p id="auth-sub">Regístrate para comprar, seguir tus pedidos, guardar favoritos y recibir recomendaciones.</p>
    </div>

    <div class="card" id="ya-sesion" hidden>
        <p style="text-align:center;color:var(--text)">Ya iniciaste sesión como <strong id="ya-nombre"></strong>.</p>
        <a class="btn btn-primary" style="width:100%;margin-bottom:10px" href="/perfil.html">Ir a mi perfil</a>
        <button class="btn btn-outline" style="width:100%" id="btn-otra">Cerrar sesión y crear otra cuenta</button>
    </div>

    <div class="card" id="form-card" style="max-width:460px">
        <form id="form-registro">
            <div class="field"><label>Nombre completo</label><input type="text" id="nombre" required autocomplete="name" /></div>
            <div class="field"><label>Correo electrónico</label><input type="email" id="correo" required autocomplete="email" />
                <div class="sugerencia-correo" id="sugerencia-correo" hidden></div></div>

            <div class="field">
                <label>Contraseña</label>
                <div style="display:flex;gap:8px">
                    <input type="password" id="password" minlength="8" maxlength="72" required autocomplete="new-password" oninput="medirPass()" />
                    <button type="button" class="btn btn-outline btn-sm" id="toggle-pass" aria-label="Mostrar u ocultar contraseña" data-ic="eye" data-ic-size="16"></button>
                </div>
                <div class="pass-meter" id="pass-meter" hidden>
                    <div class="pm-track"><span id="pm-fill"></span></div>
                    <span class="pm-label" id="pm-label"></span>
                </div>
                <div id="reglas-slot"></div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="password2" required autocomplete="new-password" oninput="medirPass()" />
                </div>
                <div class="field"><label>Teléfono <small style="color:var(--text-muted)">(opcional)</small></label><input type="tel" id="telefono" autocomplete="tel" /></div>
            </div>
            <div class="pass-match" id="pass-match" hidden></div>

            <label class="auth-recordar"><input type="checkbox" id="recordar" checked /> Mantener sesión iniciada en este dispositivo</label>
            <label class="auth-recordar"><input type="checkbox" id="boletin" /> Quiero recibir por correo las promociones y avisos de mis favoritos</label>
            <div id="registro-error" class="auth-error" role="alert" hidden></div>
            <p class="auth-legal">Al crear tu cuenta aceptas los <a href="/terminos.html" target="_blank">Términos y condiciones</a> y el <a href="/terminos.html#privacidad" target="_blank">uso de tus datos</a>.</p>
            <button class="btn btn-primary" style="width:100%" type="submit" id="btn-registrar">Crear cuenta</button>
        </form>
        <p style="margin-top:16px;text-align:center">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script>
const sesion = Sesion.cliente();
if (sesion) {
    document.getElementById('form-card').hidden = true;
    document.getElementById('ya-sesion').hidden = false;
    document.getElementById('auth-title').textContent = 'Ya tienes una cuenta';
    document.getElementById('auth-sub').textContent = 'Estás dentro con una sesión activa.';
    document.getElementById('ya-nombre').textContent = sesion.nombre;
    document.getElementById('btn-otra').addEventListener('click', async () => {
        await Sesion.cerrarSesionCliente();
        location.reload();
    });
}

document.getElementById('toggle-pass').addEventListener('click', () => {
    const i = document.getElementById('password');
    i.type = i.type === 'password' ? 'text' : 'password';
});

// --- Medidor de seguridad de contraseña ---
const NIVELES_PASS = [
    { label: 'Muy débil', color: 'var(--danger)',  pct: 20 },
    { label: 'Débil',     color: 'var(--danger)',  pct: 40 },
    { label: 'Regular',   color: 'var(--warning)', pct: 60 },
    { label: 'Buena',     color: '#8FBF4D',        pct: 80 },
    { label: 'Fuerte',    color: 'var(--success)', pct: 100 },
];
function fuerzaPassword(pw) {
    if (!pw) return 0;
    let s = 0;
    if (pw.length >= 8) s++;
    if (pw.length >= 10) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    if (pw.length < 8) s = Math.min(s, 1);
    return Math.min(s, 4);
}
function medirPass() {
    const pw = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;
    const meter = document.getElementById('pass-meter');
    const fill = document.getElementById('pm-fill');
    const label = document.getElementById('pm-label');
    const match = document.getElementById('pass-match');

    if (!pw) { meter.hidden = true; } else {
        meter.hidden = false;
        const n = NIVELES_PASS[fuerzaPassword(pw)];
        fill.style.width = n.pct + '%';
        fill.style.background = n.color;
        label.textContent = n.label;
        label.style.color = n.color;
    }

    if (!pw2) { match.hidden = true; } else {
        match.hidden = false;
        const ok = pw === pw2;
        match.textContent = ok ? 'Las contraseñas coinciden.' : 'Las contraseñas no coinciden.';
        match.style.color = ok ? 'var(--success)' : 'var(--danger)';
    }
}

document.getElementById('form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const errorBox = document.getElementById('registro-error');
    const mostrar = (t) => { errorBox.textContent = t; errorBox.hidden = false; };
    errorBox.hidden = true;

    const falta = ReglasPass.faltante(password);
    if (falta) return mostrar(falta);
    if (password !== password2) return mostrar('Las contraseñas no coinciden.');
    const btn = document.getElementById('btn-registrar');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';

    const body = {
        nombre: document.getElementById('nombre').value,
        correo: document.getElementById('correo').value,
        password,
        telefono: document.getElementById('telefono').value,
        recordar: document.getElementById('recordar').checked,
        boletin: document.getElementById('boletin').checked,
    };
    try {
        const data = await api('/auth/registro-cliente', { method: 'POST', body });
        Sesion.guardarCliente({ ...data.cliente, recordar: body.recordar });
        if (body.recordar) CuentasRecordadas.guardar('cliente', data.cliente);
        const r = await CarritoInvitado.fusionar();
        toast(r.pasados ? `¡Cuenta creada! Tu carrito (${r.pasados} producto(s)) ya está en tu cuenta.` : '¡Cuenta creada!', 'ok');
        r.avisos.forEach((m) => toast(m, 'warn'));
        // Vuelve a donde iba (p. ej. el carrito); si tenía carrito guardado, al carrito.
        const next = new URLSearchParams(location.search).get('next');
        const destino = next && next.startsWith('/') && !next.startsWith('//') ? next : (r.pasados ? '/carrito.html' : '/perfil.html');
        // Con correo por confirmar, primero se escribe el código que le llegó.
        const ir = data.cliente.correo_verificado === false ? `/verificar.html?next=${encodeURIComponent(destino)}` : destino;
        setTimeout(() => location.href = ir, 600);
    } catch (err) {
        mostrar(err.message);
        // "¿Quisiste decir …@gmail.com?" -> un clic lo corrige
        const sug = err.datos && err.datos.sugerencia;
        const caja = document.getElementById('sugerencia-correo');
        if (sug) {
            caja.innerHTML = `¿Quisiste decir <button type="button" class="btn-link">${escHTML(sug)}</button>?`;
            caja.querySelector('button').onclick = () => { document.getElementById('correo').value = sug; caja.hidden = true; errorBox.hidden = true; };
            caja.hidden = false;
        } else caja.hidden = true;
        if (err.datos && err.datos.campo === 'correo') document.getElementById('correo').focus();
        btn.disabled = false; btn.textContent = 'Crear cuenta';
    }
});

// Lista de reglas de la contraseña (se van marcando al escribir).
document.getElementById('reglas-slot').outerHTML = ReglasPass.html('pass-reglas');
ReglasPass.enlazar(document.getElementById('password'), document.getElementById('pass-reglas'));

// Conserva a dónde volver (p. ej. el carrito) al cambiar entre entrar y crear cuenta.
(() => {
    const next = new URLSearchParams(location.search).get('next');
    if (next) document.querySelectorAll('a[href="/login.html"]').forEach((a) => { a.href = '/login.html?next=' + encodeURIComponent(next); });
})();
</script>
</body>
</html>
