<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formas de pago · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>
<div class="modal-overlay" id="modal-generico"><div class="modal" id="modal-generico-body"></div></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
// Formas de pago: Kozmok ya no guarda tarjetas. Los cobros con tarjeta o
// cuenta PayPal los procesa PayPal; aquí se explican las opciones y se ve
// el historial de pagos hechos por PayPal (con su folio y reembolsos).
const ESTADO_PP = {
    capturada: ['Pagado', 'var(--success)'], reembolsada: ['Reembolsado', 'var(--accent-light)'],
    creada: ['Sin pagar', 'var(--text-muted)'], pendiente: ['En revisión', 'var(--warning)'],
    fallida: ['Rechazado', 'var(--danger)'], vencida: ['Venció', 'var(--text-muted)'],
};
montarCuenta('pagos', async (panel) => {
    const [cfg, pagos] = await Promise.all([api('/pagos/paypal/config').catch(() => ({ activo: false })), api('/pagos/paypal/mios').catch(() => [])]);
    const metodo = (ic, tit, txt) => `<div class="card forma-pago"><div class="fp-ico">${icon(ic, 20)}</div><div><strong>${tit}</strong><p>${txt}</p></div></div>`;
    panel.innerHTML = `
        <div class="cuenta-head"><h1>Formas de pago</h1><p>Cómo puedes pagar en Kozmok y tus pagos con PayPal o tarjeta.</p></div>
        <div class="formas-pago">
            ${metodo('card', 'PayPal o tarjeta de débito / crédito', cfg.activo
                ? 'Pagas en la ventana segura de PayPal, con tu cuenta o con tarjeta sin crear cuenta. Kozmok nunca ve ni guarda los datos de tu tarjeta.'
                : 'No disponible por ahora.')}
            ${metodo('download', 'Transferencia SPEI', 'Te damos una referencia; el pedido se confirma cuando recibimos el depósito (3 días para pagar).')}
            ${metodo('pin', 'Pago en tienda', 'Pagas en caja con tu ficha (5 días para pagar).')}
            ${metodo('wallet', 'Monedero Kozmok', 'Usa tu saldo a favor. <a href="/monedero.html">Ver mi monedero</a>.')}
        </div>
        <h3 style="margin:22px 0 10px">Tus pagos con PayPal o tarjeta</h3>
        ${pagos.length === 0 ? '<div class="empty-state">Aún no tienes pagos con PayPal o tarjeta.</div>' : `
        <div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Concepto</th><th>Folio de PayPal</th><th style="text-align:right">Monto</th><th>Estado</th></tr></thead>
            <tbody>${pagos.map((x) => {
                const [et, col] = ESTADO_PP[x.estado] || [x.estado, 'var(--text-muted)'];
                return `<tr>
                    <td>${formatoFecha(x.fecha_captura || x.fecha)}</td>
                    <td>${x.tipo === 'recarga' ? 'Recarga de monedero' : `Pedido <a href="/pedidos.html">${escHTML(x.numero_orden || '')}</a>`}</td>
                    <td class="mono" style="font-size:.8rem">${escHTML(x.captura_id || '—')}</td>
                    <td class="mono" style="text-align:right">${formatoMoneda(x.monto)}</td>
                    <td><span class="tag" style="color:${col};border-color:${col}">${et}</span></td>
                </tr>`; }).join('')}</tbody>
        </table></div>`}`;
});
</script>
</body>
</html>
