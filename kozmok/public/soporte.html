<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atención a clientes · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>
<div class="modal-overlay" id="modal-generico"><div class="modal" id="modal-generico-body"></div></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
// Atención a clientes (Etapa 4): POST /atencion/ticket, GET /atencion/tickets,
// GET /atencion/ticket/{id}. Cada ticket queda también en el CRM.
const EST_LABEL = { abierto: 'Abierto', en_proceso: 'En proceso', respondido: 'Respondido', resuelto: 'Resuelto', cerrado: 'Cerrado' };
let ASUNTOS = {};

montarCuenta('soporte', async (panel) => {
    const idTicket = new URLSearchParams(location.search).get('ticket');
    if (idTicket && /^\d+$/.test(idTicket)) await vistaHilo(panel, idTicket);
    else await vistaLista(panel);
});

async function vistaLista(panel) {
    const [d, pedidos] = await Promise.all([api('/atencion/tickets'), api(`/pedidos/cliente/${Sesion.cliente().id}`).catch(() => [])]);
    ASUNTOS = d.asuntos;
    panel.innerHTML = `
        <div class="cuenta-head"><h1>Atención a clientes</h1><p>Registra una solicitud y dale seguimiento. Respondemos en menos de 24 horas.</p></div>
        <div class="atencion-grid">
            <div class="card">
                <h3 style="margin:0 0 12px">${icon('chat', 17)} Nuevo ticket</h3>
                <div class="field"><label for="tk-cat">Asunto</label>
                    <select id="tk-cat">${Object.entries(ASUNTOS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
                <div class="field"><label for="tk-pedido">Pedido relacionado (opcional)</label>
                    <select id="tk-pedido"><option value="">— Ninguno —</option>${pedidos.slice(0, 20).map((p) => `<option value="${p.id}">${esc(p.numero_orden)} · ${formatoFecha(p.fecha_pedido)}</option>`).join('')}</select></div>
                <div class="field"><label for="tk-msg">Mensaje</label><textarea id="tk-msg" rows="5" maxlength="4000" placeholder="Escribe tu consulta…"></textarea></div>
                <button class="btn btn-primary" style="width:100%" id="btn-ticket">${icon('arrow', 15)} Enviar ticket</button>
            </div>
            <div class="card">
                <h3 style="margin:0 0 12px">Mis tickets</h3>
                ${d.tickets.length === 0
                    ? '<p style="margin:0;color:var(--text-muted)">No tienes tickets. Si algo salió mal con un pedido, escríbenos y te ayudamos.</p>'
                    : d.tickets.map((t) => `
                    <a class="ticket-row" href="/soporte.html?ticket=${t.id}" style="display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--text)">
                        <div style="min-width:0">
                            <span class="mono" style="font-size:.8rem;color:var(--text-muted)">${esc(t.folio)}</span>
                            <div style="font-weight:600">${esc(t.asunto)}</div>
                            <div style="font-size:.78rem;color:var(--text-muted)">${formatoFecha(t.fecha_actualizacion)} · ${t.mensajes} mensaje(s)${t.tiene_respuesta ? ' · con respuesta' : ''}</div>
                        </div>
                        <span><span class="tag estado-${esc(t.estado)}">${EST_LABEL[t.estado] || esc(t.estado)}</span></span>
                    </a>`).join('')}
            </div>
        </div>`;
    document.getElementById('btn-ticket').addEventListener('click', crearTicket);
}

async function crearTicket() {
    const body = {
        categoria: document.getElementById('tk-cat').value,
        mensaje: document.getElementById('tk-msg').value.trim(),
        pedido_id: Number(document.getElementById('tk-pedido').value) || null,
    };
    if (body.mensaje.length < 5) { toast('Escribe tu consulta (al menos 5 caracteres)', 'warn'); return; }
    const btn = document.getElementById('btn-ticket');
    btn.disabled = true;
    try {
        const r = await api('/atencion/ticket', { method: 'POST', body });
        toast(r.message, 'ok');
        location.href = '/soporte.html?ticket=' + r.ticket.id;
    } catch (e) { toast(e.message, 'error'); btn.disabled = false; }
}

async function vistaHilo(panel, id) {
    let t;
    try { t = await api(`/atencion/ticket/${id}`); }
    catch (e) { panel.innerHTML = `<div class="empty-state">${esc(e.message)}<br><a href="/soporte.html">Volver a mis tickets</a></div>`; return; }
    panel.innerHTML = `
        <div class="cuenta-head">
            <a href="/soporte.html" style="font-size:.85rem">← Mis tickets</a>
            <h1 style="margin-top:6px">${esc(t.asunto)}</h1>
            <p><span class="mono">${esc(t.folio)}</span> · <span class="tag estado-${esc(t.estado)}">${EST_LABEL[t.estado] || esc(t.estado)}</span> · abierto el ${formatoFecha(t.fecha_creacion)}</p>
        </div>
        ${t.respuesta ? `<div class="respuesta-equipo"><div style="font-size:.78rem;color:var(--text-muted)">Respuesta del equipo · ${formatoFechaHora(t.fecha_respuesta)}</div><div>${esc(t.respuesta)}</div></div>` : ''}
        <div class="hilo">
            ${t.mensajes.map((m) => `
                <div class="hilo-msg ${m.autor === 'cliente' ? 'mio' : 'equipo'}">
                    <div class="hm-meta">${m.autor === 'cliente' ? 'Tú' : esc(m.usuario_nombre || 'Equipo Kozmok')} · ${formatoFechaHora(m.fecha)}</div>
                    <div class="hm-txt">${esc(m.mensaje)}</div>
                </div>`).join('')}
        </div>
        ${['resuelto', 'cerrado'].includes(t.estado) ? '<p style="color:var(--text-muted);font-size:.85rem">Este ticket está cerrado. Si escribes de nuevo, se vuelve a abrir.</p>' : ''}
        <div class="field" style="margin-top:16px"><textarea id="hilo-txt" rows="3" maxlength="4000" placeholder="Escribe tu mensaje…"></textarea></div>
        <button class="btn btn-primary" id="btn-responder">Enviar mensaje</button>`;
    document.getElementById('btn-responder').addEventListener('click', async () => {
        const mensaje = document.getElementById('hilo-txt').value.trim();
        if (!mensaje) { toast('Escribe un mensaje', 'warn'); return; }
        try { await api(`/atencion/ticket/${t.id}/mensaje`, { method: 'POST', body: { mensaje } }); location.reload(); }
        catch (e) { toast(e.message, 'error'); }
    });
}
</script>
</body>
</html>
