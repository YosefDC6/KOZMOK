<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soporte · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>
<div class="modal-overlay" id="modal-generico"><div class="modal" id="modal-generico-body"></div></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script src="/js/fotos.js"></script>
<script>
let CID = null;
const EST_LABEL = { abierto: 'Abierto', en_proceso: 'En proceso', resuelto: 'Resuelto', cerrado: 'Cerrado' };

montarCuenta('soporte', async (panel, P) => {
    CID = P.id;
    const qs = new URLSearchParams(location.search);
    const idTicket = qs.get('ticket');
    if (idTicket) await vistaHilo(panel, idTicket);
    else {
        await vistaLista(panel);
        // Desde "Mis pedidos" → "Ayuda con este pedido"
        if (qs.get('pedido')) formTicket({ categoria: 'pedido', pedido_id: Number(qs.get('pedido')) });
        // Desde "Mis cupones" → "¿Problema con este cupón?" (o el checkout)
        else if (qs.get('nuevo')) formTicket({ categoria: qs.get('categoria') || 'general', cupon_id: Number(qs.get('cupon')) || null, asunto: qs.get('asunto') || '' });
    }
});

async function vistaLista(panel) {
    const list = await api(`/clientes/${CID}/tickets`);
    panel.innerHTML = `
        <div class="cuenta-head" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
            <div><h1>Soporte</h1><p>Abre un ticket y te damos seguimiento por aquí.</p></div>
            <button class="btn btn-primary btn-sm" onclick="formTicket()">Nuevo ticket</button>
        </div>
        ${list.length === 0
            ? '<div class="empty-state">No tienes tickets. Si algo salió mal con un pedido, crea uno y te ayudamos.</div>'
            : list.map((t) => `
                <a class="card ticket-row" href="/soporte.html?ticket=${t.id}">
                    <div>
                        <span class="mono" style="font-size:.82rem">${t.folio}</span>
                        <div style="font-weight:600">${escHTML(t.asunto)}</div>
                        <div style="font-size:.8rem;color:var(--text-muted)">${t.numero_orden ? `Pedido <span class="mono">${escHTML(t.numero_orden)}</span> · ` : ''}${formatoFecha(t.fecha_actualizacion)} · ${t.mensajes} mensaje(s)</div>
                    </div>
                    <span class="tag estado-${t.estado}">${EST_LABEL[t.estado]}</span>
                </a>
            `).join('')}
    `;
}

let TICKET_PREVIO = {};
async function vistaHilo(panel, id) {
    let t;
    try { t = await api(`/clientes/${CID}/tickets/${id}`); }
    catch (e) { panel.innerHTML = `<div class="empty-state">${escHTML(e.message)}<br><a href="/soporte.html">Volver a soporte</a></div>`; return; }
    // Para "Abrir un seguimiento": hereda todo de este ticket (ver formSeguimiento).
    TICKET_PREVIO = t;
    panel.innerHTML = `
        <div class="cuenta-head">
            <a href="/soporte.html" style="font-size:.85rem">← Todos mis tickets</a>
            <h1 style="margin-top:6px">${escHTML(t.asunto)}</h1>
            <p><span class="mono">${t.folio}</span> · <span class="tag estado-${t.estado}">${EST_LABEL[t.estado]}</span>
               ${t.numero_orden ? ` · Pedido <a class="mono" href="/pedidos.html">${escHTML(t.numero_orden)}</a>` : ''}
               ${t.cupon_codigo ? ` · Cupón <a class="mono" href="/cupones.html">${escHTML(t.cupon_codigo)}</a>` : ''}
               ${t.origen_folio ? ` · Seguimiento de <a class="mono" href="/soporte.html?ticket=${t.ticket_origen_id}">${escHTML(t.origen_folio)}</a>` : ''}</p>
        </div>
        <div class="hilo">
            ${t.mensajes.map((m) => `
                <div class="hilo-msg ${m.autor === 'cliente' ? 'mio' : 'equipo'}">
                    <div class="hm-meta">${m.autor === 'cliente' ? 'Tú' : (m.usuario_nombre || 'Equipo Kozmok')} · ${formatoFecha(m.fecha)}</div>
                    ${m.mensaje ? `<div class="hm-txt">${m.mensaje.replace(/</g, '&lt;')}</div>` : ''}
                    ${(m.fotos || []).length ? `<div class="foto-lista">${m.fotos.map((f) => `<a href="/api/clientes/${CID}/tickets/${t.id}/fotos/${f.id}" target="_blank" rel="noopener" class="foto-prev"><img src="/api/clientes/${CID}/tickets/${t.id}/fotos/${f.id}" alt="${escHTML(f.nombre || 'foto')}" loading="lazy" /></a>`).join('')}</div>` : ''}
                </div>
            `).join('')}
        </div>
        ${['resuelto', 'cerrado'].includes(t.estado)
            ? tarjetaCierre(t)
            : `<div class="field" style="margin-top:16px"><textarea id="hilo-txt" rows="3" maxlength="4000" placeholder="Escribe tu mensaje…"></textarea></div>
               <div class="foto-sel"><label class="btn btn-ghost btn-sm foto-btn">${icon('image', 14)} Agregar fotos<input type="file" id="hilo-fotos" accept="image/*" multiple hidden /></label>
                   <small>Hasta 3 (JPG, PNG o WebP). Útil como evidencia de un producto dañado.</small></div>
               <div class="foto-lista" id="hilo-prev"></div>
               <button class="btn btn-primary" onclick="responder(${t.id}, this)">Enviar mensaje</button>`}
    `;
    if (document.getElementById('hilo-fotos')) SEL_HILO = FotosReclamo.selector(document.getElementById('hilo-fotos'), document.getElementById('hilo-prev'), { alError: (m) => toast(m, 'warn') });
}
let SEL_HILO = null, SEL_NUEVO = null;

async function responder(id, btn) {
    const mensaje = document.getElementById('hilo-txt').value.trim();
    const fotos = SEL_HILO ? SEL_HILO.fotos() : [];
    if (!mensaje && !fotos.length) { toast('Escribe un mensaje o agrega una foto', 'warn'); return; }
    await conBoton(btn, async () => {
        try {
            await api(`/clientes/${CID}/tickets/${id}/mensajes`, { method: 'POST', body: { mensaje, fotos } });
            location.reload();
        } catch (e) { toast(e.message, 'error'); }
    });
}

// Ticket resuelto o cerrado: "¿Quedó resuelto?" y el estado de la
// solicitud de seguimiento (en revisión, rechazada con su motivo o aprobada
// con el ticket nuevo). Un seguimiento no se abre directo: se solicita y
// Soporte decide.
function tarjetaCierre(t) {
    const s = t.seguimiento || {};
    const ultima = (s.solicitudes || []).slice(-1)[0];
    const fecha = (d) => formatoFechaHora(d);
    let estadoSol = '';
    if (s.pendiente) {
        estadoSol = `<div class="tk-cierre-sol espera">${icon('clock', 18)}<div><strong>Tu solicitud de seguimiento está en revisión</strong>
            <p>La enviaste el ${escHTML(fecha(s.pendiente.fecha))}; Soporte la revisa y te avisamos por correo.</p></div></div>`;
    } else if (ultima && ultima.estado === 'aprobada') {
        estadoSol = `<div class="tk-cierre-sol ok">${icon('check', 18)}<div><strong>Abrimos el seguimiento ${escHTML(ultima.ticket_nuevo_folio || '')}</strong>
            <p>Ahí continúa tu caso.</p>${ultima.ticket_nuevo_id ? `<a class="btn btn-primary btn-sm" href="/soporte.html?ticket=${ultima.ticket_nuevo_id}">Ir a ${escHTML(ultima.ticket_nuevo_folio)}</a>` : ''}</div></div>`;
    } else if (ultima && ultima.estado === 'rechazada') {
        estadoSol = `<div class="tk-cierre-sol no">${icon('alert', 18)}<div><strong>No abrimos el seguimiento</strong>
            <p><b>Motivo:</b> ${escHTML(ultima.motivo || '')}</p></div></div>`;
    }
    // "¿Quedó resuelto?" solo en un ticket resuelto que aún no contesta.
    const pregunta = t.estado === 'resuelto' && !t.confirmacion && !s.pendiente && !(s.solicitudes || []).length ? `
        <div class="tk-cierre-pregunta">
            <div><strong>¿Quedó resuelto tu problema?</strong><p>Si sí, cerramos el ticket. Si no, puedes pedir un seguimiento: Soporte lo revisa.</p></div>
            <div class="tk-cierre-botones">
                <button class="btn btn-primary btn-sm" onclick="confirmarResuelto(${t.id}, this)">${icon('check', 14)} Sí, quedó resuelto</button>
                <button class="btn btn-outline btn-sm" onclick="formSeguimiento(TICKET_PREVIO)">No, sigue pasando</button>
            </div>
        </div>` : '';
    const pedir = !pregunta && s.puede_solicitar ? `<button class="btn btn-outline btn-sm" onclick="formSeguimiento(TICKET_PREVIO)">${ultima && ultima.estado === 'rechazada' ? 'Enviar otra solicitud' : '¿Sigue o volvió a pasar? Solicitar seguimiento'}</button>` : '';
    const limite = !s.puede_solicitar && !s.pendiente && s.rechazos >= s.max_rechazos ? `<p class="tk-cierre-nota">${escHTML(s.razon)}</p>` : '';
    return `<div class="card tk-cierre">
        <p class="tk-cierre-estado">Este ticket está <strong>${EST_LABEL[t.estado].toLowerCase()}</strong> y ya no recibe mensajes.</p>
        ${t.estado === 'cerrado' && t.motivo_cierre ? `<div class="tk-cierre-motivo">${icon('info', 16)}<div><strong>¿Por qué se cerró?</strong><p>${escHTML(t.motivo_cierre)}</p>${t.fecha_cierre ? `<span>Cerrado el ${escHTML(formatoFechaHora(t.fecha_cierre))}</span>` : ''}</div></div>` : ''}
        ${pregunta}${estadoSol}
        ${pedir || limite ? `<div class="tk-cierre-acciones">${pedir}${limite}<a href="#" onclick="formTicket(); return false;" class="tk-cierre-otro">¿Es otro problema? Abre un ticket nuevo</a></div>`
            : (pregunta ? '' : `<div class="tk-cierre-acciones"><a href="#" onclick="formTicket(); return false;" class="tk-cierre-otro">¿Es otro problema? Abre un ticket nuevo</a></div>`)}
    </div>`;
}
async function confirmarResuelto(id, btn) {
    await conBoton(btn, async () => {
        try { const r = await api(`/clientes/${CID}/tickets/${id}/confirmar`, { method: 'POST', body: {} }); toast(r.message, 'ok'); setTimeout(() => location.replace('/soporte.html?ticket=' + id), 600); }
        catch (e) { toast(e.message, 'error'); }
    }, 'Cerrando…');
}

// Formulario para SOLICITAR el seguimiento: asunto, categoría, pedido y
// cupón vienen del original y no se cambian. Se escribe qué sigue pasando
// y se agregan fotos; Soporte aprueba o rechaza.
const CAT_LABEL = { pedido: 'Un pedido', garantia: 'Garantía', devolucion: 'Devolución o cambio', facturacion: 'Facturación', cupon: 'Un cupón de descuento', cuenta: 'Mi cuenta', general: 'Otro' };
function formSeguimiento(t) {
    document.getElementById('modal-generico-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-generico').classList.remove('open')">${icon('x', 20)}</button>
        <h3>Solicitar seguimiento de ${escHTML(t.folio)}</h3>
        <p class="tk-seg-explica">Soporte revisa tu solicitud: si la aprueba, abrimos un ticket ligado a este; si no, te explicamos por qué.</p>
        <div class="tk-seg-resumen">
            <div class="tk-seg-fila"><span>Asunto</span><strong>${escHTML(String(t.asunto).replace(/^Seguimiento a TK-\d+: /, ''))}</strong></div>
            <div class="tk-seg-fila"><span>Categoría</span><strong>${escHTML(CAT_LABEL[t.categoria] || t.categoria)}</strong></div>
            ${t.numero_orden ? `<div class="tk-seg-fila"><span>Pedido</span><strong class="mono">${escHTML(t.numero_orden)}</strong></div>` : ''}
            ${t.cupon_codigo ? `<div class="tk-seg-fila"><span>Cupón</span><strong class="mono">${escHTML(t.cupon_codigo)}</strong></div>` : ''}
            <small>Soporte verá la conversación de ${escHTML(t.folio)}.</small>
        </div>
        <div class="field"><label>¿Qué sigue pasando?</label><textarea id="tk-desc" rows="4" maxlength="4000" placeholder="Cuéntanos qué pasó desde la última respuesta y por qué no quedó resuelto."></textarea></div>
        <div class="field"><label>Fotos <span style="color:var(--text-muted);font-weight:400">(opcional, hasta 3)</span></label>
            <div class="foto-sel"><label class="btn btn-ghost btn-sm foto-btn">${icon('image', 14)} Agregar fotos<input type="file" id="tk-fotos" accept="image/*" multiple hidden /></label>
                <small>Evidencia de un producto dañado, el empaque o una captura de pantalla.</small></div>
            <div class="foto-lista" id="tk-prev"></div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="crearSeguimiento(${t.id}, this)">Enviar solicitud</button>
        <p class="tk-seg-otro">¿Es otro problema? <a href="#" onclick="formTicket(); return false;">Abre un ticket nuevo</a></p>
    `;
    SEL_NUEVO = FotosReclamo.selector(document.getElementById('tk-fotos'), document.getElementById('tk-prev'), { alError: (m) => toast(m, 'warn') });
    document.getElementById('modal-generico').classList.add('open');
    setTimeout(() => document.getElementById('tk-desc').focus(), 50);
}
async function crearSeguimiento(origenId, btn) {
    const descripcion = document.getElementById('tk-desc').value.trim();
    if (descripcion.length < 15) { toast('Cuéntanos qué sigue pasando (una o dos frases): Soporte lo revisa', 'warn'); return; }
    await conBoton(btn, async () => {
        try {
            const r = await api(`/clientes/${CID}/tickets/${origenId}/seguimiento`, { method: 'POST',
                body: { mensaje: descripcion, fotos: SEL_NUEVO ? SEL_NUEVO.fotos() : [] } });
            toast(r.message, 'ok');
            location.replace('/soporte.html?ticket=' + origenId);
        } catch (e) { toast(e.message, 'error'); }
    }, 'Enviando…');
}

function formTicket(previo = {}) {
    document.getElementById('modal-generico-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-generico').classList.remove('open')">${icon('x', 20)}</button>
        <h3>Nuevo ticket de soporte</h3>
        <div class="field"><label>Asunto</label><input id="tk-asunto" placeholder="Resumen del problema" /></div>
        <div class="field"><label>Categoría</label>
                <select id="tk-cat">
                    <option value="pedido">Un pedido</option>
                    <option value="garantia">Garantía</option>
                    <option value="devolucion">Devolución o cambio</option>
                    <option value="facturacion">Facturación</option>
                    <option value="cupon">Un cupón de descuento</option>
                    <option value="cuenta">Mi cuenta</option>
                    <option value="general">Otro</option>
                </select>
        </div>
        <div class="field" id="tk-ped-wrap"><label>Pedido relacionado <span style="color:var(--text-muted);font-weight:400">(opcional)</span></label>
            <select id="tk-pedido"><option value="">Cargando tus pedidos…</option></select>
            <small id="tk-ped-nota" style="color:var(--text-muted)"></small>
        </div>
        <div class="field" id="tk-cup-wrap" style="display:none"><label>¿Qué cupón?</label>
            <select id="tk-cupon"><option value="">Cargando tus cupones…</option></select>
        </div>
        <div class="field"><label>Describe el problema</label><textarea id="tk-desc" rows="4" maxlength="4000" placeholder="Cuéntanos qué pasó."></textarea></div>
        <div class="field"><label>Fotos <span style="color:var(--text-muted);font-weight:400">(opcional, hasta 3)</span></label>
            <div class="foto-sel"><label class="btn btn-ghost btn-sm foto-btn">${icon('image', 14)} Agregar fotos<input type="file" id="tk-fotos" accept="image/*" multiple hidden /></label>
                <small>Evidencia de un producto dañado, el empaque o una captura de pantalla.</small></div>
            <div class="foto-lista" id="tk-prev"></div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="crearTicket(this)">Crear ticket</button>
    `;
    SEL_NUEVO = FotosReclamo.selector(document.getElementById('tk-fotos'), document.getElementById('tk-prev'), { alError: (m) => toast(m, 'warn') });
    if (previo.asunto) document.getElementById('tk-asunto').value = previo.asunto.slice(0, 160);
    if (previo.categoria) document.getElementById('tk-cat').value = previo.categoria;
    document.getElementById('tk-cat').addEventListener('change', mostrarPedidoTicket);
    document.getElementById('modal-generico').classList.add('open');
    cargarPedidosTicket(previo.pedido_id);
    cargarCuponesTicket(previo.cupon_id);
}

// Cupones de la cuenta, para la categoría "Un cupón de descuento".
let CUPONES_CLIENTE = null;
async function cargarCuponesTicket(elegido) {
    const sel = document.getElementById('tk-cupon');
    try { if (!CUPONES_CLIENTE) CUPONES_CLIENTE = await api(`/clientes/${CID}/cupones`); } catch { CUPONES_CLIENTE = []; }
    if (!document.body.contains(sel)) return;
    const EST = { disponible: 'disponible', usado: 'usado', vencido: 'vencido', cancelado: 'cancelado' };
    sel.innerHTML = '<option value="">Ninguno en particular</option>' + CUPONES_CLIENTE.map((c) =>
        `<option value="${c.id}">${escHTML(c.codigo)} · ${escHTML(c.beneficio)} · ${EST[c.estado] || c.estado}</option>`).join('');
    if (elegido && CUPONES_CLIENTE.some((c) => Number(c.id) === Number(elegido))) sel.value = String(elegido);
    mostrarPedidoTicket();
}

// Categorías en las que tiene sentido elegir un pedido.
const CAT_CON_PEDIDO = ['pedido', 'garantia', 'devolucion', 'facturacion'];
let PEDIDOS_CLIENTE = null;
async function cargarPedidosTicket(elegido) {
    const sel = document.getElementById('tk-pedido');
    try { if (!PEDIDOS_CLIENTE) PEDIDOS_CLIENTE = await api(`/pedidos/cliente/${CID}`); }
    catch { PEDIDOS_CLIENTE = []; }
    if (!document.body.contains(sel)) return;
    if (elegido) sel.dataset.elegido = String(elegido);
    mostrarPedidoTicket();
}
// Qué pedidos se pueden elegir según la categoría (la regla la manda el
// servidor en ticket_categorias y la vuelve a revisar al crear el ticket):
// garantía = entregados; devolución = entregados dentro del plazo;
// facturación = pagados; "Un pedido" = todos, agrupados por estado.
const SIN_PEDIDOS_PARA = {
    garantia: 'No tienes pedidos entregados. La garantía empieza cuando recibes tu pedido.',
    devolucion: 'No tienes pedidos entregados dentro del plazo para devolver.',
    facturacion: 'No tienes pedidos pagados para facturar.',
    pedido: 'Aún no tienes pedidos.',
};
function opcionesPedidoTicket(cat) {
    const sel = document.getElementById('tk-pedido');
    const previo = sel.value || sel.dataset.elegido || '';
    delete sel.dataset.elegido;
    const lista = (PEDIDOS_CLIENTE || []).filter((p) => (p.ticket_categorias || ['pedido']).includes(cat));
    const estado = (e) => String(e || '').replace(/_/g, ' ');
    const opt = (p) => `<option value="${p.id}">${escHTML(p.numero_orden)} · ${escHTML(estado(p.estado))} · ${formatoMoneda(p.total)} · ${formatoFecha(p.fecha_pedido)}</option>`;
    let html = '<option value="">Ninguno / no aplica</option>';
    if (cat === 'pedido') {
        const grupos = [['En curso', (p) => !['entregado', 'cancelado'].includes(p.estado)], ['Entregados', (p) => p.estado === 'entregado'], ['Cancelados', (p) => p.estado === 'cancelado']];
        for (const [nombre, f] of grupos) { const g = lista.filter(f); if (g.length) html += `<optgroup label="${nombre}">${g.map(opt).join('')}</optgroup>`; }
    } else html += lista.map(opt).join('');
    sel.innerHTML = html;
    if (previo && lista.some((p) => String(p.id) === String(previo))) sel.value = String(previo);
    document.getElementById('tk-ped-nota').textContent = lista.length ? '' : (SIN_PEDIDOS_PARA[cat] || '');
    return lista;
}
function mostrarPedidoTicket() {
    const cat = document.getElementById('tk-cat').value;
    const wrap = document.getElementById('tk-ped-wrap');
    const ver = CAT_CON_PEDIDO.includes(cat);
    wrap.style.display = ver ? '' : 'none';
    let lista = [];
    if (!ver) document.getElementById('tk-pedido').value = '';
    else if (PEDIDOS_CLIENTE) lista = opcionesPedidoTicket(cat);
    const wc = document.getElementById('tk-cup-wrap');
    if (wc) { wc.style.display = cat === 'cupon' ? '' : 'none'; if (cat !== 'cupon') document.getElementById('tk-cupon').value = ''; }
    // En "Un pedido" se pide elegirlo si tiene pedidos.
    wrap.querySelector('label span').textContent = cat === 'pedido' && lista.length ? '' : '(opcional)';
}

async function crearTicket(btn) {
    const body = {
        asunto: document.getElementById('tk-asunto').value.trim(),
        categoria: document.getElementById('tk-cat').value,
        descripcion: document.getElementById('tk-desc').value.trim(),
        pedido_id: Number(document.getElementById('tk-pedido').value) || null,
        cupon_id: Number(document.getElementById('tk-cupon').value) || null,
        fotos: SEL_NUEVO ? SEL_NUEVO.fotos() : [],
    };
    if (!body.asunto || !body.descripcion) { toast('Asunto y descripción son obligatorios', 'warn'); return; }
    if (body.categoria === 'pedido' && !body.pedido_id && PEDIDOS_CLIENTE && PEDIDOS_CLIENTE.length) { toast('Elige el pedido con el que necesitas ayuda', 'warn'); return; }
    await conBoton(btn, async () => {
        try {
            const r = await api(`/clientes/${CID}/tickets`, { method: 'POST', body });
            toast(r.ticket.repetido ? `Ya habías enviado este ticket (${r.ticket.folio})` : 'Ticket ' + r.ticket.folio + ' creado', 'ok');
            // replace: "atrás" ya no regresa al formulario de nuevo ticket.
            location.replace('/soporte.html?ticket=' + r.ticket.id);
        } catch (e) { toast(e.message, 'error'); }
    }, 'Creando…');
}
</script>
</body>
</html>
