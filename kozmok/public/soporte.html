<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/img/kzk.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soporte · Kozmok</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/arcade.css" />
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="cuenta-shell">
    <nav class="cuenta-nav" id="cuenta-nav"></nav>
    <main class="cuenta-panel" id="cuenta-panel"><div class="empty-state">Cargando…</div></main>
</div>

<div id="footer-placeholder"></div>
<div class="modal-overlay" id="modal-generico"><div class="modal" id="modal-generico-body"></div></div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/cuenta.js"></script>
<script>
let CID = null;
const EST_LABEL = { abierto: 'Abierto', en_proceso: 'En proceso', resuelto: 'Resuelto', cerrado: 'Cerrado' };

montarCuenta('soporte', async (panel, P) => {
    CID = P.id;
    const qs = new URLSearchParams(location.search);
    const idTicket = qs.get('ticket');
    if (idTicket) await vistaHilo(panel, idTicket);
    else {
        await vistaLista(panel);
        // Desde "Mis pedidos" → "Ayuda con este pedido"
        if (qs.get('pedido')) formTicket({ categoria: 'pedido', pedido_id: Number(qs.get('pedido')) });
    }
});

async function vistaLista(panel) {
    const list = await api(`/clientes/${CID}/tickets`);
    panel.innerHTML = `
        <div class="cuenta-head" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
            <div><h1>Soporte</h1><p>Abre un ticket y te damos seguimiento por aquí.</p></div>
            <button class="btn btn-primary btn-sm" onclick="formTicket()">Nuevo ticket</button>
        </div>
        ${list.length === 0
            ? '<div class="empty-state">No tienes tickets. Si algo salió mal con un pedido, crea uno y te ayudamos.</div>'
            : list.map((t) => `
                <a class="card ticket-row" href="/soporte.html?ticket=${t.id}">
                    <div>
                        <span class="mono" style="font-size:.82rem">${t.folio}</span>
                        <div style="font-weight:600">${escHTML(t.asunto)}</div>
                        <div style="font-size:.8rem;color:var(--text-muted)">${t.numero_orden ? `Pedido <span class="mono">${escHTML(t.numero_orden)}</span> · ` : ''}${formatoFecha(t.fecha_actualizacion)} · ${t.mensajes} mensaje(s)</div>
                    </div>
                    <span class="tag estado-${t.estado}">${EST_LABEL[t.estado]}</span>
                </a>
            `).join('')}
    `;
}

let TICKET_PREVIO = {};
async function vistaHilo(panel, id) {
    let t;
    try { t = await api(`/clientes/${CID}/tickets/${id}`); }
    catch (e) { panel.innerHTML = `<div class="empty-state">${escHTML(e.message)}<br><a href="/soporte.html">Volver a soporte</a></div>`; return; }
    TICKET_PREVIO = { asunto: 'Seguimiento a ' + t.folio + ': ' + t.asunto, categoria: t.categoria, pedido_id: t.pedido_id };
    panel.innerHTML = `
        <div class="cuenta-head">
            <a href="/soporte.html" style="font-size:.85rem">← Todos mis tickets</a>
            <h1 style="margin-top:6px">${escHTML(t.asunto)}</h1>
            <p><span class="mono">${t.folio}</span> · <span class="tag estado-${t.estado}">${EST_LABEL[t.estado]}</span>
               ${t.numero_orden ? ` · Pedido <a class="mono" href="/pedidos.html">${escHTML(t.numero_orden)}</a>` : ''}</p>
        </div>
        <div class="hilo">
            ${t.mensajes.map((m) => `
                <div class="hilo-msg ${m.autor === 'cliente' ? 'mio' : 'equipo'}">
                    <div class="hm-meta">${m.autor === 'cliente' ? 'Tú' : (m.usuario_nombre || 'Equipo Kozmok')} · ${formatoFecha(m.fecha)}</div>
                    <div class="hm-txt">${m.mensaje.replace(/</g, '&lt;')}</div>
                </div>
            `).join('')}
        </div>
        ${['resuelto', 'cerrado'].includes(t.estado)
            ? `<div class="card" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                   <p style="margin:0;color:var(--text-muted);font-size:.9rem">Este ticket está <strong>${EST_LABEL[t.estado].toLowerCase()}</strong> y ya no recibe mensajes. Si necesitas más ayuda, abre uno nuevo.</p>
                   <button class="btn btn-primary btn-sm" onclick="formTicket(TICKET_PREVIO)">Abrir un ticket nuevo</button>
               </div>`
            : `<div class="field" style="margin-top:16px"><textarea id="hilo-txt" rows="3" maxlength="4000" placeholder="Escribe tu mensaje…"></textarea></div>
               <button class="btn btn-primary" onclick="responder(${t.id})">Enviar mensaje</button>`}
    `;
}

async function responder(id) {
    const mensaje = document.getElementById('hilo-txt').value.trim();
    if (!mensaje) { toast('Escribe un mensaje', 'warn'); return; }
    try {
        await api(`/clientes/${CID}/tickets/${id}/mensajes`, { method: 'POST', body: { mensaje } });
        location.reload();
    } catch (e) { toast(e.message, 'error'); }
}

function formTicket(previo = {}) {
    document.getElementById('modal-generico-body').innerHTML = `
        <button class="modal-close" onclick="document.getElementById('modal-generico').classList.remove('open')">${icon('x', 20)}</button>
        <h3>Nuevo ticket de soporte</h3>
        <div class="field"><label>Asunto</label><input id="tk-asunto" placeholder="Resumen del problema" /></div>
        <div class="field"><label>Categoría</label>
                <select id="tk-cat">
                    <option value="pedido">Un pedido</option>
                    <option value="garantia">Garantía</option>
                    <option value="devolucion">Devolución o cambio</option>
                    <option value="facturacion">Facturación</option>
                    <option value="cuenta">Mi cuenta</option>
                    <option value="general">Otro</option>
                </select>
        </div>
        <div class="field" id="tk-ped-wrap"><label>Pedido relacionado <span style="color:var(--text-muted);font-weight:400">(opcional)</span></label>
            <select id="tk-pedido"><option value="">Cargando tus pedidos…</option></select>
            <small id="tk-ped-nota" style="color:var(--text-muted)"></small>
        </div>
        <div class="field"><label>Describe el problema</label><textarea id="tk-desc" rows="4" maxlength="4000" placeholder="Cuéntanos qué pasó."></textarea></div>
        <button class="btn btn-primary" style="width:100%" onclick="crearTicket()">Crear ticket</button>
    `;
    if (previo.asunto) document.getElementById('tk-asunto').value = previo.asunto.slice(0, 160);
    if (previo.categoria) document.getElementById('tk-cat').value = previo.categoria;
    document.getElementById('tk-cat').addEventListener('change', mostrarPedidoTicket);
    document.getElementById('modal-generico').classList.add('open');
    cargarPedidosTicket(previo.pedido_id);
}

// Categorías en las que tiene sentido elegir un pedido.
const CAT_CON_PEDIDO = ['pedido', 'garantia', 'devolucion', 'facturacion'];
let PEDIDOS_CLIENTE = null;
async function cargarPedidosTicket(elegido) {
    const sel = document.getElementById('tk-pedido');
    try { if (!PEDIDOS_CLIENTE) PEDIDOS_CLIENTE = await api(`/pedidos/cliente/${CID}`); }
    catch { PEDIDOS_CLIENTE = []; }
    if (!document.body.contains(sel)) return;
    const estado = (e) => String(e || '').replace(/_/g, ' ');
    sel.innerHTML = '<option value="">Ninguno / no aplica</option>' + PEDIDOS_CLIENTE.map((p) =>
        `<option value="${p.id}">${escHTML(p.numero_orden)} · ${escHTML(estado(p.estado))} · ${formatoMoneda(p.total)} · ${formatoFecha(p.fecha_pedido)}</option>`).join('');
    if (elegido && PEDIDOS_CLIENTE.some((p) => Number(p.id) === Number(elegido))) sel.value = String(elegido);
    document.getElementById('tk-ped-nota').textContent = PEDIDOS_CLIENTE.length ? '' : 'Aún no tienes pedidos.';
    mostrarPedidoTicket();
}
function mostrarPedidoTicket() {
    const cat = document.getElementById('tk-cat').value;
    const wrap = document.getElementById('tk-ped-wrap');
    const ver = CAT_CON_PEDIDO.includes(cat);
    wrap.style.display = ver ? '' : 'none';
    if (!ver) document.getElementById('tk-pedido').value = '';
    // En "Un pedido" se pide elegirlo si tiene pedidos.
    wrap.querySelector('label span').textContent = cat === 'pedido' && PEDIDOS_CLIENTE && PEDIDOS_CLIENTE.length ? '' : '(opcional)';
}

async function crearTicket() {
    const body = {
        asunto: document.getElementById('tk-asunto').value.trim(),
        categoria: document.getElementById('tk-cat').value,
        descripcion: document.getElementById('tk-desc').value.trim(),
        pedido_id: Number(document.getElementById('tk-pedido').value) || null,
    };
    if (!body.asunto || !body.descripcion) { toast('Asunto y descripción son obligatorios', 'warn'); return; }
    if (body.categoria === 'pedido' && !body.pedido_id && PEDIDOS_CLIENTE && PEDIDOS_CLIENTE.length) { toast('Elige el pedido con el que necesitas ayuda', 'warn'); return; }
    try {
        const r = await api(`/clientes/${CID}/tickets`, { method: 'POST', body });
        toast('Ticket ' + r.ticket.folio + ' creado', 'ok');
        location.href = '/soporte.html?ticket=' + r.ticket.id;
    } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
